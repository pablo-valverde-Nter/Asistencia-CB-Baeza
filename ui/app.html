          if (!res.success) throw new Error(res.error || 'No se pudieron cargar las opciones de recuperación');
          self._destinos = res.destinos || []; self._paso = 1; self._pintar();
        }).catch(function(error) { if (version === self._version) self._pintar('<p class="account-notice">'+_statsTexto(error.message)+'</p><button class="btn btn-secondary btn-full" onclick="App.views[\'recuperar-acceso\'].render()">Reintentar</button>'); });
      },
      _pintar: function(body) {
        var self = this;
        if (!body && this._paso === 1) body = '<h2>Elige dónde recibir el código</h2><p>Solo mostramos los correos registrados en tu ficha.</p><fieldset class="recovery-destinations"><legend class="sr-only">Correo de recuperación</legend>' + this._destinos.map(function(d,n) { return '<label class="recovery-destination"><input type="radio" name="recovery-destino" value="'+_statsTexto(d.id)+'" '+(n === 0 ? 'checked' : '')+'><span><strong>'+_statsTexto(d.etiqueta)+'</strong><span translate="no">'+_statsTexto(d.email)+'</span></span></label>'; }).join('') + '</fieldset><button class="btn btn-primary btn-full" onclick="App.views[\'recuperar-acceso\'].enviar(false)">Enviar código</button>';
        if (!body && this._paso === 2) body = '<h2>Introduce el código</h2><p>Hemos enviado un código de 6 dígitos. Caduca en 10 minutos.</p><p translate="no">'+_statsTexto(this._destino.email)+'</p><form id="recovery-code-form"><div class="form-group"><label for="recovery-code">Código de recuperación</label><input id="recovery-code" class="recovery-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button class="btn btn-primary btn-full" type="submit">Verificar código</button></form><button id="recovery-resend" class="btn btn-secondary btn-full mt-8" onclick="App.views[\'recuperar-acceso\'].enviar(true)">Reenviar código</button>';
        if (!body && this._paso === 3) body = '<h2>Credenciales recuperadas</h2><p>Consérvalas en un lugar seguro y no las compartas.</p><div class="form-group"><label for="recovery-pin">PIN</label><input id="recovery-pin" class="recovery-secret" type="password" readonly autocomplete="off" value="'+_statsTexto(this._secretos.pin)+'"></div>' + (this._secretos.codigoSeguridad ? '<div class="form-group"><label for="recovery-security">Código de seguridad</label><input id="recovery-security" class="recovery-secret" type="password" readonly autocomplete="off" value="'+_statsTexto(this._secretos.codigoSeguridad)+'"></div>' : '') + '<button id="recovery-reveal" type="button" class="btn btn-secondary btn-full" aria-pressed="false" onclick="App.views[\'recuperar-acceso\'].revelar(this)">Mostrar credenciales</button><button type="button" class="btn btn-primary btn-full mt-8" onclick="App.navigate(\'seguridad-opcion\',{opcion:\'pin\'})">Cambiar PIN</button>';
        document.getElementById('recuperar-acceso-contenido').innerHTML = '<div class="account-intro"><span class="account-eyebrow">RECUPERA TU ACCESO</span><h2>¿Olvidaste tu PIN o código?</h2></div><div class="account-card">'+body+'<p id="recovery-error" class="recovery-error" role="alert"></p></div>';
        var form = document.getElementById('recovery-code-form');
        if (form) form.onsubmit = function(e) { e.preventDefault(); self.verificar(); };
        if (this._paso === 2) this._cuentaAtras();
      },
      _error: function(error) { var el = document.getElementById('recovery-error'); if (el) el.textContent = error ? (error.message || 'Error de conexión') : ''; },
      _bloquear: function(busy) { this._busy = busy; document.querySelectorAll('#recuperar-acceso-contenido button').forEach(function(button) { button.disabled = busy; }); if (!busy && this._paso === 2) this._cuentaAtras(); },
      enviar: function(reenviar) {
        if (this._busy || (reenviar && Date.now() < this._reenviarDesde)) return Promise.resolve();
        if (!reenviar) {
          var selected = document.querySelector('input[name="recovery-destino"]:checked');
          this._destino = selected && this._destinos.find(function(d) { return d.id === selected.value; });
        }
        if (!this._destino) return Promise.resolve();
        var self = this, version = this._version;
        var token = App.operation.begin('recovery-send', { pending: 'Enviando c\u00f3digo\u2026', success: 'C\u00f3digo enviado' });
        if (!token) return Promise.resolve();
        this._error(null);
        this._bloquear(true);
        return server('solicitarCodigoRecuperacion',this._destino.id).then(function(res) {
          if (!res.success) throw new Error(res.error || 'No se pudo enviar el código');
          App.operation.succeed(token);
          if (version !== self._version) return;
          self._reenviarDesde = Date.now()+60000; self._paso = 2; self._pintar();
        }).catch(function(error) { App.operation.fail(token, (error && error.message) || 'Error de conexión'); }).finally(function() { if (version === self._version) self._bloquear(false); });
      },
      _cuentaAtras: function() {
        clearInterval(this._timer);
        var self = this;
        var tick = function() {
          var button = document.getElementById('recovery-resend');
          if (!button) { clearInterval(self._timer); return; }
          var seconds = Math.max(0,Math.ceil((self._reenviarDesde-Date.now())/1000));
          button.disabled = self._busy || seconds > 0;
          button.textContent = seconds ? App.i18n.texto('Reenviar código')+' ('+seconds+' s)' : App.i18n.texto('Reenviar código');
          if (!seconds) clearInterval(self._timer);
        };
        tick(); if (Date.now() < this._reenviarDesde) this._timer = setInterval(tick,1000);
      },
      verificar: function() {
        if (this._busy) return Promise.resolve();
        var code = document.getElementById('recovery-code').value.trim(), self = this, version = this._version;
        if (!/^\d{6}$/.test(code)) { this._error(new Error('Introduce los 6 dígitos del código')); return Promise.resolve(); }
        var token = App.operation.begin('recovery-verify', { pending: 'Comprobando c\u00f3digo\u2026', success: 'C\u00f3digo verificado' });
        if (!token) return Promise.resolve();
        this._error(null);
        this._bloquear(true);
        return server('verificarCodigoRecuperacion',code).then(function(res) {
          if (!res.success) throw new Error(res.error || 'Código incorrecto.');
          App.operation.succeed(token);
          if (version !== self._version) return;
          clearInterval(self._timer); self._secretos = {pin:res.pin,codigoSeguridad:res.codigoSeguridad}; self._paso = 3; self._pintar();
        }).catch(function(error) { App.operation.fail(token, (error && error.message) || 'Error de conexión'); }).finally(function() { if (version === self._version) self._bloquear(false); });
      },
      revelar: function(button) {
        var reveal = button.getAttribute('aria-pressed') !== 'true';
        document.querySelectorAll('.recovery-secret').forEach(function(input) { input.type = reveal ? 'text' : 'password'; });
        button.setAttribute('aria-pressed',String(reveal)); button.textContent = App.i18n.texto(reveal ? 'Ocultar credenciales' : 'Mostrar credenciales');
      },
    },
    'politica-privacidad': {
      render: function() {
        document.getElementById('politica-privacidad-contenido').innerHTML = '<article class="account-card policy-text"><h2>Política de privacidad</h2><p class="policy-version">Última actualización: 30/10/2026</p><h3>Responsable del tratamiento</h3><p>El Club de Baloncesto Baeza es el responsable de los datos utilizados en esta aplicación. Puedes contactar con el club a través de sus entrenadores o de su directiva para cualquier consulta sobre privacidad.</p><h3>Qué datos tratamos</h3><p>Datos de identificación, credenciales de acceso, información de contacto, contactos familiares, asignación a equipos, asistencia a entrenamientos, justificaciones de ausencias o retrasos y, si decides añadirla, tu fotografía de perfil.</p><p>Si una ausencia o un retraso se debe a la salud, la justificación solo indica «Salud», sin diagnósticos ni detalles: con ese motivo la aplicación no admite texto libre y los correos solo dicen «Salud». En los demás motivos, incluye únicamente lo necesario para comunicar la incidencia.</p><h3>Para qué los utilizamos</h3><p>Gestionamos la actividad deportiva y la asistencia del club, facilitamos el trabajo de los entrenadores y enviamos avisos relacionados con la asistencia a las familias que los tengan activados. No utilizamos los datos para publicidad.</p><h3>Ranking de asistencia del equipo</h3><p>Los jugadores de un mismo equipo ven en «Mi equipo» un ranking de asistencia con el nombre y la foto de perfil de sus compañeros, junto a su porcentaje de asistencia, su racha y sus logros. El ranking no muestra ausencias concretas, motivos ni justificaciones.</p><h3>Base jurídica y menores</h3><p>El tratamiento se apoya en el consentimiento para las funciones que lo requieren y en el interés legítimo del club en organizar su actividad deportiva, respetando los derechos de las personas. Los datos de menores se facilitan y gestionan mediante sus madres, padres o tutores legales. Puedes retirar tu consentimiento cuando corresponda, sin afectar a los tratamientos anteriores a su retirada.</p><h3>Destinatarios e infraestructura</h3><p>No cedemos tus datos a terceros para sus propios fines. El personal autorizado del club accede solo a la información necesaria para sus funciones. La aplicación funciona sobre Google Apps Script y los datos se guardan en Supabase, que actúa como proveedor de infraestructura y encargado del tratamiento. Estos servicios pueden implicar tratamiento fuera del Espacio Económico Europeo, sujeto a las garantías de protección de datos aplicables.</p><h3>Correos automáticos</h3><p>Los avisos de asistencia, las justificaciones y los códigos de recuperación se envían automáticamente desde la cuenta de Gmail de la persona que gestiona la aplicación para el club. Google presta ese servicio de correo como proveedor y su uso puede implicar una transferencia de datos a Estados Unidos, cubierta por el Marco de Privacidad de Datos UE-EE. UU. (EU-US Data Privacy Framework).</p><h3>Conservación</h3><p>Conservamos los datos durante la relación deportiva y el tiempo necesario para gestionar las temporadas, atender solicitudes y cumplir las obligaciones legales aplicables. Después se eliminan o anonimizan cuando dejan de ser necesarios. El club revisa la necesidad de conservar el historial y los contactos familiares.</p><h3>Tus derechos</h3><p>Puedes solicitar acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad de tus datos, en los casos previstos por la normativa, contactando con la directiva o los entrenadores del club. Para proteger tu información puede ser necesario acreditar tu identidad o representación legal. También puedes presentar una reclamación ante la Agencia Española de Protección de Datos (AEPD), en <a href="https://www.aepd.es" target="_blank" rel="noopener noreferrer">www.aepd.es</a>.</p><h3>Seguridad</h3><p>Aplicamos controles de acceso por perfil y medidas técnicas y organizativas para proteger la información. No compartas tu PIN ni tu código de seguridad y cierra la sesión en dispositivos compartidos. Comunica al club cualquier acceso no autorizado que detectes.</p></article>';
      },
    },
    'politica-cookies': {
      render: function() {
        document.getElementById('politica-cookies-contenido').innerHTML = '<article class="account-card policy-text"><h2>Política de cookies y almacenamiento</h2><h3>Sin publicidad ni analítica</h3><p>Esta aplicación no utiliza cookies de publicidad ni de analítica. Guarda información técnica en el almacenamiento local de tu navegador (localStorage) para que puedas utilizarla.</p><h3>Qué se guarda en tu dispositivo</h3><ul><li><code>cb_baeza_auth</code>: mantiene tu sesión y tus credenciales de acceso hasta que cierres sesión o borres el almacenamiento.</li><li><code>cb_baeza_prefs</code>: recuerda el idioma y el tema visual elegidos.</li><li><code>cb-baeza-notifications-v1:&lt;id&gt;</code>: recuerda qué notificaciones del buzón has leído o borrado.</li><li><code>cb-baeza-alertas-v1:&lt;id&gt;</code>: recuerda qué alertas de ausencias seguidas has marcado como «Contactado» (entrenadores y administración).</li><li>Borradores locales: permiten recuperar cambios pendientes en formularios de la aplicación.</li></ul><p>El final &lt;id&gt; de estas dos claves identifica tu cuenta, para que cada persona que use el dispositivo conserve su propio estado.</p><p>El almacenamiento local no se envía automáticamente como una cookie. La aplicación utiliza la sesión guardada para autenticar las peticiones al servidor. Quien tenga acceso a tu dispositivo puede acceder a la sesión: evita guardar el acceso en equipos compartidos.</p><h3>Cookies técnicas de Google</h3><p>Google puede establecer cookies técnicas necesarias para servir la aplicación mediante Apps Script y para la seguridad o funcionamiento de su plataforma, según tu navegador y tu sesión de Google.</p><h3>Cómo borrar estos datos</h3><p>Puedes cerrar sesión desde el menú de usuario. Para borrar preferencias, borradores y cookies, abre la configuración de privacidad de tu navegador, busca los datos de sitios de Google Apps Script y elimina sus cookies y almacenamiento. También puedes borrar todos los datos de navegación. Perderás la sesión, las preferencias y los borradores guardados. Bloquear el almacenamiento o las cookies técnicas puede impedir algunas funciones.</p></article>';
      },
    },

    // Asistente de justificación: una pregunta por paso; al contestar avanza solo.
    // Contexto 'sesion' justifica un entrenamiento concreto; 'programacion' crea o edita avisos semanales con un paso previo de días.
    justificacion: {
      MINUTOS_RAPIDOS: [5, 10, 15, 30],
      DIAS: ['Lunes', 'Martes', 'Mi\u00e9rcoles', 'Jueves', 'Viernes', 'S\u00e1bado', 'Domingo'],
      _contexto: 'sesion', // 'sesion' | 'programacion'
      _sesionId: null,
      _programacionId: null,
      _horarios: [],       // programación: entrenamientos semanales disponibles
      _estadoInicial: null,
      _modo: 'nuevo',      // 'nuevo' | 'edicion' | 'eliminar'
      _datos: null,        // { horarios: IDs de entrenamientos elegidos (programación), tipo, minutos, motivo, detalle }
      _paso: 'tipo',
      _otrosMinutos: false,

      abrir: function(sesionId, estado, borrador, soloEliminar) {
        this._contexto = 'sesion';
        this._sesionId = sesionId;
        this._programacionId = null;
        this._horarios = [];
        this._estadoInicial = estado;
        var jugador = App.state.jugador;
        var registro = App.cache.asistJugadores.find(function(r) { return jugador && r.ID_Sesion === sesionId && r.ID_Jugador === jugador.ID; });
        var esEdicion = !!registro && (registro.TieneJustificacion === true || registro.TieneJustificacion === 'TRUE');
        this._modo = soloEliminar ? 'eliminar' : esEdicion ? 'edicion' : 'nuevo';
        if (borrador) {
          this._datos = { horarios: [], tipo: borrador.tipo, minutos: borrador.minutos || null, motivo: borrador.motivo || '', detalle: borrador.detalle || '' };
        } else if (esEdicion) {
          var retraso = registro.TipoJustificacion === 'Retraso';
          this._datos = { horarios: [], tipo: retraso ? 'Retraso' : 'Ausencia', minutos: retraso && registro.MinutosRetraso ? Number(registro.MinutosRetraso) : null,
            motivo: registro.MotivoCategoria || '', detalle: registro.MotivoDetalle || '' };
        } else {
          this._datos = { horarios: [], tipo: estado === 'R' ? 'Retraso' : estado === 'A' ? 'Ausencia' : null, minutos: null, motivo: '', detalle: '' };
        }
        this._mostrar(soloEliminar || borrador ? 'codigo' : 'tipo', borrador ? borrador.codigo || '' : '');
      },

      // actual: programación a editar o null; horarios: entrenamientos semanales que se pueden elegir.
      abrirProgramacion: function(actual, horarios, borrador) {
        this._contexto = 'programacion';
        this._sesionId = null;
        this._programacionId = actual ? actual.ID : null;
        this._horarios = horarios;
        this._estadoInicial = null;
        this._modo = actual ? 'edicion' : 'nuevo';
        var original = actual && horarios.find(function(h) { return h.ID === actual.ID_Horario; });
        if (borrador) {
          this._datos = { horarios: borrador.horarios.slice(), tipo: borrador.tipo, minutos: borrador.minutos || null, motivo: borrador.motivo || '', detalle: borrador.detalle || '' };
        } else if (actual) {
          var retraso = actual.TipoIncidencia === 'Retraso';
          // Solo su entrenamiento: editar no marca el resto del día ni otros equipos.
          this._datos = { horarios: original ? [original.ID] : [], tipo: retraso ? 'Retraso' : 'Ausencia',
            minutos: retraso && original ? _minutosEntre(original.HoraInicio, actual.HoraIncorporacion) : null,
            motivo: actual.MotivoCategoria || '', detalle: actual.MotivoDetalle || '' };
        } else {
          this._datos = { horarios: [], tipo: null, minutos: null, motivo: '', detalle: '' };
        }
        this._mostrar(borrador ? 'codigo' : 'dias', borrador ? borrador.codigo || '' : '');
      },

      _mostrar: function(pasoInicial, codigo) {
        var programacion = this._contexto === 'programacion', modo = this._modo;
        this._otrosMinutos = !!this._datos.minutos && this.MINUTOS_RAPIDOS.indexOf(this._datos.minutos) < 0;
        var motivos = App.state.motivosJustificacion.length ? App.state.motivosJustificacion.slice() : ['Motivo personal'];
        if (this._datos.motivo && motivos.indexOf(this._datos.motivo) < 0) motivos.push(this._datos.motivo);
        document.getElementById('justif-motivos').innerHTML = motivos.map(function(m) {
          return '<button type="button" class="justif-chip" data-motivo="' + _statsTexto(m) + '" aria-pressed="false" onclick="App.views.justificacion.elegirMotivo(this.dataset.motivo)">' + _statsTexto(m) + '</button>';
        }).join('');
        document.getElementById('justif-dias').innerHTML = programacion ? this._htmlEntrenamientos() : '';
        document.getElementById('justif-detalle').value = this._datos.detalle;
        document.getElementById('justif-minutos').value = this._otrosMinutos ? String(this._datos.minutos) : '';
        document.getElementById('justif-codigo').value = codigo;
        document.getElementById('justif-preview-label').textContent = programacion ? 'Aviso que recibir\u00e1 el entrenador cada semana' : 'Mensaje que recibir\u00e1 el entrenador';
        document.getElementById('justif-submit').textContent = programacion ? 'Guardar' : modo === 'edicion' ? 'Guardar cambios' : 'Enviar';
        document.getElementById('justif-eliminar-prog').classList.toggle('hidden', !(programacion && modo === 'edicion'));
        var confirmarBtn = document.getElementById('justif-enviar');
        confirmarBtn.textContent = modo === 'eliminar' ? 'Eliminar justificaci\u00f3n' : programacion ? 'Confirmar y guardar'
          : modo === 'edicion' ? 'Confirmar cambios' : 'Confirmar y enviar';
        confirmarBtn.classList.toggle('btn-danger', modo === 'eliminar');
        confirmarBtn.classList.toggle('btn-primary', modo !== 'eliminar');
        this._actualizarTitulo();
        this._irA(pasoInicial, 0);
        document.getElementById('modal-justificacion').classList.remove('hidden');
        this._ajustarAltura();
      },

      // Fija la altura del panel a la del paso más alto (con tope en CSS) para que no salte al avanzar.
      _ajustarAltura: function() {
        var hoja = document.querySelector('#modal-justificacion .justif-wizard');
        var cuerpo = document.getElementById('justif-steps');
        if (!hoja || !cuerpo || !cuerpo.querySelectorAll) return;
        var pasos = this._modo === 'eliminar' ? ['codigo']
          : (this._contexto === 'programacion' ? ['dias'] : []).concat(['tipo', 'minutos', 'motivo', 'resumen', 'codigo']);
        var otros = document.getElementById('justif-otros'), otrosOculto = otros.classList.contains('hidden');
        var preview = document.getElementById('justif-preview'), previewTexto = preview.textContent;
        var steps = Array.prototype.slice.call(cuerpo.querySelectorAll('.justif-step'));
        var ocultos = steps.map(function(s) { return s.hidden; });
        hoja.style.setProperty('--justif-h', '0px');
        otros.classList.remove('hidden');
        if (!previewTexto) this.actualizarPreview();
        var fijo = hoja.offsetHeight - cuerpo.clientHeight, maximo = 0;
        pasos.forEach(function(paso) {
          steps.forEach(function(s) { s.hidden = s.dataset.step !== paso; });
          maximo = Math.max(maximo, cuerpo.scrollHeight);
        });
        steps.forEach(function(s, i) { s.hidden = ocultos[i]; });
        otros.classList.toggle('hidden', otrosOculto);
        preview.textContent = previewTexto;
        hoja.style.setProperty('--justif-h', Math.ceil(fijo + maximo) + 'px');
      },

      _pasos: function() {
        if (this._modo === 'eliminar') return ['codigo'];
        var pasos = this._contexto === 'programacion' ? ['dias', 'tipo'] : ['tipo'];
        if (this._datos.tipo === 'Retraso') pasos.push('minutos');
        return pasos.concat(['motivo', 'resumen', 'codigo']);
      },

      _actualizarTitulo: function() {
        var titulo = this._contexto === 'programacion'
          ? (this._modo === 'edicion' ? 'Editar programaci\u00f3n' : 'Programar justificaci\u00f3n')
          : this._modo === 'eliminar' ? 'Eliminar justificaci\u00f3n'
          : this._modo === 'edicion' ? 'Editar justificaci\u00f3n'
          : this._datos.tipo === 'Retraso' ? 'Justificar retraso'
          : this._datos.tipo === 'Ausencia' ? 'Justificar ausencia' : 'Avisar al entrenador';
        document.getElementById('justif-titulo').textContent = titulo;
      },

      // Un chip por entrenamiento semanal (día + hora). Con varios equipos se agrupan bajo su nombre (principal primero).
      _htmlEntrenamientos: function() {
        var self = this, grupos = {}, orden = [], jugador = App.state.jugador;
        this._horarios.forEach(function(h) {
          if (!grupos[h.ID_Equipo]) { grupos[h.ID_Equipo] = []; orden.push(h.ID_Equipo); }
          grupos[h.ID_Equipo].push(h);
        });
        var chip = function(h, equipoNombre) {
          var dia = self.DIAS[Number(h.DiaSemana) - 1] || 'D\u00eda', hora = h.HoraInicio + (h.HoraFin ? '\u2013' + h.HoraFin : '');
          return '<button type="button" class="justif-chip justif-dia" data-horario="' + _esc(h.ID) + '" aria-pressed="false"' +
            (equipoNombre ? ' aria-label="' + _esc(equipoNombre + ', ' + dia + ' ' + hora) + '"' : '') +
            ' onclick="App.views.justificacion.elegirHorario(this.dataset.horario)"><strong>' + _esc(dia) + '</strong><small data-no-i18n>' + _esc(hora) + '</small></button>';
        };
        if (orden.length < 2) return this._horarios.map(function(h) { return chip(h); }).join('');
        var tipo = function(equipoId) {
          var rel = jugador && App.cache.jugadoresEquipos.find(function(r) { return r.ID_Jugador === jugador.ID && r.ID_Equipo === equipoId; });
          return rel && rel.Tipo === 'Principal' ? 0 : 1;
        };
        var nombre = function(equipoId) { var eq = App.cache.getEquipoById(equipoId); return eq ? eq.Nombre : 'Equipo'; };
        orden.sort(function(a, b) { return tipo(a) - tipo(b) || String(nombre(a)).localeCompare(String(nombre(b)), 'es'); });
        return orden.map(function(equipoId) {
          var n = nombre(equipoId);
          return '<section class="justif-equipo" role="group" aria-label="' + _esc(n) + '"><h5 class="justif-equipo-nombre" data-no-i18n>' + _esc(n) + '</h5>' +
            '<div class="justif-dias">' + grupos[equipoId].map(function(h) { return chip(h, n); }).join('') + '</div></section>';
        }).join('');
      },

      // Entrenamientos elegidos, en el orden de la lista (día y hora).
      _horariosElegidos: function() {
        var elegidos = this._datos.horarios;
        return this._horarios.filter(function(h) { return elegidos.indexOf(h.ID) >= 0; });
      },

      _sinMovimiento: function() {
        return typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      },

        // Al editar solo se ofrecen entrenamientos de su mismo equipo: editar nunca crea programaciones en otros equipos.

      eliminar: function(id) {
        if (this._busy) return;
        if (!App.cache.programacionesJustificaciones.some(function(item) { return item.ID === id; })) return;
        this._pedirCodigo('delete', id, 'Eliminar programación',
          'Se eliminará esta programación y dejará de aplicarse a los próximos entrenamientos.', 'Eliminar');
      },
      _pedirCodigo: function(action, id, title, message, confirmLabel) {
        if (this._busy) return;
        this._pendingAction = { action: action, id: id };
        App.openModal(title,
          '<div class="modal-confirm-warning" style="padding:20px 16px 16px;text-align:center">' +
          '<div class="modal-confirm-icon">&#x26A0;</div>' +
          '<div class="modal-confirm-msg"><strong>' + message + '</strong><br><br>' +
          '<span style="font-size:.8rem;color:var(--texto-sec)">Introduce el código de autorización para confirmar.</span></div>' +
          '<div class="form-group" style="text-align:left;margin-top:16px"><label>Código de autorización</label>' +
          '<input id="programacion-accion-codigo" type="text" maxlength="6" placeholder="6 caracteres" autocomplete="off" style="text-align:center;letter-spacing:4px;text-transform:uppercase;font-size:1.1rem" oninput="this.value=this.value.toUpperCase()"></div>' +
          '<div style="display:flex;gap:8px;margin-top:20px">' +
          '<button class="btn btn-secondary" style="flex:1" onclick="App.closeModal()">Cancelar</button>' +
          '<button class="btn ' + (action === 'delete' ? 'btn-destructive' : 'btn-primary') + '" style="flex:1" onclick="App.views.programaciones.confirmarAccion()">' + confirmLabel + '</button>' +
          '</div></div>'
        );
        var input = document.getElementById('programacion-accion-codigo');
        if (input) input.focus();
      },
      confirmarAccion: function() {
        var pending = this._pendingAction;
        var codigoEl = document.getElementById('programacion-accion-codigo');
        var codigo = codigoEl ? codigoEl.value.trim().toUpperCase() : '';
        if (!pending || codigo.length !== 6) {
          showToast('Introduce el código de autorización de 6 caracteres', 'error');
          return;
        }
        this._pendingAction = null;
        App.closeModal();
        var self = this;
        var jugadorId = App.state.jugador.ID;
        var programacion = App.cache.programacionesJustificaciones.find(function(item) { return item.ID === pending.id; });
        var token = App.operation.begin('programacion:' + pending.action + ':' + pending.id, pending.action === 'delete' ? { pending: 'Eliminando\u2026', success: 'Eliminado correctamente' } : null);
        if (!token) return;
        this._busy = true;
        this._busyId = pending.id;
        this.render();
        App.sync.start();
        var request;
        if (pending.action === 'delete') {
          request = server('eliminarProgramacionJustificacion', pending.id, jugadorId, codigo);
        } else {
          var activa = programacion && (programacion.Activo === true || programacion.Activo === 'TRUE');
          request = server('actualizarProgramacionJustificacion', pending.id, jugadorId, codigo, {
            idHorario: programacion.ID_Horario,
            tipoIncidencia: programacion.TipoIncidencia,
            motivo: programacion.MotivoCategoria,
            detalle: programacion.MotivoDetalle,
            horaIncorporacion: programacion.HoraIncorporacion,
            activo: !activa,
          });
        }
        request.then(function(res) {
          if (!res || res.success === false) throw new Error(res && res.error || 'No se pudo actualizar la programación');
          if (pending.action === 'delete') App.cache.remove('programacionesJustificaciones', pending.id);
          else App.cache.upsert('programacionesJustificaciones', res.programacion);
          self._busy = false;
          self._busyId = null;
          self.render();
          App.sync.done();
          App.operation.succeed(token);
        }).catch(function(error) {
          self._busy = false;
          self._busyId = null;
          App.sync.done();
          App.operation.fail(token, error.message || 'Error de conexión');
          self.render();
        });
      },
    },

  }, // fin views

}; // fin App

// Estándar único de guardado: logo girando mientras dura la acción y resultado (éxito o error) en el mismo indicador.
// Toda acción de guardar, enviar, borrar o subir pasa por aquí; los textos por defecto pueden adaptarse a la acción.
App.operation = {
  TEXTOS: { pending: 'Guardando\u2026', success: 'Guardado correctamente', error: 'No se pudo guardar' },
  _nextId: 0,
  _active: {},
  _locks: {},
  _timer: null,
  _result: 'success',
  _errorMessage: '',
  _pendingText: '',
  _successTexts: [],

  _render: function(state) {
    var status = document.getElementById('operation-status');
    if (!status) return;
    hideToast();
    var logo = document.getElementById('operation-logo');
    var source = document.getElementById('hdr-logo') || document.querySelector('.loading-logo-img');
    if (logo && source && source.src && logo.src !== source.src) logo.src = source.src;
    var pendingText = document.getElementById('operation-pending-text');
    if (pendingText) pendingText.textContent = this._pendingText || this.TEXTOS.pending;
    var successText = document.getElementById('operation-success-text');
    var unicos = this._successTexts.filter(function(t, i, all) { return all.indexOf(t) === i; });
    if (successText) successText.textContent = unicos.length === 1 ? unicos[0] : this.TEXTOS.success;
    status.classList.remove('hidden', 'pending', 'success', 'error', 'success-animate');
    status.classList.add(state);
    if (state === 'success') {
      void status.offsetWidth;
      status.classList.add('success-animate');
    }
    var errorText = document.getElementById('operation-error-text');
    if (errorText) errorText.textContent = state === 'error' ? (this._errorMessage || this.TEXTOS.error) : this.TEXTOS.error;
  },

  // Oculta un resultado ya mostrado (nunca el «Guardando…» de una acción en curso).
  ocultarResultado: function() {
    if (Object.keys(this._active).length) return;
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    var status = document.getElementById('operation-status');
    if (status) status.classList.add('hidden');
  },

  // textos opcionales: { pending: 'Enviando…', success: 'Enviado correctamente' }.
  begin: function(key, textos) {
    key = key || 'operation';
    if (this._locks[key]) return null;
    if (!Object.keys(this._active).length) {
      this._result = 'success';
      this._errorMessage = '';
      this._successTexts = [];
    }
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    var token = { id: ++this._nextId, key: key, textos: textos || {} };
    this._locks[key] = token.id;
    this._active[token.id] = token;
    this._pendingText = token.textos.pending || '';
    this._render('pending');
    return token;
  },

  _finish: function(token, outcome, message) {
    if (!token || this._active[token.id] !== token) return;
    if (outcome === 'error') {
      this._result = 'error';
      this._errorMessage = message || this.TEXTOS.error;
    } else {
      this._successTexts.push(token.textos.success || this.TEXTOS.success);
    }
    delete this._active[token.id];
    if (this._locks[token.key] === token.id) delete this._locks[token.key];
    if (Object.keys(this._active).length) return;
    this._render(this._result);
    var self = this;
    this._timer = setTimeout(function() {
      if (Object.keys(self._active).length) return;
      var status = document.getElementById('operation-status');
      if (status) status.classList.add('hidden');
      self._timer = null;
    }, this._result === 'success' ? 2800 : 5000);
  },

  succeed: function(token) { this._finish(token, 'success'); },
  fail: function(token, message) { this._finish(token, 'error', message); },

  // Resuelve cuando el indicador ya se ha pintado: permite empezar trabajo pesado sin congelar la pantalla.
  afterPaint: function() {
    return new Promise(function(resolve) {
      var frame = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : function(fn) { return setTimeout(fn, 16); };
      frame(function() { setTimeout(resolve, 0); });
    });
  },

  // args puede ser una función (síncrona o que devuelve promesa) que prepara los argumentos tras pintar el indicador.
  run: function(key, fn, args, onSuccess, onError, textos) {
    var token = this.begin(key, textos);
    if (!token) return Promise.reject(new Error('Ya hay una operación en curso'));
    return this.afterPaint()
      .then(function() { return typeof args === 'function' ? args() : args; })
      .then(function(listos) { return server.apply(null, [fn].concat(listos || [])); })
      .then(function(result) {
        if (!result || result.success === false) throw new Error(result && result.error || 'El servidor no confirmó el guardado');
        return Promise.resolve(onSuccess ? onSuccess(result) : result).then(function(value) {
          App.operation.succeed(token);
          return value === undefined ? result : value;
        });
      })
      .catch(function(error) {
        if (onError) onError(error);
        App.operation.fail(token, error && error.message);
        throw error;
      });
  },
};

// Salvaguarda de escritura: mientras un campo de texto tiene el foco ningún re-render global
// (realtime, estadísticas) repinta la vista; reemplazar el DOM quitaría el foco y cerraría el teclado del móvil.
// Lo aplazado se ejecuta al salir del campo.
App.escritura = {
  _aplazados: {},
  activa: function() {
    var el = document.activeElement;
    if (!el || !el.tagName) return false;
    var tag = el.tagName.toUpperCase();
    var texto = tag === 'TEXTAREA' || el.isContentEditable === true ||
      (tag === 'INPUT' && !/^(button|submit|reset|checkbox|radio|range|color|file|image|hidden)$/i.test(el.type || 'text'));
    // Un campo que ya no se ve (la vista cambió sin blur, como en iOS) no retiene los repintados.
    return texto && (!el.getClientRects || el.getClientRects().length > 0);
  },
  alTerminar: function(clave, fn) { this._aplazados[clave] = fn; },
  _reanudar: function() {
    if (this.activa()) return;
    var aplazados = this._aplazados;
    this._aplazados = {};
    Object.keys(aplazados).forEach(function(clave) { aplazados[clave](); });
    App.realtime.flushPending();
  },
};
document.addEventListener('focusout', function() { setTimeout(function() { App.escritura._reanudar(); }, 0); });

var STATS_VIEWS = ['equipos','equipos-admin','jugadores-admin','entrenadores-admin','equipo-detalle','jugador-detalle','entrenador-detalle','perfil-jugador','mis-stats','mi-equipo','informes'];
App.stats = {
  filtro: null, resumen: null, error: null, detalles: {}, refreshing: false, _version: 0, _renderPending: false,
  _render: function() {
    if (this._renderPending) return;
    this._renderPending = true;
    var self = this, schedule = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : function(fn) { return setTimeout(fn, 0); };
    schedule(function() {
      self._renderPending = false;
      if (App.escritura.activa()) { App.escritura.alTerminar('stats', function() { self._render(); }); return; }
      if (STATS_VIEWS.indexOf(App.state.currentView) >= 0 && !App.state._formIsDirty) App.navigate(App.state.currentView, {}, false);
    });
  },
  _key: function(entidad, id) { var f = this.filtro || {}; return [entidad,id || '',f.temporadaId || '',f.periodo || 'temporada'].join(':'); },
  _stale: function() {
    var self = this;
    Object.keys(this.detalles).forEach(function(key) {
      var e = self.detalles[key];
      if (!e.data) { delete self.detalles[key]; return; }
      e.refreshing = true; e.estado = 'ok'; e._version = null; e.error = null;
    });
  },
  _adoptar: function(stats) {
    this.resumen = stats; this.filtro = { temporadaId: stats.filtro.temporadaId, periodo: stats.filtro.periodo }; this.error = null; this.refreshing = false;
    if (stats.entidad === 'resumen') {
      var consultas = Object.keys(stats.datos.equipos || {}).map(function(id) { return {entidad:'equipo',id:id}; });
      if (App.state.esAdmin) consultas.push({entidad:'club'});
      this._lote(consultas);
    }
    this._render();
  },
  recibirBootstrap: function(res) {
    var stats = res.estadisticas;
    if (!stats) { this.error = res.estadisticasError || 'No se pudieron calcular las estadísticas'; this.refreshing = false; this._render(); return; }
    if (!this.filtro || (this.filtro.temporadaId === stats.filtro.temporadaId && this.filtro.periodo === stats.filtro.periodo)) {
      this._version++; this._stale(); this._adoptar(stats);
    } else this.invalidar();
  },
  setFiltro: function(cambios) {
    var nuevo = Object.assign({},this.filtro || {},cambios);
    var cambio = !this.filtro || nuevo.temporadaId !== this.filtro.temporadaId || nuevo.periodo !== this.filtro.periodo;
    this.filtro = nuevo;
    if (cambio) { this.resumen = null; this.detalles = {}; }
    return this.invalidar();
  },
  _entrada: function(entidad,id) {
    var key = this._key(entidad,id);
    return this.detalles[key] || (this.detalles[key] = {estado:'cargando',entidad:entidad,id:id,key:key});
  },
  _resultado: function(entrada,res,version) {
    if (version !== this._version || this.detalles[entrada.key] !== entrada) return;
    entrada.refreshing = false;
    if (res && res.success && res.estadisticas) { entrada.data = res.estadisticas; entrada.estado = 'ok'; entrada.error = null; }
    else { entrada.error = res && res.error || 'No se pudieron calcular las estadísticas'; entrada.estado = entrada.data ? 'ok' : 'error'; }
    if (entrada.entidad === 'equipo' && entrada.id === App.state.detalleEquipoId && App.state.currentView === 'equipo-detalle' && entrada.data) this.prefetchJugadores(entrada.data.datos);
    this._render();
  },
  _lote: function(consultas) {
    var self = this, version = this._version, entradas = [];
    consultas.forEach(function(c) { var e = self._entrada(c.entidad,c.id); if (e._version === version) return; e._version = version; e.refreshing = !!e.data; entradas.push(e); });
    for (var i = 0; i < entradas.length; i += 60) {
      (function(grupo) {
        server('getEstadisticasLote',grupo.map(function(e) { return Object.assign({},self.filtro || {},{entidad:e.entidad,id:e.id}); })).then(function(res) {
          grupo.forEach(function(e,index) { self._resultado(e,res && res.success ? res.resultados[index] : res,version); });
        }).catch(function(err) { grupo.forEach(function(e) { self._resultado(e,{success:false,error:err.message},version); }); });
      })(entradas.slice(i,i + 60));
    }
  },
  prefetchJugadores: function(equipo) {
    if (App.state.currentView !== 'equipo-detalle') return;
    this._lote((equipo.jugadores || []).slice(0,60).map(function(j) { return {entidad:'jugador',id:j.id}; }));
  },
  detalle: function(entidad, id) {
    var self = this, entrada = this._entrada(entidad,id), version = this._version;
    if (entrada._version !== version) {
      entrada._version = version; entrada.refreshing = !!entrada.data;
      server('getEstadisticas',Object.assign({},this.filtro || {},{entidad:entidad,id:id})).then(function(res) { self._resultado(entrada,res,version); }).catch(function(err) { self._resultado(entrada,{success:false,error:err.message},version); });
    }
    if (entidad === 'equipo' && entrada.data) this.prefetchJugadores(entrada.data.datos);
    return entrada;
  },
  reintentar: function(entidad,id,key) { var e = this.detalles[key]; if (e) e._version = null; this.detalle(entidad,id); this._render(); },
  invalidar: function() {
    if (!App.state.auth) return;
    var self = this, version = ++this._version;
    this._stale(); this.refreshing = !!this.resumen; this.error = null; this._render();
    return server('getEstadisticas',Object.assign({},this.filtro || {},{entidad:App.state.rol === 'jugador' ? 'propio' : 'resumen'})).then(function(res) {
      if (version !== self._version) return;
      if (!res || !res.success || !res.estadisticas) throw new Error(res && res.error || 'No se pudieron calcular las estadísticas');
      self._adoptar(res.estadisticas);
    }).catch(function(err) { if (version === self._version) { self.error = err.message; self.refreshing = false; self._render(); } });
  },
  reset: function() { this._version++; this.filtro = null; this.resumen = null; this.error = null; this.detalles = {}; this.refreshing = false; },
};

App.realtime = {
  client: null,
  channel: null,
  started: false,
  config: null,
  connected: false,
  refreshing: false,
  pending: false,
  debounceTimer: null,
  fallbackTimer: null,
  retryTimer: null,
  safeViews: new Set([
    'equipos', 'gestion', 'sesiones', 'sesion-guardada', 'equipos-admin',
    'jugadores-admin', 'entrenadores-admin', 'historial-equipo',
    'jugador-detalle', 'entrenador-detalle', 'equipo-detalle',
    'perfil-jugador', 'mis-entrenamientos', 'detalle-sesion-jugador',
    'mis-stats', 'mi-equipo', 'informes',
  ]),

  start: function() {
    if (!App.state.auth || this.started) return;
    this.started = true;

    if (window.supabase && window.supabase.createClient && this.config && this.config.url && this.config.key) {
      try {
        this.client = window.supabase.createClient(this.config.url, this.config.key, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
        });
        var self = this;
        this.channel = this.client
          .channel('cb-baeza-app-sync')
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'app_sync_state',
          }, function() {
            self.requestRefresh(250);
          })
          .subscribe(function(status, error) {
            if (status === 'SUBSCRIBED') {
              self.connected = true;
              self.requestRefresh(150);
            } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
              self.connected = false;
              _clientLog('realtime_disconnected', { status: status, error: error ? error.message : null });
            }
          });
      } catch (error) {
        this.connected = false;
        _clientLog('realtime_start_failed', { error: error.message });
      }
    } else {
      _clientLog('realtime_config_unavailable', {});
    }

    if (!this.fallbackTimer) {
      var realtime = this;
      this.fallbackTimer = setInterval(function() {
        if (App.state.auth && !realtime.connected) realtime.requestRefresh(0);
      }, 30000);
    }

    this._onVisibilityChange = function() {
      if (document.visibilityState === 'visible' && App.state.auth) {
        this.requestRefresh(100);
      }
    }.bind(this);
    document.addEventListener('visibilitychange', this._onVisibilityChange);
  },

  stop: function() {
    if (this.debounceTimer) clearTimeout(this.debounceTimer);
    if (this.retryTimer) clearTimeout(this.retryTimer);
    if (this.fallbackTimer) clearInterval(this.fallbackTimer);
    if (this.client && this.channel) this.client.removeChannel(this.channel);
    if (this._onVisibilityChange) document.removeEventListener('visibilitychange', this._onVisibilityChange);
    this.channel = null;
    this.client = null;
    this.started = false;
    this.connected = false;
    this.refreshing = false;
    this.pending = false;
    this.debounceTimer = null;
    this.fallbackTimer = null;
    this.retryTimer = null;
    this._onVisibilityChange = null;
  },

  canRefreshNow: function() {
    if (!App.state.auth || !this.safeViews.has(App.state.currentView) || App.state._formIsDirty) return false;
    if (document.visibilityState === 'hidden' || App.escritura.activa()) return false;
    var modal = document.getElementById('modal-overlay');
    if (modal && modal.classList.contains('open')) return false;
    var justificationModal = document.getElementById('modal-justificacion');
    if (justificationModal && !justificationModal.classList.contains('hidden')) return false;
    return true;
  },

  requestRefresh: function(delay) {
    if (!this.canRefreshNow()) {
      this.pending = true;
      return;
    }
    if (this.debounceTimer) clearTimeout(this.debounceTimer);
    var self = this;
    this.debounceTimer = setTimeout(function() {
      self.debounceTimer = null;
      self.refresh();
    }, delay || 0);
  },

  flushPending: function() {
    if (this.pending && this.canRefreshNow()) {
      this.pending = false;
      this.requestRefresh(100);
    }
  },

  scheduleRetry: function() {
    this.pending = false;
    if (this.retryTimer) clearTimeout(this.retryTimer);
    var self = this;
    this.retryTimer = setTimeout(function() {
      self.retryTimer = null;
      self.pending = true;
      self.flushPending();
    }, 15000);
  },

  refresh: function() {
    if (!this.canRefreshNow()) {
      this.pending = true;
      return;
    }
    if (this.refreshing) {
      this.pending = true;
      return;
    }

    this.refreshing = true;
    this.pending = false;
    if (this.retryTimer) {
      clearTimeout(this.retryTimer);
      this.retryTimer = null;
    }
    var requestView = App.state.currentView;
    var requestAuth = JSON.stringify(App.state.auth);
    App.sync.start();
    var self = this;

    server('cargarDatos')
      .then(function(res) {
        if (JSON.stringify(App.state.auth) !== requestAuth) return;
        if (!res || !res.success) {
          if (res && res.stage === 'auth_context') App.cerrarSesion('realtime_auth_invalid');
          else {
            _clientLog('realtime_refresh_failed', { error: res && res.error ? res.error : null });
            self.scheduleRetry();
          }
          return;
        }
        if (App.state.currentView !== requestView || !self.canRefreshNow()) {
          self.pending = true;
          return;
        }
        App._applyBootstrapData(res);
        if (App.state.currentView === requestView && self.safeViews.has(requestView)) {
          App.navigate(requestView, {}, false);
        }
      })
      .catch(function(error) {
        self.scheduleRetry();
        _clientLog('realtime_refresh_network_error', { error: error && error.message ? error.message : null });
      })
      .then(function() {
        App.sync.done();
        self.refreshing = false;
        self.flushPending();
      });
  },
};

// ================================================================
// App.sync — Módulo de sincronización en segundo plano
// Muestra un indicador no bloqueante mientras hay operaciones activas
// y permite actualizaciones optimistas con rollback en caso de error.
// ================================================================
App.sync = {
  _count: 0,
  start: function() {
    this._count++;
    var el = document.getElementById('sync-badge');
    if (el) el.classList.add('syncing');
  },
  done: function() {
    this._count = Math.max(0, this._count - 1);
    if (!this._count) {
      var el = document.getElementById('sync-badge');
      if (el) el.classList.remove('syncing');
    }
  },
  // Ejecuta una llamada al servidor en segundo plano.
  // Si falla (error de red o res.success===false), llama a rollback() y muestra toast de error.
  run: function(fn, args, rollback) {
    var self = this;
    var operationKey = 'sync:' + fn + ':' + JSON.stringify((args || []).slice(0, 1));
    var token = App.operation.begin(operationKey, /^eliminar/.test(fn) ? { pending: 'Eliminando\u2026', success: 'Eliminado correctamente' } : null);
    if (!token) {
      if (rollback) rollback();
      return Promise.resolve(null);
    }
    self.start();
    return server.apply(null, [fn].concat(args || []))
      .then(function(res) {
        if (!res || res.success === false || res.actualizado === false || res.eliminado === false || res.desasignado === false) {
          throw new Error(res && res.error || 'El servidor no confirmó el guardado');
        }
        self.done();
        App.operation.succeed(token);

// Copia texto al portapapeles; si la Clipboard API falla o no existe, usa un textarea temporal. Resuelve true/false.
function _copiarTexto(texto) {
  var respaldo = function() {
    var area = document.createElement('textarea'), previo = document.activeElement, ok = false;
    area.value = texto;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(area);
    area.select();
    try { ok = !!document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(area);
    if (previo && previo.focus) previo.focus({ preventScroll: true });
    return ok;
  };
  var portapapeles = typeof navigator !== 'undefined' && navigator.clipboard;
  if (portapapeles && portapapeles.writeText) {
    try { return portapapeles.writeText(texto).then(function() { return true; }, respaldo); } catch (e) { /* respaldo */ }
  }
  return Promise.resolve(respaldo());
}

function _normalizarDorsal(dorsal) {

// Mensaje si otro de `miembros` (plantilla de un equipo) ya lleva `dorsal`; null si está libre.
function _errorDorsalEnUso(jugadorId, dorsal, miembros, equipoNombre) {

function _errorDorsalEquiposJugador(jugadorId, dorsal) {

// Un único aviso visible: el nuevo sustituye al anterior, el mismo aviso repetido solo reinicia su tiempo
// y un resultado ya mostrado por App.operation se retira para que nunca se solapen.
var _toastActual = null;
function showToast(msg, type) {
  var c = document.getElementById('toast-container');
  if (!c) return;
  var texto = String(msg == null ? '' : msg), tipo = type || '';
  App.operation.ocultarResultado();
  if (_toastActual && _toastActual.texto === texto && _toastActual.tipo === tipo && _toastActual.el.parentNode === c && !_toastActual.saliendo) {
    clearTimeout(_toastActual.timer);

    hideToast();
    var t = document.createElement('div');
    t.className = 'toast ' + tipo;
    t.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
    t.textContent = texto;
    c.appendChild(t);
    _toastActual = { el: t, texto: texto, tipo: tipo, timer: null, saliendo: false };
  }
  var actual = _toastActual;
  actual.timer = setTimeout(function() {
    actual.saliendo = true;
    actual.el.classList.add('out');

      actual.el.remove();
      if (_toastActual === actual) _toastActual = null;

// PIN fácil de adivinar: mismo dígito, secuencia (1234, 9876), bloques repetidos (1212, 123123) o muy común.
// Solo sirve para un aviso suave: nunca bloquea guardar.
function _pinDebil(pin) {
  pin = String(pin == null ? '' : pin).trim();
  if (!/^\d{4,6}$/.test(pin)) return false;
  if (/^(\d)\1+$/.test(pin) || /^(\d\d)\1+$/.test(pin) || /^(\d{3})\1$/.test(pin)) return true;
  if (['1122', '2580', '1004', '2000', '6969', '1987', '1984'].indexOf(pin) >= 0) return true;
  var paso = pin.charCodeAt(1) - pin.charCodeAt(0);
  if (paso !== 1 && paso !== -1) return false;
  for (var i = 2; i < pin.length; i++) if (pin.charCodeAt(i) - pin.charCodeAt(i - 1) !== paso) return false;
  return true;
}

function _sumarMinutos(hora, minutos) {
  var partes = String(hora || '').split(':').map(Number);
  var total = ((partes[0] * 60 + partes[1] + Number(minutos)) % 1440 + 1440) % 1440;
  return ('0' + Math.floor(total / 60)).slice(-2) + ':' + ('0' + total % 60).slice(-2);
}

function _minutosEntre(inicio, fin) {
  var a = String(inicio || '').split(':').map(Number), b = String(fin || '').split(':').map(Number);
  var minutos = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]);

}

    capas.map(function(c) { return '<svg class="stats-streak-layer stats-streak-' + c + '" viewBox="0 0 100 120" focusable="false"><path d="' + _STATS_RACHA_CAPAS[c] + '"/></svg>'; }).join('') +

// Toque: llamarada con rebote, estallido de chispas, vibración y texto flotante. Reutiliza un único overlay por documento.
function _statsRachaCelebrar(boton) {
  var n = Number(boton.getAttribute('data-racha')) || 0, nivel = _statsRachaNivel(n);
  var reducido = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  boton.classList.add(clase);
  clearTimeout(boton._rachaTimer);
  boton._rachaTimer = setTimeout(function() { boton.classList.remove(clase); }, 900);

    burst = document.createElement('div');

  var ancho = texto.offsetWidth, vw = document.documentElement.clientWidth || window.innerWidth;

// Easter egg solo para el rol jugador: cada toque seguido carga el fuego (crece, tiembla, vira a blanco/azul y suelta
// chispas); la carga baja si se deja de tocar y, al completarse, estalla y deja la app en llamas hasta recargar.
// Todo vive en memoria: no se guarda nada y cerrar sesión lo apaga.
var _STATS_FUEGO_EGG = { toques: 15, esperaMs: 2000, bajadaMs: 350, estallidoMs: 2300 };
var _statsFuegoEgg = { carga: 0, ultimo: 0, boton: null, timer: 0, fase: '' };
function _statsFuegoEggCarga(ahora) {
  var e = _statsFuegoEgg, parado = ahora - e.ultimo - _STATS_FUEGO_EGG.esperaMs;
  return parado > 0 ? Math.max(0, e.carga - Math.floor(parado / _STATS_FUEGO_EGG.bajadaMs)) : e.carga;
}
function _statsFuegoEggToque(boton, reducido) {
  var e = _statsFuegoEgg;
  if (App.state.rol !== 'jugador' || e.fase) return;
  var ahora = Date.now();
  e.carga = _statsFuegoEggCarga(ahora) + 1;
  e.ultimo = ahora;
  if (e.boton !== boton) _statsFuegoEggPintar(e.boton, 0);
  e.boton = boton;
  clearTimeout(e.timer);
  if (e.carga < _STATS_FUEGO_EGG.toques) {
    _statsFuegoEggPintar(boton, e.carga);
    e.timer = setTimeout(_statsFuegoEggEnfriar, _STATS_FUEGO_EGG.esperaMs + _STATS_FUEGO_EGG.bajadaMs);
    return;
  }
  e.carga = 0; e.boton = null; e.fase = 'estallando';
  _statsFuegoEggPintar(boton, 0);
  if (reducido) _statsFuegoEggEnLlamas(); else _statsFuegoEggEstallar(boton);
}
function _statsFuegoEggEnfriar() {
  var e = _statsFuegoEgg, carga = _statsFuegoEggCarga(Date.now());
  _statsFuegoEggPintar(e.boton, carga);
  if (!carga) e.boton = null;
  e.timer = carga ? setTimeout(_statsFuegoEggEnfriar, _STATS_FUEGO_EGG.bajadaMs) : 0;
}
// --egg (0-1) gobierna en CSS tamaño, temblor, tono y chispas; las capas extra se añaden al primer toque.
function _statsFuegoEggPintar(boton, carga) {
  if (!boton) return;
  var k = Math.min(1, carga / _STATS_FUEGO_EGG.toques), pop = boton.querySelector('.stats-streak-pop');
  if (k && pop && !pop.querySelector('.stats-egg-tono')) {
    pop.insertAdjacentHTML('beforeend', '<span class="stats-egg-tono"><svg class="stats-egg-llama" viewBox="0 0 100 120" focusable="false"><path class="stats-egg-azul" d="' + _STATS_RACHA_CAPAS.mid + '"/><path class="stats-egg-blanco" d="' + _STATS_RACHA_CAPAS.inner + '"/></svg></span>' +
      '<span class="stats-egg-chispas">' + new Array(7).join('<span class="stats-streak-spark"></span>') + '</span>');
  }
  boton.style.setProperty('--egg', k.toFixed(3));
  boton.classList.toggle('is-cargando', k > 0);
}
function _statsFuegoEggLlama(clase, capa, estilo) {
  return '<span class="' + clase + '" style="' + estilo + '"><svg viewBox="0 0 100 120" preserveAspectRatio="none" focusable="false"><path d="' + _STATS_RACHA_CAPAS[capa] + '"/></svg></span>';
}
// Estallido (≈2,3 s): flash, onda expansiva, chispas y un mar de llamas a pantalla completa; después, en llamas.
function _statsFuegoEggEstallar(boton) {
  var rect = boton.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  var radio = Math.sqrt(Math.pow(Math.max(cx, vw - cx), 2) + Math.pow(Math.max(cy, vh - cy), 2));
  var html = '<span class="stats-egg-flash"></span><span class="stats-egg-onda"></span><span class="stats-egg-onda is-segunda"></span><span class="stats-egg-mar">';
  for (var i = 0; i < 9; i++) html += _statsFuegoEggLlama('stats-egg-ola', 'outer', 'left:' + (i * 12 - 10) + '%;animation-delay:' + ((i % 3) * .06 + (i % 2) * .05).toFixed(2) + 's');
  for (i = 0; i < 7; i++) html += _statsFuegoEggLlama('stats-egg-ola is-frente', 'mid', 'left:' + (i * 16 - 6) + '%;animation-delay:' + (.12 + (i % 3) * .07).toFixed(2) + 's');
  html += '</span>';
  for (i = 0; i < 18; i++) {
    var ang = i / 18 * Math.PI * 2 + (i % 2) * .17, dist = radio * (.55 + (i % 3) * .2);
    html += '<span class="stats-egg-chispa" style="--dx:' + Math.round(Math.cos(ang) * dist) + 'px;--dy:' + Math.round(Math.sin(ang) * dist) + 'px;animation-delay:' + ((i % 4) * .04).toFixed(2) + 's"></span>';
  }
  var capa = document.createElement('div');
  capa.id = 'stats-egg-estallido';
  capa.className = 'stats-egg-estallido';
  capa.setAttribute('aria-hidden', 'true');
  capa.style.setProperty('--cx', cx + 'px');
  capa.style.setProperty('--cy', cy + 'px');
  capa.style.setProperty('--onda', (radio / 20).toFixed(1));
  capa.innerHTML = html;
  document.body.appendChild(capa);
  if (navigator.vibrate) { try { navigator.vibrate([60, 40, 160]); } catch (e) {} }
  var mar = capa.querySelector('.stats-egg-mar'), hecho = false;
  var fin = function() {
    if (hecho) return;
    hecho = true;
    capa.remove();
    if (_statsFuegoEgg.fase === 'estallando') _statsFuegoEggEnLlamas();
  };
  mar.addEventListener('animationend', function(ev) { if (ev.animationName === 'stats-egg-mar') fin(); });
  setTimeout(fin, _STATS_FUEGO_EGG.estallidoMs + 1500);
}
// Pantalla en llamas: brillo en los bordes, llamas en el borde inferior del contenido y brasas. Sin eventos de puntero.

var _statsMetricas = {
  asistencia: ['Asistencia','Qué parte de las sesiones registradas corresponde a jugadores que asistieron, también si llegaron tarde.','Se suman presentes y retrasos y se divide entre presentes, ausentes y retrasos; después se multiplica por 100 y se redondea. Una ausencia justificada sigue contando como ausencia. Solo entran registros no excluidos en sesiones finalizadas, guardadas y no canceladas de la temporada y periodo elegidos. Sin registros se muestra —.'],
  puntualidad: ['Puntualidad','De las veces que vino, llegó a su hora. Las ausencias no afectan a este porcentaje.','Se divide el número de llegadas a tiempo entre todas las veces que asistió (a tiempo o con retraso), se multiplica por 100 y se redondea. Si nadie asistió, se muestra —.'],
  registros: ['Sesiones registradas','Registros válidos de asistencia de jugadores en el periodo elegido.','Se cuentan presentes, ausentes y retrasos no excluidos en sesiones computables. En un equipo o en el club, un entrenamiento puede aportar un registro por jugador; no es el número de entrenamientos distintos.'],
  rachaActual: ['Racha actual','Secuencia más reciente de asistencias sin faltar. Llegar tarde mantiene la racha.','Se ordenan los registros por fecha y hora, del más reciente al más antiguo, y se cuentan presencias o retrasos hasta la primera ausencia. Los registros excluidos o sin registrar no participan.'],
  mejorRacha: ['Mejor racha','La secuencia más larga de asistencias consecutivas dentro del periodo elegido.','Mayor número de presencias o retrasos seguidos al recorrer los registros por fecha y hora. Cada ausencia corta la secuencia.'],
  tendencia: ['Tendencia','Compara la temporada con las últimas 4 semanas. Estable significa que el porcentaje no ha cambiado; una flecha indica cuántos puntos subió o bajó.','Porcentaje de asistencia de los últimos 28 días menos el porcentaje de la temporada. Solo se muestra para la temporada activa completa y con al menos 4 registros recientes válidos. La referencia «vs. últimas 4 semanas» no compara dos bloques consecutivos de 28 días.'],
  computables: ['Sesiones computables','Entrenamientos que pueden entrar en los cálculos del periodo.','Sesiones de la temporada elegida cuya fecha está en el intervalo, ya han terminado, no están canceladas y tienen la asistencia guardada. Cada sesión se cuenta una vez.'],
  canceladas: ['Sesiones canceladas','Entrenamientos marcados como cancelados en el periodo.','Se cuentan las sesiones canceladas de la temporada cuya fecha está entre el inicio y el fin del filtro. No entran en los porcentajes de asistencia.'],
  pendientes: ['Sesiones pendientes','Entrenamientos ya terminados en los que aún no se ha guardado la asistencia.','Se cuentan sesiones no canceladas del intervalo cuya fecha y hora de fin ya han pasado y no tienen AsistenciaGuardada. No se convierten en ausencias ni entran en los porcentajes.'],
  horasProgramadas: ['Horas programadas','Duración prevista de los entrenamientos computables, no tiempo real de llegada o salida.','Suma de los minutos entre HoraInicio y HoraFin de cada sesión computable, dividida entre 60 y redondeada a una décima. Una duración ausente o negativa aporta cero.'],
  horasAsistidas: ['Horas programadas asistidas','Duración prevista de los entrenamientos a los que el jugador asistió.','Suma de la duración programada de los registros P o R, dividida entre 60 y redondeada a una décima. No se descuentan minutos de retraso.'],
  mediaAsistentes: ['Asistentes medios','Promedio de jugadores presentes o con retraso por entrenamiento computable.','Total de P + R del equipo dividido entre sus sesiones computables, redondeado a una décima. Una sesión computable sin jugadores registrados sigue contando en el divisor.'],
  plantilla: ['Plantilla activa','Jugadores con relación de equipo vigente al final del periodo.','Se cuenta cada jugador una vez por equipo si su intervalo de alta y baja incluye la fecha final del filtro. Incluye relaciones principales y secundarias.'],
  distribucion: ['Distribución de la plantilla','Reparto de jugadores de la plantilla del periodo según su asistencia.','Con al menos 5 registros: alta ≥ 85 %, media entre 70 y 84 %, baja < 70 %. Con 1 a 4 registros se muestra Pocas sesiones. Quienes no tienen registros no se incluyen en estos grupos.'],
  motivos: ['Motivos de ausencias y retrasos','Motivos asociados a incidencias justificadas, separados entre ausencias y retrasos.','Se agrupan únicamente registros A o R con TieneJustificacion por MotivoCategoria; si falta el motivo se usa Sin motivo. No se infieren motivos para incidencias sin justificar.'],
  justificacion: ['Incidencias justificadas','Qué parte de las ausencias y retrasos tiene una justificación registrada.','Se suman ausencias y retrasos justificados, se divide entre todas las ausencias y retrasos y se multiplica por 100; se redondea al entero. Una justificación no transforma una ausencia en presencia. Sin incidencias se muestra —.'],
  avisos: ['Avisos y justificaciones','Incidencias justificadas y forma en que se comunicaron.','Total: registros A o R justificados. Programadas: JustificadoPor es programacion. Previos: las demás justificaciones cuya fecha es anterior al inicio del entrenamiento. Una incidencia programada no vuelve a contarse como aviso previo.'],
  antelacion: ['Antelación de avisos','Tiempo habitual con el que se avisó antes del entrenamiento.','Mediana de las horas entre FechaJustificacion y el inicio de la sesión, solo para A o R justificados previamente y no procedentes de programación. Se ordenan los valores y se toma el central, o la media de los dos centrales; se redondea a una décima. Sin avisos válidos se muestra —.'],
  dia: ['Asistencia por día','Cómo varía la asistencia según el día de la semana.','Se agrupan los registros válidos por el día de la fecha de la sesión, de lunes a domingo. En cada grupo se calcula (P + R) / (P + A + R) × 100.'],
  mes: ['Asistencia mes a mes','Cada barra cuenta cuántas veces estuvo presente, llegó tarde o faltó durante ese mes.','Los registros válidos se agrupan por el mes de la sesión y se cuentan por separado presentes, retrasos y ausentes. En entrenadores, la barra cuenta las veces que estuvo presente de sus sesiones registradas. Solo se incluyen meses con registros.'],
  semana: ['Evolución semanal','Asistencia de jugadores agrupada en semanas que empiezan el lunes.','Se agrupan los registros por el lunes de la semana de la sesión y se calcula (P + R) / (P + A + R) × 100 en cada grupo. Solo se incluyen semanas con registros.'],

  if (/^\d{9}$/.test(telefono)) telefono = '+34' + telefono;
  if (/^34\d{9}$/.test(telefono)) telefono = '+' + telefono;
  return /^\+\d{7,15}$/.test(telefono) ? telefono : '';

  guardarStaffPerfil: function(datos, force, emailWarningConfirmed, emailChangeConfirmed) {

    if (datos.Email && !_validarEmail(datos.Email)) { showToast('El email no tiene un formato válido','error'); return; }
    if (datos.Telefono && !_validarTel(datos.Telefono)) { showToast('El teléfono no tiene un formato válido (mín. 9 dígitos)','error'); return; }
    if (jugador) {
      if (datos.FechaNac && datos.FechaNac > _hoy()) { showToast('La fecha de nacimiento no puede ser futura','error'); return; }
      for (var n = 1; n <= 2; n++) {
        if (datos['EmailPadre'+n] && !_validarEmail(datos['EmailPadre'+n])) { showToast('El email del familiar ' + n + ' no es válido','error'); return; }
        if (datos['TelefonoPadre'+n] && !_validarTel(datos['TelefonoPadre'+n])) { showToast('El teléfono del familiar ' + n + ' no es válido','error'); return; }
      }
      if (datos.Dorsal !== undefined && _normalizarDorsal(datos.Dorsal) !== _normalizarDorsal(persona.Dorsal)) {
        var errorDorsal = _errorDorsalEquiposJugador(persona.ID, datos.Dorsal);
        if (errorDorsal) { showToast(errorDorsal,'error'); return; }
      }
    } else {
      if (App.cache.entrenadores.some(function(e) { return e.ID !== persona.ID && String(e.Email || '').toLowerCase() === datos.Email.toLowerCase(); })) { showToast('Ya existe un entrenador con ese email','error'); return; }
    }
    var duplicado = (jugador ? App.cache.jugadores : App.cache.entrenadores).some(function(p) { return p.ID !== persona.ID && String(p.Nombre || '').toLowerCase() === datos.Nombre.toLowerCase() && String(p.Apellidos || '').toLowerCase() === datos.Apellidos.toLowerCase(); });
    var self = this;
    if (!force && duplicado) {
      confirmarYGuardar(jugador ? 'Jugador duplicado' : 'Entrenador duplicado','Ya existe una persona llamada <strong>' + _statsTexto(datos.Nombre + ' ' + datos.Apellidos) + '</strong>. ¿Deseas guardarlo igualmente?',function() { self.guardarStaffPerfil(datos,true,emailWarningConfirmed,emailChangeConfirmed); });
      return;
    }
    if (jugador && !emailWarningConfirmed && !(datos.EmailPadre1 && datos.NotificarAusenciasPadre1) && !(datos.EmailPadre2 && datos.NotificarAusenciasPadre2)) {
      confirmarYGuardar('Aviso de notificaciones','No se enviarán avisos de ausencia por email. No hay ningún email familiar informado y activado para recibirlos. Puedes guardar igualmente y configurar los contactos más adelante.',function() { self.guardarStaffPerfil(datos,force,true,emailChangeConfirmed); });
      return;
    }
    if (!jugador && !emailChangeConfirmed && String(persona.Email || '').toLowerCase() !== datos.Email.toLowerCase()) {
      confirmarYGuardar('Cambio de email','Cámbialo solo si el entrenador cambió de cuenta de Google. El cambio afectará a su próximo inicio de sesión.',function() { self.guardarStaffPerfil(datos,force,emailWarningConfirmed,true); });
      return;
    }
    var id = persona.ID, tabla = jugador ? 'jugadores' : 'entrenadores';
    return App.operation.run('staff-profile:' + id,jugador ? 'actualizarJugador' : 'actualizarEntrenador',[id,datos],function() {

  guardarStaffCredenciales: function() {
    if (!this.isStaff() || !this.allowed()) return;

    var pinField = document.getElementById('staff-pin'), confirmField = document.getElementById('staff-pin-confirm');

  guardarStaffCodigo: function() {

  eliminarStaff: function() {
    if (!this.isStaff() || !this.allowed()) return;
