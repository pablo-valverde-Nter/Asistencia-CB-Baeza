      _bindSwipeRows: function() {
        document.querySelectorAll('#sesion-jugs .jug-card').forEach(function(row) {
          App.views.sesion._bindSwipeRow(row, 'jugador');
        });
        document.querySelectorAll('#sesion-ents .ent-row').forEach(function(row) {
          App.views.sesion._bindSwipeRow(row, 'entrenador');
        });
      },

      _bindSwipeRow: function(row, tipo) {
        if (!row || row.dataset.swipeBound === 'true') return;
        row.dataset.swipeBound = 'true';
        var startX = 0;
        var startY = 0;
        var deltaX = 0;
        var tracking = false;

        row.addEventListener('pointerdown', function(event) {
          if (event.pointerType === 'mouse' && event.button !== 0) return;
          if (event.target.closest('input, label, button, select')) return;
          startX = event.clientX;
          startY = event.clientY;
          deltaX = 0;
          tracking = true;
          row.classList.add('swiping');
          if (row.setPointerCapture) row.setPointerCapture(event.pointerId);
        });
        row.addEventListener('pointermove', function(event) {
          if (!tracking) return;
          var dx = event.clientX - startX;
          var dy = event.clientY - startY;
          if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
            tracking = false;
            row.classList.remove('swiping');
            row.style.transform = '';
            return;
          }
          deltaX = Math.max(-96, Math.min(0, dx));
          if (deltaX < -8) event.preventDefault();
          row.style.transform = 'translateX(' + deltaX + 'px)';
        });
        function finishSwipe(event) {
          if (!tracking) return;
          tracking = false;
          row.classList.remove('swiping');
          row.style.transform = '';
          if (deltaX < -8) row._swipeSuppressUntil = Date.now() + 500;
          if (deltaX <= -70) App.views.sesion.solicitarQuitar(row, tipo);
          deltaX = 0;
          if (row.releasePointerCapture && event && row.hasPointerCapture && row.hasPointerCapture(event.pointerId)) {
            row.releasePointerCapture(event.pointerId);
          }
        }
        function cancelSwipe() {
          tracking = false;
          deltaX = 0;
          row.classList.remove('swiping');
          row.style.transform = '';
        }
        row.addEventListener('pointerup', finishSwipe);
        row.addEventListener('pointercancel', cancelSwipe);
        row.addEventListener('click', function(event) {
          if (row._swipeSuppressUntil && Date.now() < row._swipeSuppressUntil) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      },

      solicitarQuitar: function(row, tipo) {
        if (!row || !row.isConnected) return;
        if (tipo === 'jugador' && row.dataset.justif === 'true') {
          showToast('Este jugador tiene una justificaci\u00f3n activa', 'error');
          return;
        }
        this._pendingRemoval = { row: row, tipo: tipo };
        App.openModal('Quitar de la sesi\u00f3n', _htmlConfirmModal('danger',
          '\u00bfSeguro que quieres quitar ' + (tipo === 'jugador' ? 'este jugador' : 'este entrenador') + ' de la sesi\u00f3n?',
          'No se eliminar\u00e1 de su equipo.',
          'App.views.sesion._confirmarQuitar()'
        ));
      },

      _confirmarQuitar: function() {
        var pendiente = this._pendingRemoval;
        this._pendingRemoval = null;
        App.closeModal();
        if (pendiente && pendiente.row && pendiente.row.isConnected) {
          this._quitarRow(pendiente.row, pendiente.tipo);
        }
      },

      _quitarRow: function(row, tipo) {
        var registros = tipo === 'jugador' ? App.cache.asistJugadores : App.cache.asistEntrenadores;
        var campoId = tipo === 'jugador' ? 'ID_Jugador' : 'ID_Entrenador';
        var yaGuardado = registros.some(function(reg) {
          return reg.ID_Sesion === App.state.sesionId && reg[campoId] === row.dataset.id;
        });
        if (row.dataset.inv !== 'true' || yaGuardado || App.state._sesionAutoSaving) {
          this._removed[tipo === 'jugador' ? 'jugadores' : 'entrenadores'].add(row.dataset.id);
        }
        row.remove();
        App.state._formIsDirty = true;
        App.state._sesionEditVersion++;
      },

      _collectAttendance: function() {
        var jugadores = [];
        document.querySelectorAll('#sesion-jugs .jug-card').forEach(function(card) {
          var estado = App.views.sesion._estadoTarjeta(card);
          jugadores.push({ jugadorId: card.dataset.id, estado: estado,
            minutosRetraso: estado === 'R' && card.dataset.min ? Number(card.dataset.min) : null,
            esInvitado: card.dataset.inv === 'true', limpiarJustif: card.dataset.justifCleared === 'true' });
        });
        var entrenadores = [];
        document.querySelectorAll('#sesion-ents .ent-row').forEach(function(row) {
          entrenadores.push({ entrenadorId: row.dataset.id, asistio: row.querySelector('input[type="checkbox"]').checked,
            esInvitado: row.dataset.inv === 'true' });
        });
        return { jugadores: jugadores, entrenadores: entrenadores,
          excluidosJugadores: Array.from(this._removed.jugadores),
          excluidosEntrenadores: Array.from(this._removed.entrenadores) };
      },

      _applyAttendanceCache: function(sesionId, jugadores, entrenadores, excluidosJugadores, excluidosEntrenadores, fechaPrimerRegistro) {
        var registrosPrevios = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion === sesionId; });
        App.cache.asistJugadores = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion !== sesionId; });
        jugadores.forEach(function(jugador) {
          var original = registrosPrevios.find(function(r) { return r.ID_Jugador === jugador.jugadorId; });
          if (!jugador.estado) {
            if (original && (original.TieneJustificacion === true || original.TieneJustificacion === 'TRUE')) App.cache.asistJugadores.push(original);
            return;
          }
          var justificacion = jugador.limpiarJustif
            ? { TieneJustificacion: false, TipoJustificacion: null, MotivoCategoria: null, MotivoDetalle: null,
                FechaJustificacion: null, JustificadoPor: null, MensajeGenerado: null, NotificadoEntrenador: false }
            : {};
          App.cache.asistJugadores.push(Object.assign({}, original, justificacion, {
            ID_Sesion: sesionId, ID_Jugador: jugador.jugadorId, Estado: jugador.estado,
            EsInvitado: jugador.esInvitado, Excluido: false, MinutosRetraso: jugador.estado === 'R' ? jugador.minutosRetraso || null : null
          }));
        });
        excluidosJugadores.forEach(function(id) {
          var asignado = App.cache.getJugadoresByEquipo(App.cache.sesiones.find(function(s) { return s.ID === sesionId; }).ID_Equipo)
            .some(function(j) { return j.ID === id; });
          if (asignado) App.cache.asistJugadores.push({ ID_Sesion: sesionId, ID_Jugador: id, Excluido: true });
        });
        App.cache.asistEntrenadores = App.cache.asistEntrenadores.filter(function(r) { return r.ID_Sesion !== sesionId; });
        entrenadores.forEach(function(entrenador) {
          App.cache.asistEntrenadores.push({
            ID_Sesion: sesionId, ID_Entrenador: entrenador.entrenadorId,
            Asistio: entrenador.asistio, EsInvitado: entrenador.esInvitado
          });
        });
        excluidosEntrenadores.forEach(function(id) {
          var asignado = App.cache.getEntrenadoresByEquipo(App.cache.sesiones.find(function(s) { return s.ID === sesionId; }).ID_Equipo)
            .some(function(e) { return e.ID === id; });
          if (asignado) App.cache.asistEntrenadores.push({ ID_Sesion: sesionId, ID_Entrenador: id, Excluido: true });
        });
        var conteos = { P: 0, A: 0, R: 0 };
        jugadores.forEach(function(jugador) { if (conteos[jugador.estado] !== undefined) conteos[jugador.estado]++; });
        var sesion = App.cache.sesiones.find(function(item) { return item.ID === sesionId; });
        if (sesion) {
          sesion.AsistenciaGuardada = true;
          if (!sesion.FechaPrimerRegistro && fechaPrimerRegistro) sesion.FechaPrimerRegistro = fechaPrimerRegistro;
          sesion._asistRegistrada = true;
          sesion._statsJug = conteos;
          sesion._statsEnt = entrenadores.filter(function(item) { return item.asistio; }).length;
        }
      },

      guardar: function() {
        var sesionId = App.state.sesionId;
        if (!sesionId || App.state._sesionManualSaving) return;
        var draft = this._collectAttendance();
        var jugadores = draft.jugadores;
        var entrenadores = draft.entrenadores;

        var hayEntAsistido = entrenadores.some(function(e) { return e.asistio; });
        if (!hayEntAsistido) {
          showToast('Debe haber al menos un entrenador con asistencia registrada', 'error');
          return;
        }

        var token = App.operation.begin('attendance:' + sesionId);
        if (!token) return;
        draft.sesionId = sesionId;
        var historyBefore = App.state.viewHistory.slice();
        App.state._formIsDirty = false;
        App.state.sesionId = null;
        App.state._sesionManualSaving = true;
        App.views.sesion._stopAutoSave();
        var _hIdx = App.state.viewHistory.lastIndexOf('sesiones');
        App.state.viewHistory = _hIdx >= 0 ? App.state.viewHistory.slice(0, _hIdx) : App.state.viewHistory.filter(function(v) { return v !== 'sesion'; });
        App.navigate('sesiones', null, false);
        var pendingAutoSave = App.state._sesionAutoSavePromise || Promise.resolve();
        Promise.resolve(pendingAutoSave).catch(function() {}).then(function() {
          return server('guardarAsistenciaCompleta', sesionId, draft);
        }).then(function(result) {
          if (!result || result.success === false) throw new Error(result && result.error || 'No se pudo guardar la asistencia');
          App.views.sesion._applyAttendanceCache(sesionId, jugadores, entrenadores, draft.excluidosJugadores, draft.excluidosEntrenadores, result.fechaPrimerRegistro);
          App.stats.invalidar();
          App.state._sesionManualSaving = false;
          App.state._sesionAutoSaving = false;
          App.state._sesionAutoSavePromise = null;
          App.state._formIsDirty = false;
          App.operation.succeed(token);
          App.views.sesiones.render();
        }).catch(function(error) {
          App.state._sesionManualSaving = false;
          App.state.sesionId = sesionId;
          App.state._sesionDraftRestore = draft;
          App.state.viewHistory = historyBefore;
          App.navigate('sesion', {}, false);
          App.operation.fail(token, (error && error.message) || 'No se pudo guardar la asistencia');
        });
      },

      _startAutoSave: function() {
        App.views.sesion._stopAutoSave();
        App.state._sesionAutoSaveTimer = setInterval(function() {
          if (App.state.currentView === 'sesion' && App.state._formIsDirty) {
            App.views.sesion._autoGuardar();
          }
        }, 5000);
      },
      _stopAutoSave: function() {
        if (App.state._sesionAutoSaveTimer) {
          clearInterval(App.state._sesionAutoSaveTimer);
          App.state._sesionAutoSaveTimer = null;
        }
      },
      _actualizarTs: function(error) {
        var ts = document.getElementById('sesion-autosave-ts');
        if (!ts) return;
        ts.classList.toggle('autosave-error', !!error);
        if (error) {
          ts.textContent = 'Pendiente de guardar';
          ts.style.display = 'block';
          return;
        }
        var n = new Date();
        ts.textContent = 'Guardado a las ' + n.getHours() + ':' + String(n.getMinutes()).padStart(2, '0');
        ts.style.display = 'block';
      },
      _autoGuardar: function() {
        var sesionId = App.state.sesionId;
        if (!sesionId || App.state.currentView !== 'sesion' || App.state._sesionManualSaving) return Promise.resolve();
        if (App.state._sesionAutoSaving) return App.state._sesionAutoSavePromise || Promise.resolve();
        var payload = this._collectAttendance();
        var jugadores = payload.jugadores;
        var entrenadores = payload.entrenadores;
        if (!entrenadores.some(function(e) { return e.asistio; })) return Promise.resolve();
        var editVersion = App.state._sesionEditVersion;
        App.state._sesionAutoSaving = true;
        App.sync.start();
        var request = server('guardarAsistenciaCompleta', sesionId, payload)
          .then(function(result) {
            if (!result || result.success === false) throw new Error(result && result.error || 'Error al guardar');
            App.views.sesion._applyAttendanceCache(sesionId, jugadores, entrenadores, payload.excluidosJugadores, payload.excluidosEntrenadores, result.fechaPrimerRegistro);
            App.stats.invalidar();
            var cancelar = document.getElementById('btn-cancelar-sesion');
            if (cancelar && App.state.sesionId === sesionId) cancelar.style.display = 'none';
            if (editVersion === App.state._sesionEditVersion) App.state._formIsDirty = false;
            App.views.sesion._actualizarTs(false);
            return result;
          })
          .catch(function(error) {
            App.views.sesion._actualizarTs(true);
            _clientLog('attendance_autosave_error', { error: error && error.message ? error.message : null });
          })
          .then(function() {
            App.sync.done();
            App.state._sesionAutoSaving = false;
            App.state._sesionAutoSavePromise = null;
          });
        App.state._sesionAutoSavePromise = request;
        return request;
      },

      buscarInvitadoJug: function() { App.views.sesion._abrirBuscador('jugador'); },
      buscarInvitadoEnt: function() { App.views.sesion._abrirBuscador('entrenador'); },

      _abrirBuscador: function(tipo) {
        var items = tipo === 'jugador' ? App.cache.jugadores : App.cache.entrenadores;
        var selector = tipo === 'jugador' ? '#sesion-jugs .jug-card' : '#sesion-ents .ent-row';
        var idsActuales = new Set([].slice.call(document.querySelectorAll(selector)).map(function(c) { return c.dataset.id; }));
        var disponibles = items.filter(function(i) { return !idsActuales.has(i.ID); });
        App.state._buscadorTipo = tipo;
        App.state._buscadorItems = disponibles;
        App.openModal('Anadir ' + tipo + ' invitado', App.views.sesion._htmlBuscador(disponibles));
      },

      _htmlBuscador: function(items) {
        return '<div class="search-wrap"><input type="search" placeholder="Buscar..." oninput="App.views.sesion._filtrarBuscador(this.value)"></div>' +
          '<div id="buscador-lista">' + items.map(function(i) { return App.views.sesion._htmlBuscadorItem(i); }).join('') + '</div>';
      },

      _htmlBuscadorItem: function(i) {
        var sub = i.Dorsal ? 'Dorsal ' + i.Dorsal : (i.Email || '');
        return '<div class="sr-item" onclick="App.views.sesion._seleccionar(' + _statsArgumento(i) + ')">' +
          App.avatarHtml(i.FotoURL,i.Nombre + ' ' + i.Apellidos,36) +
          '<div><div class="sr-name">' + _esc(i.Apellidos + ', ' + i.Nombre) + '</div>' +
          '<div class="sr-sub">' + _esc(sub) + '</div></div></div>';
      },

      _filtrarBuscador: function(q) {
        var lower = q.toLowerCase();
        var filtrados = (App.state._buscadorItems || []).filter(function(i) {
          return String((i.Nombre||'') + ' ' + (i.Apellidos||'')).toLowerCase().indexOf(lower) >= 0;
        });
        document.getElementById('buscador-lista').innerHTML =
          filtrados.map(function(i) { return App.views.sesion._htmlBuscadorItem(i); }).join('');
      },

      _seleccionar: function(item, tipoRestaurado) {
        if (!tipoRestaurado) App.closeModal();
        var tipo = tipoRestaurado || App.state._buscadorTipo;
        var sesion = App.cache.sesiones.find(function(s) { return s.ID === App.state.sesionId; });
        var esDelEquipo = sesion && (tipo === 'jugador'
          ? App.cache.getJugadoresByEquipo(sesion.ID_Equipo).some(function(j) { return j.ID === item.ID; })

      cancelar: function() {
        var motivos = ['Instalación no disponible', 'Festivo o vacaciones', 'Climatología', 'Falta de jugadores', 'Partido o torneo', 'Otro'];
        App.openModal('Cancelar sesión', '<div style="padding:16px"><div class="form-group"><label for="cancelacion-motivo">Motivo</label><select id="cancelacion-motivo">' +
          motivos.map(function(m) { return '<option value="' + _esc(m) + '">' + _esc(m) + '</option>'; }).join('') +
          '</select></div><button class="btn btn-primary btn-full" onclick="App.views.sesion._confirmarCancelar()">Confirmar cancelación</button></div>');
      },

      _confirmarCancelar: function() {
        var id = App.state.sesionId;
        var motivo = document.getElementById('cancelacion-motivo').value;
        return App.operation.run('cancel-session:' + id, 'cancelarSesion', [id, motivo], function(res) {
          App.cache.upsert('sesiones', res.sesion);
          App.stats.invalidar();
          App.closeModal();
          App.views.sesion._stopAutoSave();
          App.state._formIsDirty = false;
          App.state.sesionId = null;
          var hIdx = App.state.viewHistory.lastIndexOf('sesiones');
          App.state.viewHistory = hIdx >= 0 ? App.state.viewHistory.slice(0, hIdx) : App.state.viewHistory.filter(function(v) { return v !== 'sesion'; });
          App.navigate('sesiones', null, false);
        }).catch(function() {});
      },

      eliminar: function() {
        var sesionId = App.state.sesionId;
        if (!sesionId) return;
        var sesion = App.cache.sesiones.find(function(s) { return s.ID === sesionId; });
        var fecha = sesion ? sesion.Fecha : sesionId;
        App.openModal('Eliminar sesi\u00f3n',
          _htmlConfirmModal('danger',
            '\u00bfSeguro que quieres eliminar la sesi\u00f3n del <strong>' + fecha + '</strong>?',
            'Se eliminar\u00e1n todas las asistencias de esta sesi\u00f3n.',
            "App.views.sesion._confirmarEliminar()"
          )
        );
      },
      _confirmarEliminar: function() {
        var sesionId = App.state.sesionId;
        App.closeModal();
        var historyBefore = App.state.viewHistory.slice();
        // OPTIMISTA: guardar backup para rollback
        var sesionBackup = Object.assign({}, App.cache.sesiones.find(function(s) { return s.ID === sesionId; }));
        var asistJugBackup = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion === sesionId; });
        var asistEntBackup = App.cache.asistEntrenadores.filter(function(r) { return r.ID_Sesion === sesionId; });
        // Limpiar cache y navegar inmediatamente
        App.cache.remove('sesiones', sesionId);
        App.cache.asistJugadores   = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion !== sesionId; });
        App.cache.asistEntrenadores = App.cache.asistEntrenadores.filter(function(r) { return r.ID_Sesion !== sesionId; });
        App.state._formIsDirty = false;
        App.state.sesionId = null;
        App.views.sesion._stopAutoSave();
        var _hIdx = App.state.viewHistory.lastIndexOf('sesiones');
        App.state.viewHistory = _hIdx >= 0 ? App.state.viewHistory.slice(0, _hIdx) : App.state.viewHistory.filter(function(v) { return v !== 'sesion'; });
        App.navigate('sesiones', null, false);
        // Eliminar en servidor en segundo plano con rollback si falla
        App.sync.run('eliminarSesion', [sesionId], function() {
          if (sesionBackup && sesionBackup.ID) App.cache.upsert('sesiones', sesionBackup);
          asistJugBackup.forEach(function(r) { App.cache.asistJugadores.push(r); });
          asistEntBackup.forEach(function(r) { App.cache.asistEntrenadores.push(r); });
          App.state.sesionId = sesionId;
          App.state.viewHistory = historyBefore;
          App.navigate('sesion', {}, false);
        });
      },
    },

      descargarPDF: function(jugadorId) {
        var justif = App.notifications.justificacion(App.views.sesion._registroJustificacion(jugadorId));
        if (!justif) return;
        var nombre = justif.jugador.Apellidos + ', ' + justif.jugador.Nombre, fecha = justif.sesion.Fecha;
        var tipo = justif.tipo + (justif.minutos ? ' (' + justif.minutos + ' min)' : '');
        var safeName = (nombre + '_' + fecha + '_' + justif.tipo).replace(/[^a-zA-Z\u00c0-\u024f0-9_\-]/g, '_');
        var titulo = 'Justificacion_' + safeName + '.pdf';
        var msgHtml = _statsTexto(justif.mensaje);
        var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + titulo + '</title>' +
          '<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;max-width:620px;margin:40px auto;color:#222;line-height:1.6;padding:0 16px}' +
          'h2{font-size:1.15rem;border-bottom:2px solid #4CAF50;padding-bottom:8px;color:#2e7d32;margin-top:0}' +
          '.meta{font-size:.85rem;color:#555;margin-bottom:20px;line-height:2}' +
          '.msg{font-size:.92rem;background:#f9f9f9;border:1px solid #ddd;border-radius:6px;padding:16px;white-space:pre-wrap}' +
          '.footer{margin-top:32px;font-size:.75rem;color:#999;text-align:center}' +
          '.print-btn{display:block;margin:28px auto 0;padding:10px 28px;background:#4CAF50;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}' +
          '@media print{.print-btn{display:none}}</style>' +
          '</head><body>' +
          '<h2>Justificaci\u00f3n de incidencia \u2014 CB Baeza</h2>' +
          '<div class="meta">' +
          '<strong>Jugador:</strong> ' + _statsTexto(nombre) + '<br>' +
          '<strong>Fecha:</strong> ' + _statsTexto(fecha) + '<br>' +
          '<strong>Tipo:</strong> ' + _statsTexto(tipo) + '<br><strong>Motivo:</strong> ' + _statsTexto(justif.motivo) +
          '</div>' +
          '<div class="msg">' + msgHtml + '</div>' +
          '<div class="footer">Generado autom\u00e1ticamente \u2014 CB Baeza</div>' +
          '<button class="print-btn" onclick="window.print()">Guardar como PDF</button>' +
          '<script>window.addEventListener(\'load\',function(){setTimeout(function(){window.print();},300);});<\/script>' +
          '</body></html>';
        var win;
        try {
          win = window.open('', '_blank');
        } catch (e) {
          win = null;
        }
        if (!win) {
          showToast('El navegador ha bloqueado la ventana del justificante', 'error');
          return;
        }
        try {
          win.opener = null;
          win.document.open();
          win.document.write(html);
          win.document.close();
        } catch (ePrint) {
          win.close();
          showToast('No se pudo preparar el justificante en PDF', 'error');
        }
      },

      guardar: function(force) {
        var nombreEl = document.getElementById('eq-nombre');
        if (!nombreEl) { showToast('Error: recarga la página (formulario no encontrado)', 'error'); return; }
        var nombre    = nombreEl.value.trim();
        var categoria = document.getElementById('eq-categoria').value;
        var modalidad = document.getElementById('eq-modalidad').value;
        if (!nombre) { showToast('El nombre es obligatorio', 'error'); return; }
        if (App.state.formEntrenadores.length === 0) { showToast('Debes asignar al menos un entrenador al equipo', 'error'); return; }

        var horarios = Object.keys(App.state.formDias).map(function(dia) {
          var h = App.state.formDias[dia];
          return {DiaSemana: Number(dia), HoraInicio: h.inicio, HoraFin: h.fin};
        });

        // Validar que hora inicio < hora fin en cada día de entrenamiento
        var horarioInvalido = horarios.find(function(h) { return h.HoraInicio >= h.HoraFin; });
        if (horarioInvalido) { showToast('La hora de inicio debe ser anterior a la hora de fin', 'error'); return; }

        var equipoId = App.state.formEquipoId;
        if (!force) {
          var dup = App.cache.equipos.find(function(eq) {
            return eq.ID !== equipoId && String(eq.Nombre||'').toLowerCase() === nombre.toLowerCase();
          });
          if (dup) {
            App.openModal('Equipo duplicado',
              _htmlWarnModal('Ya existe un equipo llamado <strong>' + _esc(nombre) + '</strong>.',
                '¿Deseas guardarlo igualmente?', 'Guardar igualmente', "App.closeModal();App.views['equipo-form'].guardar(true)")
            );
            return;
          }
        }

        if (equipoId) {
          var operationToken = App.operation.begin('team:' + equipoId);
          if (!operationToken) return;
          var formHistory = App.state.viewHistory.slice();
          // ── EDICIÓN OPTIMISTA ─────────────────────────────────────────────
          // Capturar backup para posible rollback
          var eqAntes = Object.assign({}, App.cache.equipos.find(function(e) { return e.ID === equipoId; }));
          var horAntes = App.cache.horarios.filter(function(h) { return h.ID_Equipo === equipoId; }).map(function(h) { return Object.assign({}, h); });
          var jugRelAntes = App.cache.jugadoresEquipos.filter(function(r) { return r.ID_Equipo === equipoId; }).map(function(r) { return Object.assign({}, r); });
          var entRelAntes = App.cache.entrenadoresEquipos.filter(function(r) { return r.ID_Equipo === equipoId; }).map(function(r) { return Object.assign({}, r); });

          // Actualizar cache inmediatamente
          App.cache.upsert('equipos', { ID: equipoId, Nombre: nombre, Categoria: categoria, Modalidad: modalidad });
          for (var i = 0; i < App.state.equipos.length; i++) {
            if (App.state.equipos[i].ID === equipoId) {
              App.state.equipos[i] = Object.assign({}, App.state.equipos[i], { Nombre: nombre, Categoria: categoria, Modalidad: modalidad });
              break;
            }
          }
          App.cache.horarios = App.cache.horarios.filter(function(h) { return h.ID_Equipo !== equipoId; });
          horarios.forEach(function(h) {
            App.cache.horarios.push({ ID: 'h_' + equipoId + '_' + h.DiaSemana, ID_Equipo: equipoId, DiaSemana: h.DiaSemana, HoraInicio: h.HoraInicio, HoraFin: h.HoraFin });
          });
          App.cache._setRelacionesEquipo(equipoId, App.state.formJugadores, App.state.formEntrenadores);

          App.state._formIsDirty = false;
          var _hIdx = App.state.viewHistory.lastIndexOf('equipos-admin');
          App.state.viewHistory = _hIdx >= 0 ? App.state.viewHistory.slice(0, _hIdx) : App.state.viewHistory.filter(function(v) { return v !== 'equipo-form' && v !== 'equipo-detalle'; });
          App.navigate('equipos-admin', null, false);

          // Sincronizar en segundo plano con rollback si falla
          App.sync.start();
          server('actualizarEquipo', equipoId, { Nombre: nombre, Categoria: categoria, Modalidad: modalidad })
            .then(function(res) {
              if (!res.success) throw new Error(res.error);
              return Promise.all([
                server('setHorariosEquipo', equipoId, horarios),
                App.views['equipo-form']._sincronizarPersonas(equipoId),
              ]);
            }).then(function(resultados) {
              if (!resultados[0] || resultados[0].success === false) {
                throw new Error(resultados[0] && resultados[0].error || 'No se pudieron guardar los horarios');
              }
              App.sync.done();
              App.operation.succeed(operationToken);
              if (App.state.currentView === 'equipos-admin') App.views['equipos-admin'].render();
            })
            .catch(function(e) {
              App.sync.done();
              // Rollback
              if (eqAntes && eqAntes.ID) App.cache.upsert('equipos', eqAntes);
              App.cache.horarios = App.cache.horarios.filter(function(h) { return h.ID_Equipo !== equipoId; });
              horAntes.forEach(function(h) { App.cache.horarios.push(h); });
              App.cache.jugadoresEquipos   = App.cache.jugadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
              App.cache.entrenadoresEquipos = App.cache.entrenadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
              jugRelAntes.forEach(function(r) { App.cache.jugadoresEquipos.push(r); });
              entRelAntes.forEach(function(r) { App.cache.entrenadoresEquipos.push(r); });
              App.state.equipos = App.state.equipos.map(function(e) { return e.ID === equipoId && eqAntes ? eqAntes : e; });
              App.state.formEquipoId = equipoId;
              App.state.viewHistory = formHistory;
              App.navigate('equipo-form', {}, false);
              App.operation.fail(operationToken, (e && e.message) || 'Error al guardar el equipo');
            });

        } else {
          var operationToken = App.operation.begin('team-create');
          if (!operationToken) return;
          var formHistory = App.state.viewHistory.slice();
          var nuevoEquipoId = null;
          var parentIndex = App.state.viewHistory.lastIndexOf('equipos-admin');
          if (parentIndex >= 0) App.state.viewHistory = App.state.viewHistory.slice(0, parentIndex);
          App.state._formIsDirty = false;
          App.navigate('equipos-admin', {}, false);
          server('crearEquipo', { Nombre: nombre, Categoria: categoria, Modalidad: modalidad })
            .then(function(res) {
              if (!res || res.success === false || !res.equipo || !res.equipo.ID) {
                throw new Error(res && res.error || 'No se pudo crear el equipo');
              }
              nuevoEquipoId = res.equipo.ID;
              App.cache.upsert('equipos', res.equipo);
              if (!App.state.equipos.some(function(e) { return e.ID === nuevoEquipoId; })) App.state.equipos.push(res.equipo);
              App.state.formEquipoId = nuevoEquipoId;
              return Promise.all([
                server('setHorariosEquipo', nuevoEquipoId, horarios),
                App.views['equipo-form']._sincronizarPersonas(nuevoEquipoId),
              ]);
            }).then(function(resultados) {
              if (!resultados || !resultados[0] || resultados[0].success === false) {
                throw new Error(resultados && resultados[0] && resultados[0].error || 'No se pudieron guardar los horarios');
              }
              var nuevoId = nuevoEquipoId;
              App.cache.horarios = App.cache.horarios.filter(function(h) { return h.ID_Equipo !== nuevoId; });
              horarios.forEach(function(h) {
                App.cache.horarios.push({ ID: 'h_' + nuevoId + '_' + h.DiaSemana, ID_Equipo: nuevoId, DiaSemana: h.DiaSemana, HoraInicio: h.HoraInicio, HoraFin: h.HoraFin });
              });
              App.cache._setRelacionesEquipo(nuevoId, App.state.formJugadores, App.state.formEntrenadores);
              App.state._formIsDirty = false;
              App.state.formEquipoId = null;
              App.views['equipos-admin'].render();
              App.operation.succeed(operationToken);
            })
            .catch(function(e) {
              if (nuevoEquipoId) {
                App.state.formEquipoId = nuevoEquipoId;
                App.state.equipos = App.state.equipos.map(function(item) {
                  return item.ID === nuevoEquipoId ? (App.cache.getEquipoById(nuevoEquipoId) || item) : item;
                });
              } else {
                App.state.formEquipoId = null;
              }
              App.state.viewHistory = formHistory;
              App.state._formIsDirty = true;
              App.navigate('equipo-form', {}, false);
              App.operation.fail(operationToken, (e && e.message) || 'Error al crear el equipo');
            });
        }
      },

      eliminar: function() {
        var equipoId = App.state.formEquipoId;
        if (!equipoId) return;
        var eq = App.cache.getEquipoById(equipoId);
        var nombre = eq ? eq.Nombre : 'este equipo';
        App.openModal('Eliminar equipo',
          _htmlConfirmModal('danger',
            '\u00bfSeguro que quieres eliminar <strong>' + _esc(nombre) + '</strong>?',
            'Se eliminar\u00e1n todas sus sesiones, asistencias y horarios. Los jugadores y entrenadores NO se eliminar\u00e1n.',
            "App.views['equipo-form']._confirmarEliminar()"
          )
        );
      },
      _confirmarEliminar: function() {
        var equipoId = App.state.formEquipoId;
        App.closeModal();
        var historyBefore = App.state.viewHistory.slice();
        // OPTIMISTA: guardar backup para posible rollback
        var eqBackup      = Object.assign({}, App.cache.equipos.find(function(e) { return e.ID === equipoId; }));
        var sesBackup     = App.cache.sesiones.filter(function(s) { return s.ID_Equipo === equipoId; }).map(function(s) { return Object.assign({}, s); });
        var horBackup     = App.cache.horarios.filter(function(h) { return h.ID_Equipo === equipoId; }).map(function(h) { return Object.assign({}, h); });
        var jugRelBackup  = App.cache.jugadoresEquipos.filter(function(r) { return r.ID_Equipo === equipoId; }).map(function(r) { return Object.assign({}, r); });
        var entRelBackup  = App.cache.entrenadoresEquipos.filter(function(r) { return r.ID_Equipo === equipoId; }).map(function(r) { return Object.assign({}, r); });
        var sesionIds     = sesBackup.map(function(s) { return s.ID; });
        var asistJugBackup = App.cache.asistJugadores.filter(function(r) { return sesionIds.indexOf(r.ID_Sesion) >= 0; });
        var asistEntBackup = App.cache.asistEntrenadores.filter(function(r) { return sesionIds.indexOf(r.ID_Sesion) >= 0; });

        // Limpiar cache y navegar a la lista inmediatamente
        App.cache.sesiones = App.cache.sesiones.filter(function(s) { return s.ID_Equipo !== equipoId; });
        App.cache.asistJugadores   = App.cache.asistJugadores.filter(function(r) { return sesionIds.indexOf(r.ID_Sesion) < 0; });
        App.cache.asistEntrenadores = App.cache.asistEntrenadores.filter(function(r) { return sesionIds.indexOf(r.ID_Sesion) < 0; });
        App.cache.horarios = App.cache.horarios.filter(function(h) { return h.ID_Equipo !== equipoId; });
        App.cache.jugadoresEquipos   = App.cache.jugadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
        App.cache.entrenadoresEquipos = App.cache.entrenadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
        App.cache.remove('equipos', equipoId);
        App.state.equipos = App.state.equipos.filter(function(e) { return e.ID !== equipoId; });
        App.state.formEquipoId = null;
        App.state._formIsDirty = false;
        // Limpiar historial para no volver a la ficha eliminada
        var _hIdx = App.state.viewHistory.lastIndexOf('equipos-admin');
        App.state.viewHistory = _hIdx >= 0 ? App.state.viewHistory.slice(0, _hIdx) : App.state.viewHistory.filter(function(v) { return v !== 'equipo-form' && v !== 'equipo-detalle'; });
        App.navigate('equipos-admin', {}, false);

        // Eliminar en servidor en segundo plano con rollback si falla
        App.sync.run('eliminarEquipo', [equipoId], function() {
          if (eqBackup && eqBackup.ID) { App.cache.upsert('equipos', eqBackup); App.state.equipos.push(eqBackup); }
          sesBackup.forEach(function(s) { App.cache.upsert('sesiones', s); });
          horBackup.forEach(function(h) { App.cache.horarios.push(h); });
          jugRelBackup.forEach(function(r) { App.cache.jugadoresEquipos.push(r); });
          entRelBackup.forEach(function(r) { App.cache.entrenadoresEquipos.push(r); });
          asistJugBackup.forEach(function(r) { App.cache.asistJugadores.push(r); });
          asistEntBackup.forEach(function(r) { App.cache.asistEntrenadores.push(r); });
          App.state.formEquipoId = equipoId;
          App.state.viewHistory = historyBefore;
          App.navigate('equipo-form', {}, false);
        });
      },

      _sincronizarPersonas: function(equipoId) {
        var idsEntAhora = App.state.formEntrenadores.map(function(e) { return e.ID; });
        var idsEntAntes = App.state.formEntOriginales;
        var idsJugAhora = App.state.formJugadores.map(function(j) { return j.ID; });
        var idsJugAntes = App.state.formJugOriginales;
        var previas = [], altasJugadores = [];

        idsEntAhora.filter(function(id) { return idsEntAntes.indexOf(id) < 0; }).forEach(function(id) {
          previas.push(function() { return server('asignarEntrenadorAEquipo', id, equipoId); });
        });
        idsEntAntes.filter(function(id) { return idsEntAhora.indexOf(id) < 0; }).forEach(function(id) {
          previas.push(function() { return server('desasignarEntrenadorDeEquipo', id, equipoId); });
        });
        idsJugAntes.filter(function(id) { return idsJugAhora.indexOf(id) < 0; }).forEach(function(id) {
          previas.push(function() { return server('desasignarJugadorDeEquipo', id, equipoId); });
        });
        // Las altas de jugadores van tras las bajas: el servidor valida el dorsal contra la plantilla activa.
        App.state.formJugadores.filter(function(j) { return idsJugAntes.indexOf(j.ID) < 0; }).forEach(function(j) {
          altasJugadores.push(function() { return server('asignarJugadorAEquipo', j.ID, equipoId, j.Tipo); });
        });
        var lanzar = function(lote) { return Promise.all(lote.map(function(fn) { return fn(); })); };

        return lanzar(previas).then(function(primeros) {
          return lanzar(altasJugadores).then(function(segundos) { return primeros.concat(segundos); });
        }).then(function(resultados) {
          var errores = resultados.filter(function(r) { return r && r.success === false; });
          if (errores.length > 0) {
            throw new Error(errores.map(function(r) { return r.error; }).filter(Boolean).join('; '));
          }
        });
      },
    },

    // -- Lista jugadores (admin) ----------------------------
    'jugadores-admin': {
      render: function() {
        App.state._todosJugadores = App.cache.jugadores;
        App.views['jugadores-admin']._render(App.cache.jugadores);
      },
      _render: function(lista) {
        var el = document.getElementById('jugadores-admin-lista');
        if (!lista.length) {
          el.innerHTML = '<div class="empty-state"><div class="ei">&#x1F3C0;</div><p>Sin jugadores registrados</p></div>';
          return;
        }

        // 5c-2/5c-3: construir grupos de equipos en el orden correcto
        var misIds = new Set(App.state.equipos.map(function(e) { return e.ID; }));
        var listaIds = new Set(lista.map(function(j) { return j.ID; }));

        var statsJug = App.stats.resumen && App.stats.resumen.datos.jugadores || {};

        // Determinar equipos con jugadores visibles, ordenados según rol
        var equiposConJug = App.cache.equipos.filter(function(eq) {
          return App.cache.jugadoresEquipos.some(function(r) {
            return r.ID_Equipo === eq.ID && (r.Activo === true || r.Activo === 'TRUE') && listaIds.has(r.ID_Jugador);
          });
        });

        var propios = equiposConJug.filter(function(eq) { return misIds.has(eq.ID); })
          .slice().sort(function(a, b) { return App.views._edadIdx(a.Categoria) - App.views._edadIdx(b.Categoria); });
        var resto   = equiposConJug.filter(function(eq) { return !misIds.has(eq.ID); })
          .slice().sort(function(a, b) { return App.views._edadIdx(a.Categoria) - App.views._edadIdx(b.Categoria); });
        var equiposOrdenados = propios.concat(resto);

        // Jugadores sin equipo asignado
        var conEquipo = new Set();
        App.cache.jugadoresEquipos.forEach(function(r) {
          if (r.Activo === true || r.Activo === 'TRUE') conEquipo.add(r.ID_Jugador);
        });
        var sinEquipo = lista.filter(function(j) { return !conEquipo.has(j.ID); });

        function htmlJugador(j) {
          var st = statsJug[j.ID] || { base: 0, asistenciaPct: null, alertas: [] };
          var colorClass = _nivelClase(st.asistenciaPct);
          var statsHtml = '<div class="jug-list-stats"><span class="jls-big ' + colorClass + '">' + _pctTexto(st.asistenciaPct) + '</span><span class="jls-de">' + st.base + ' ses.</span>' + _statsInfoBoton('Asistencia') + '</div>';
          return '<div class="list-item" onclick="App.views[\'jugador-detalle\'].cargar(\'' + j.ID + '\')">' +
            App.avatarHtml(j.FotoURL,j.Nombre + ' ' + j.Apellidos,36) +
            '<div style="flex:1"><div class="li-name">' + _esc(j.Apellidos + ', ' + j.Nombre) + '</div>' +
            '<div class="li-sub">Dorsal ' + _esc(j.Dorsal || '-') + '</div>' + ((st.alertas || []).length ? '<div class="jug-list-alertas">' + _htmlAlerta(st.alertas[0]) + '</div>' : '') + '</div>' +
            statsHtml +
            '<div class="li-arrow">&#x203A;</div></div>';
        }

        function compararJugadores(a, b) {
          var orden = App.state._jugadoresOrden || 'dorsal';
          if (orden.indexOf('asistencia-') === 0) {
            var pa = statsJug[a.ID] && statsJug[a.ID].asistenciaPct, pb = statsJug[b.ID] && statsJug[b.ID].asistenciaPct;
            if (pa == null || pb == null) return pa == null ? (pb == null ? 0 : 1) : -1;
            return (orden === 'asistencia-asc' ? pa - pb : pb - pa) || String(a.Apellidos || '').localeCompare(String(b.Apellidos || ''), 'es');
          }
          var campo = orden.indexOf('apellidos') === 0 ? 'Apellidos' : orden.indexOf('nombre') === 0 ? 'Nombre' : null;
          if (campo) {
            return String(a[campo] || '').localeCompare(String(b[campo] || ''), 'es', { sensitivity: 'base' }) ||
              String(a.Apellidos || '').localeCompare(String(b.Apellidos || ''), 'es', { sensitivity: 'base' }) ||
              String(a.Nombre || '').localeCompare(String(b.Nombre || ''), 'es', { sensitivity: 'base' });
          }
          if (orden === 'dorsal') {
            var dorsalA = String(a.Dorsal || '').trim();
            var dorsalB = String(b.Dorsal || '').trim();
            if (!dorsalA || !dorsalB) return dorsalA ? -1 : dorsalB ? 1 : 0;
            return dorsalA.localeCompare(dorsalB, 'es', { numeric: true, sensitivity: 'base' }) ||
              String(a.Apellidos || '').localeCompare(String(b.Apellidos || ''), 'es', { sensitivity: 'base' });
          }
          var fechaA = String(a.FechaNac || '');
          var fechaB = String(b.FechaNac || '');
          if (!fechaA || !fechaB) return fechaA ? -1 : fechaB ? 1 : 0;
          var comparacionEdad = fechaA.localeCompare(fechaB);
          if (orden === 'edad-asc') comparacionEdad *= -1;
          return comparacionEdad || String(a.Apellidos || '').localeCompare(String(b.Apellidos || ''), 'es', { sensitivity: 'base' });
        }

        var html = '';
        equiposOrdenados.forEach(function(eq) {
          var jugsEq = App.cache.jugadoresEquipos
            .filter(function(r) { return r.ID_Equipo === eq.ID && (r.Activo === true || r.Activo === 'TRUE') && listaIds.has(r.ID_Jugador); })
            .map(function(r) { return lista.find(function(j) { return j.ID === r.ID_Jugador; }); })
            .filter(Boolean)
            .sort(compararJugadores);
          if (!jugsEq.length) return;
          html += '<div class="grp-header"><div class="grp-header-nombre">' + _esc(eq.Nombre) + '</div>' +
            '<div class="grp-header-sub">' + (eq.Categoria || '') + ' &middot; ' + (eq.Modalidad || '') + ' &middot; ' + jugsEq.length + ' jugadores</div></div>';
          html += jugsEq.map(htmlJugador).join('');
        });

        if (sinEquipo.length) {
          html += '<div class="grp-header"><div class="grp-header-nombre">Sin equipo asignado</div>' +
            '<div class="grp-header-sub">' + sinEquipo.length + ' jugadores</div></div>';
          html += sinEquipo.sort(compararJugadores)
            .map(htmlJugador).join('');
        }

        el.innerHTML = html || '<div class="empty-state" style="padding:20px"><p>Sin resultados</p></div>';
      },
      filtrar: function(q) {
        var lower = q.toLowerCase();
        App.views['jugadores-admin']._render(
          App.state._todosJugadores.filter(function(j) {
            return String((j.Nombre || '') + ' ' + (j.Apellidos || '') + ' ' + (j.Dorsal || '')).toLowerCase().indexOf(lower) >= 0;
          })
        );
      },
      ordenar: function(orden) {
        App.state._jugadoresOrden = orden;
        var buscador = document.querySelector('#view-jugadores-admin .search-wrap input');
        this.filtrar(buscador ? buscador.value : '');
      },
    },

    // -- Alta de jugador (entrenador/admin): asistente paso a paso ------------
    // Mismos componentes que App.views.justificacion. Solo el nombre es obligatorio; el resto de
    // pasos se omiten. Crea con crearJugador y termina mostrando las credenciales para compartir.
    altaJugador: {
      PASOS: ['nombre', 'dorsal', 'datos', 'familia', 'completar'],
      // Campos de cada paso omitible: «Omitir» los vacía para no guardar datos a medias.
      CAMPOS_PASO: {
        dorsal: ['alta-dorsal'],
        datos: ['alta-fechanac', 'alta-tel', 'alta-email'],
        familia: ['alta-p1-nombre', 'alta-p1-apellidos', 'alta-p1-tel', 'alta-p1-email', 'alta-p2-nombre', 'alta-p2-apellidos', 'alta-p2-tel', 'alta-p2-email'],
      },
      _paso: 'nombre',
      _desdeEquipo: false,   // true: el jugador nuevo se añade a la plantilla del formulario de equipo abierto
      _familiares: { 1: false, 2: false },
      _jugador: null,        // jugador creado (con Usuario, PIN y CodigoPadres)

      abrir: function(desdeEquipo) {
        this._desdeEquipo = !!desdeEquipo;
        this._familiares = { 1: false, 2: false };
        this._jugador = null;
        ['alta-nombre', 'alta-apellidos'].concat(this.CAMPOS_PASO.dorsal, this.CAMPOS_PASO.datos, this.CAMPOS_PASO.familia).forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.value = '';
        });
        this._limpiarError(document.getElementById('alta-nombre'));
        this._limpiarError(document.getElementById('alta-apellidos'));
        ['alta-p1-notificar', 'alta-p2-notificar'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.checked = true;
        });
        this._irA('nombre', 0);
        document.getElementById('modal-alta-jugador').classList.remove('hidden');
      },

      // Con evento solo cierra al tocar el fondo; sin él (X, «Entendido») cierra siempre.
      cerrar: function(e) {
        var modal = document.getElementById('modal-alta-jugador');
        if (e && e.target !== modal) return;
        App.account.cerrarAvisosInfo();
        modal.classList.add('hidden');
      },

      _valor: function(id) {
        var el = document.getElementById(id);
        return el ? String(el.value == null ? '' : el.value).trim() : '';
      },

      // Datos con la forma que espera crearJugador; un familiar no elegido se envía vacío.
      _leer: function() {
        var self = this, v = function(id) { return self._valor(id); };
        var datos = { Nombre: v('alta-nombre'), Apellidos: v('alta-apellidos'), Dorsal: v('alta-dorsal'),
          FechaNac: v('alta-fechanac'), Telefono: v('alta-tel'), Email: v('alta-email') };
        [1, 2].forEach(function(n) {
          var p = 'alta-p' + n + '-', activo = self._familiares[n], aviso = document.getElementById(p + 'notificar');
          datos['NombrePadre' + n] = activo ? v(p + 'nombre') : '';
          datos['ApellidosPadre' + n] = activo ? v(p + 'apellidos') : '';
          datos['TelefonoPadre' + n] = activo ? v(p + 'tel') : '';
          datos['EmailPadre' + n] = activo ? v(p + 'email') : '';
          datos['NotificarAusenciasPadre' + n] = activo && aviso ? !!aviso.checked : true;
        });
        return datos;
      },

      // Mensaje del primer dato no válido del paso, o null.
      _errorPaso: function(paso, d) {
        if (paso === 'nombre') return !d.Nombre || !d.Apellidos ? 'Escribe el nombre y los apellidos del jugador' : null;
        if (paso === 'dorsal') return this._desdeEquipo ? _errorDorsalFormEquipo(null, d.Dorsal) : null;
        if (paso === 'datos') {
          if (d.FechaNac && d.FechaNac > _hoy()) return 'La fecha de nacimiento no puede ser futura';
          if (d.Telefono && !_validarTel(d.Telefono)) return 'El tel\u00e9fono no tiene un formato v\u00e1lido (m\u00edn. 9 d\u00edgitos)';
          if (d.Email && !_validarEmail(d.Email)) return 'El email no tiene un formato v\u00e1lido';
        }
        if (paso === 'familia') {
          for (var n = 1; n <= 2; n++) {
            if (d['TelefonoPadre' + n] && !_validarTel(d['TelefonoPadre' + n])) return 'El tel\u00e9fono del familiar ' + n + ' no es v\u00e1lido';
            if (d['EmailPadre' + n] && !_validarEmail(d['EmailPadre' + n])) return 'El email del familiar ' + n + ' no es v\u00e1lido';
          }
        }
        return null;
      },

      // Nombre y apellidos: error en línea bajo cada campo vacío y foco en el primero.
      _marcarError: function(input) {
        var msg = document.getElementById(input.id + '-error');
        input.classList.add('is-invalid');
        input.setAttribute('aria-invalid', 'true');
        if (msg) msg.hidden = false;
      },

      _limpiarError: function(input) {
        if (!input) return;
        var msg = document.getElementById(input.id + '-error');
        input.classList.remove('is-invalid');
        input.removeAttribute('aria-invalid');
        if (msg) msg.hidden = true;
      },

      continuar: function() {
        if (this._paso === 'nombre') {
          var self = this, vacios = ['alta-nombre', 'alta-apellidos'].filter(function(id) { return !self._valor(id); });
          vacios.forEach(function(id) { self._marcarError(document.getElementById(id)); });
          if (vacios.length) { document.getElementById(vacios[0]).focus(); return false; }
        }
        var error = this._errorPaso(this._paso, this._leer());
        if (error) { showToast(error, 'error'); return false; }
        this._mover(1);
        return true;
      },

      omitir: function() {
        var campos = this.CAMPOS_PASO[this._paso];
        if (!campos) return;
        campos.forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.value = '';
        });
        if (this._paso === 'familia') this._familiares = { 1: false, 2: false };
        this._mover(1);
      },

      atras: function() {
        if (this._paso !== 'credenciales') this._mover(-1);
      },

      _mover: function(direccion) {
        var destino = this.PASOS[this.PASOS.indexOf(this._paso) + direccion];
        if (destino) this._irA(destino, direccion);
      },

      alternarFamiliar: function(n) {
        this._familiares[n] = !this._familiares[n];
        this._pintarFamiliares();
        var campo = this._familiares[n] && document.getElementById('alta-p' + n + '-nombre');
        if (campo && campo.focus) campo.focus();
      },

      _pintarFamiliares: function() {
        var familiares = this._familiares;
        [1, 2].forEach(function(n) {
          var bloque = document.getElementById('alta-familiar-' + n);
          if (bloque) bloque.hidden = !familiares[n];
        });
        document.querySelectorAll('#alta-steps [data-familiar]').forEach(function(b) {
          b.setAttribute('aria-pressed', String(!!familiares[b.dataset.familiar]));
        });
      },

      // Muestra el paso indicado. direccion: 1 avanza, -1 retrocede, 0 sin animación.
      _irA: function(paso, direccion) {
        this._paso = paso;
        var indice = this.PASOS.indexOf(paso), final = paso === 'credenciales';
        if (paso === 'completar') this._pintarResumen();
        App.account.cerrarAvisosInfo();
        document.querySelectorAll('#alta-steps .justif-step').forEach(function(step) {
          var activo = step.dataset.step === paso;
          step.hidden = !activo;
          step.classList.remove('enter-forward', 'enter-back');
          if (activo && direccion) {
            void step.offsetWidth;
            step.classList.add(direccion > 0 ? 'enter-forward' : 'enter-back');
          }
        });
        this._pintarFamiliares();
        document.getElementById('alta-progress').classList.toggle('hidden', final);
        document.getElementById('alta-progress-text').textContent = 'Paso ' + (indice + 1) + ' de ' + this.PASOS.length;
        document.getElementById('alta-progress-fill').style.width = Math.round((indice + 1) * 100 / this.PASOS.length) + '%';
        document.getElementById('alta-atras').style.visibility = indice > 0 && !final ? 'visible' : 'hidden';
        var contenedor = document.getElementById('alta-steps');
        contenedor.scrollTop = 0;
        if (!direccion || !contenedor.querySelector) return;
        var foco = contenedor.querySelector('.justif-step[data-step="' + paso + '"] .justif-question');
        if (foco) foco.focus({ preventScroll: true });
      },

      // Avisos que antes pedían confirmación: ahora se leen en el resumen antes de guardar.
      _avisos: function(d) {
        var avisos = [], nombre = (d.Nombre + ' ' + d.Apellidos).toLowerCase();
        if (App.cache.jugadores.some(function(j) { return (String(j.Nombre || '') + ' ' + String(j.Apellidos || '')).toLowerCase() === nombre; })) {
          avisos.push('Ya existe un jugador llamado ' + d.Nombre + ' ' + d.Apellidos + '. Se guardar\u00e1 como un jugador nuevo.');
        }
        if (!(d.EmailPadre1 && d.NotificarAusenciasPadre1) && !(d.EmailPadre2 && d.NotificarAusenciasPadre2)) {
          avisos.push('No se enviar\u00e1n avisos de ausencia por email: no hay ning\u00fan email familiar con los avisos activados. Puedes a\u00f1adirlo m\u00e1s adelante.');
        }
        return avisos;
      },

      _pintarResumen: function() {
        var d = this._leer(), filas = [['Nombre', d.Nombre + ' ' + d.Apellidos]];
        if (d.Dorsal) filas.push(['Dorsal', d.Dorsal]);
        if (d.FechaNac) filas.push(['Fecha de nacimiento', d.FechaNac.split('-').reverse().join('/')]);
        if (d.Telefono) filas.push(['Tel\u00e9fono', d.Telefono]);
        if (d.Email) filas.push(['Email', d.Email]);
        [1, 2].forEach(function(n) {
          var partes = [(d['NombrePadre' + n] + ' ' + d['ApellidosPadre' + n]).trim(), d['TelefonoPadre' + n], d['EmailPadre' + n]].filter(Boolean);
          if (partes.length) filas.push(['Familiar ' + n, partes.join(' \u00b7 ')]);
        });
        document.getElementById('alta-resumen').innerHTML = '<dl>' + filas.map(function(f) {
          return '<dt>' + _esc(f[0]) + '</dt><dd>' + _esc(f[1]) + '</dd>';
        }).join('') + '</dl>' + this._avisos(d).map(function(a) { return '<p class="alta-aviso" role="note">' + _esc(a) + '</p>'; }).join('');
      },

      guardar: function() {
        var d = this._leer(), self = this, desdeEquipo = this._desdeEquipo;
        for (var i = 0; i < this.PASOS.length; i++) {
          var error = this._errorPaso(this.PASOS[i], d);
          if (error) { this._irA(this.PASOS[i], -1); showToast(error, 'error'); return Promise.resolve(false); }
        }
        var boton = document.getElementById('alta-guardar');
        if (boton) boton.disabled = true;
        return App.operation.run('player-create', 'crearJugador', [d], function(res) {
          var j = res.jugador;
          if (!j) throw new Error('No se pudo crear el jugador');
          App.cache.upsert('jugadores', j);
          App.state._todosJugadores = App.cache.jugadores;
          if (desdeEquipo) {
            App.state.formJugadores.push({ID:j.ID,Nombre:j.Nombre,Apellidos:j.Apellidos,Dorsal:j.Dorsal,Tipo:'Principal'});
            App.state._formIsDirty = true;
            if (App.state.currentView === 'equipo-form') App.views['equipo-form']._renderListas();
          } else if (App.state.currentView === 'jugadores-admin') {
            App.views['jugadores-admin'].render();
          }
          self._jugador = j;
          if (!j.Usuario) { self.cerrar(); return true; }
          self._pintarCredenciales();
          document.getElementById('modal-alta-jugador').classList.remove('hidden');
          self._irA('credenciales', 1);
          return true;
        }).catch(function() { return false; /* App.operation ya muestra el error */ })
          .then(function(ok) { if (boton) boton.disabled = false; return ok; });
      },

      _pintarCredenciales: function() {
        var j = this._jugador || {};
        var campo = function(id, etiqueta, valor, clase) {
          return '<div class="form-group"><label for="' + id + '">' + etiqueta + '</label><input type="text" id="' + id + '" class="form-control' + (clase ? ' ' + clase : '') + '" readonly value="' + _esc(valor || '') + '"></div>';
        };
        document.getElementById('alta-credenciales').innerHTML =
          '<p class="justif-hint">Comparte estas credenciales con el jugador y su familia:</p>' +
          campo('alta-cred-usuario', 'Usuario', j.Usuario) +
          campo('alta-cred-codigo', 'C\u00f3digo familias', j.CodigoPadres, 'alta-credencial') +
          campo('alta-cred-pin', 'PIN inicial', j.PIN, 'alta-credencial') +
          '<p class="form-hint">Comparte tambi\u00e9n el C\u00f3digo familias con los padres. El jugador puede cambiar su PIN desde la app.</p>';
      },

      textoCredenciales: function(j) {
        j = j || {};
        return 'Usuario: ' + (j.Usuario || '') + '\nPIN: ' + (j.PIN || '') + '\nC\u00f3digo de padres: ' + (j.CodigoPadres || '');
      },

      copiar: function() {
        return _copiarTexto(this.textoCredenciales(this._jugador)).then(function(ok) {
          showToast(ok ? 'Credenciales copiadas' : 'No se pudo copiar; mant\u00e9n pulsado el texto para copiarlo', ok ? 'success' : 'error');
          return ok;
        });
      },

      // Copia el texto y abre WhatsApp sin chat concreto (la app en móvil; wa.me si no se abre o en escritorio).
      whatsapp: function() {
        var copia = _copiarTexto(this.textoCredenciales(this._jugador));
        var agente = typeof navigator !== 'undefined' ? String(navigator.userAgent || '') : '';
        var ventana = /Android|iPhone|iPad|iPod/i.test(agente) ? window.open('whatsapp://', '_blank') : null;
        if (!ventana) window.open('https://wa.me/', '_blank');
        return copia.then(function(ok) {
          showToast(ok ? 'Mensaje copiado, p\u00e9galo en el chat' : 'No se pudo copiar el mensaje', ok ? 'success' : 'error');
          return ok;
        });
      },
    },

    // -- Bienvenida (primera entrada de jugador/familia): asistente paso a paso ---
    // Mismos componentes que altaJugador. Se abre mientras Jugadores.BienvenidaVista es NULL y se marca con
    // marcarBienvenidaVista al guardar, al terminar sin cambios o al cerrar con la X. Guarda con actualizarMiPerfil:
    // mismas validaciones y código de seguridad que «Editar perfil»; los avisos por correo solo se muestran.
    bienvenida: {
      PASOS: ['inicio', 'fecha', 'tutor1', 'tutor2', 'resumen'],
      CAMPOS_PASO: {
        fecha: ['FechaNac'],
        tutor1: ['NombrePadre1', 'ApellidosPadre1', 'TelefonoPadre1', 'EmailPadre1'],
        tutor2: ['NombrePadre2', 'ApellidosPadre2', 'TelefonoPadre2', 'EmailPadre2'],
      },
      _paso: 'inicio',
      _omitidos: {},   // paso → true: sus campos vuelven al valor guardado y no se envían
      _original: {},   // valores del jugador al abrir (prerrelleno)

      debeMostrarse: function() {
        var j = App.state.jugador;
        return App.state.rol === 'jugador' && !!(j && j.ID) && !j.BienvenidaVista;
      },

      // Tras iniciar sesión o recargar: solo la primera vez de cada jugador.
      comprobar: function() {
        if (!this.debeMostrarse()) return false;
        this.abrir(false);
        return true;
      },

      _campos: function() {
        var c = this.CAMPOS_PASO;
        return c.fecha.concat(c.tutor1, c.tutor2);
      },

      _valor: function(campo) {
        var el = document.getElementById('bienvenida-' + campo);
        return el ? String(el.value == null ? '' : el.value).trim() : '';
      },

      _poner: function(campo, valor) {
        var el = document.getElementById('bienvenida-' + campo);
        if (el) el.value = valor;
      },

      // desdePerfil: reabierto desde Perfil > «Completar datos»; empieza en la fecha.
      abrir: function(desdePerfil) {
        var j = App.state.jugador || {}, self = this;
        this._omitidos = {};
        this._original = {};
        this._campos().forEach(function(c) {
          self._original[c] = String(j[c] == null ? '' : j[c]).trim();
          self._poner(c, self._original[c]);
        });
        this._poner('codigo', '');
        [1, 2].forEach(function(n) {
          var avisos = document.getElementById('bienvenida-avisos-' + n);
          if (avisos) avisos.innerHTML = App.account.avisosHtml(j, n, 'bienvenida');
        });
        var logo = document.getElementById('bienvenida-logo'), escudo = document.getElementById('hdr-logo');
        if (logo && escudo && escudo.src && logo.src !== escudo.src) logo.src = escudo.src;
        var saludo = document.getElementById('bienvenida-saludo');
        if (saludo) saludo.textContent = j.Nombre ? 'Hola, ' + j.Nombre + ' y familia' : '';
        this._irA(desdePerfil ? 'fecha' : 'inicio', 0);
        document.getElementById('modal-bienvenida').classList.remove('hidden');
      },

      // La X descarta el asistente: cuenta como vista.
      cerrar: function() {
        this._marcarVista();
        App.account.cerrarAvisosInfo();
        document.getElementById('modal-bienvenida').classList.add('hidden');
      },

      // Silencioso: si falla, la bienvenida vuelve a salir en la próxima entrada.
      _marcarVista: function() {
        var j = App.state.jugador;
        if (!j || j.BienvenidaVista || App.state.rol !== 'jugador') return Promise.resolve(false);
        j.BienvenidaVista = new Date().toISOString();
        return server('marcarBienvenidaVista').then(function(res) {
          if (res && res.success && res.bienvenidaVista) j.BienvenidaVista = res.bienvenidaVista;
          return !!(res && res.success);
        }).catch(function() { return false; });
      },

      _leer: function() {
        var d = {}, self = this;
        this._campos().forEach(function(c) { d[c] = self._valor(c); });
        return d;
      },

      // Solo lo cambiado en pasos no omitidos: un dato ya guardado no se reescribe ni se borra al omitir.
      _cambios: function() {
        var d = this._leer(), cambios = {}, self = this;
        Object.keys(this.CAMPOS_PASO).forEach(function(paso) {
          if (self._omitidos[paso]) return;
          self.CAMPOS_PASO[paso].forEach(function(c) { if (d[c] !== self._original[c]) cambios[c] = d[c]; });
        });
        return cambios;
      },

      // Mensaje del primer dato no válido del paso, o null (mismas reglas que «Editar perfil»).
      _errorPaso: function(paso, d) {
        if (paso === 'fecha' && d.FechaNac && (!/^\d{4}-\d{2}-\d{2}$/.test(d.FechaNac) || d.FechaNac > _hoy())) return 'La fecha de nacimiento no puede ser futura';
        var n = paso === 'tutor1' ? 1 : paso === 'tutor2' ? 2 : 0;
        if (n && d['TelefonoPadre' + n] && !_validarTel(d['TelefonoPadre' + n])) return 'El tel\u00e9fono del tutor ' + n + ' no es v\u00e1lido';
        if (n && d['EmailPadre' + n] && !_validarEmail(d['EmailPadre' + n])) return 'El email del tutor ' + n + ' no es v\u00e1lido';
        return null;
      },

      continuar: function() {
        var error = this._errorPaso(this._paso, this._leer());
        if (error) { showToast(error, 'error'); return false; }
        delete this._omitidos[this._paso];
        this._mover(1);
        return true;
      },

      omitir: function() {
        var campos = this.CAMPOS_PASO[this._paso], self = this;
        if (!campos) return;
        campos.forEach(function(c) { self._poner(c, self._original[c]); });
        this._omitidos[this._paso] = true;
        this._mover(1);
      },

      atras: function() {
        this._mover(-1);
      },

      _mover: function(direccion) {
        var destino = this.PASOS[this.PASOS.indexOf(this._paso) + direccion];
        if (destino) this._irA(destino, direccion);
      },

      // Muestra el paso indicado. direccion: 1 avanza, -1 retrocede, 0 sin animación. La portada no cuenta como paso.
      _irA: function(paso, direccion) {
        this._paso = paso;
        var indice = this.PASOS.indexOf(paso), total = this.PASOS.length - 1;
        if (paso === 'resumen') this._pintarResumen();
        App.account.cerrarAvisosInfo();
        document.querySelectorAll('#bienvenida-steps .justif-step').forEach(function(step) {
          var activo = step.dataset.step === paso;
          step.hidden = !activo;
          step.classList.remove('enter-forward', 'enter-back');
          if (activo && direccion) {
            void step.offsetWidth;
            step.classList.add(direccion > 0 ? 'enter-forward' : 'enter-back');
          }
        });
        document.getElementById('bienvenida-progress').classList.toggle('hidden', indice === 0);
        document.getElementById('bienvenida-progress-text').textContent = 'Paso ' + indice + ' de ' + total;
        document.getElementById('bienvenida-progress-fill').style.width = Math.round(indice * 100 / total) + '%';
        document.getElementById('bienvenida-atras').style.visibility = indice > 0 ? 'visible' : 'hidden';
        var contenedor = document.getElementById('bienvenida-steps');
        contenedor.scrollTop = 0;
        if (!direccion || !contenedor.querySelector) return;
        var foco = contenedor.querySelector('.justif-step[data-step="' + paso + '"] .justif-question');
        if (foco) foco.focus({ preventScroll: true });
      },

      _pintarResumen: function() {
        var cambios = this._cambios(), d = this._leer(), filas = [];
        if ('FechaNac' in cambios) filas.push(['Fecha de nacimiento', d.FechaNac ? d.FechaNac.split('-').reverse().join('/') : 'Sin fecha']);
        [1, 2].forEach(function(n) {
          var cambiado = this.CAMPOS_PASO['tutor' + n].some(function(c) { return c in cambios; });
          if (!cambiado) return;
          var partes = [(d['NombrePadre' + n] + ' ' + d['ApellidosPadre' + n]).trim(), d['TelefonoPadre' + n], d['EmailPadre' + n]].filter(Boolean);
          filas.push(['Tutor ' + n, partes.length ? partes.join(' \u00b7 ') : 'Sin datos']);
        }, this);
        document.getElementById('bienvenida-resumen').innerHTML = filas.length
          ? '<dl>' + filas.map(function(f) { return '<dt>' + _esc(f[0]) + '</dt><dd>' + _esc(f[1]) + '</dd>'; }).join('') + '</dl>'
          : '<p class="justif-hint">No has a\u00f1adido datos nuevos. Puedes completarlos cuando quieras desde Perfil &gt; Completar datos.</p>';
        document.getElementById('bienvenida-codigo-grupo').hidden = !filas.length;
        document.getElementById('bienvenida-guardar').textContent = filas.length ? 'Guardar' : 'Terminar';
      },

      // Sin cambios solo se marca como vista; con cambios guarda y, al confirmarse, la marca.
      guardar: function() {
        var cambios = this._cambios(), d = this._leer(), self = this;
        if (!Object.keys(cambios).length) { this._terminar(); return Promise.resolve(true); }
        for (var i = 1; i < this.PASOS.length - 1; i++) {
          var error = !this._omitidos[this.PASOS[i]] && this._errorPaso(this.PASOS[i], d);
          if (error) { this._irA(this.PASOS[i], -1); showToast(error, 'error'); return Promise.resolve(false); }
        }
        var codigo = this._valor('codigo').toUpperCase();
        if (!/^[A-Z0-9]{6}$/.test(codigo)) { showToast('Introduce el c\u00f3digo de seguridad de 6 caracteres', 'error'); return Promise.resolve(false); }
        var boton = document.getElementById('bienvenida-guardar');
        if (boton) boton.disabled = true;
        return App.operation.run('welcome-profile', 'actualizarMiPerfil', [cambios, codigo], function() {
          App.views['perfil-usuario']._actualizar(cambios);
          self._terminar();
          return true;
        }).catch(function() { return false; /* App.operation ya muestra el error y el asistente sigue abierto */ })
          .then(function(ok) { if (boton) boton.disabled = false; return ok; });
      },

      _terminar: function() {
        this.cerrar();
        var vista = App.state.currentView;
        if ((vista === 'perfil-jugador' || vista === 'perfil-usuario') && App.views[vista] && App.views[vista].render) App.views[vista].render();
      },
    },

    // -- Lista entrenadores (admin) -------------------------
    'entrenadores-admin': {

        // 5a-1: yo primero, luego el resto en el orden original

        );

    // -- Form entrenador ------------------------------------
    'entrenador-form': {
      render: function() {
        if (!App.state._entrenadorDraftRestore) App.views['entrenador-form']._reset();
        App.state._entrenadorDraftRestore = false;
        var setDirty = function() { App.state._formIsDirty = true; };
        ['ent-nombre','ent-apellidos','ent-email','ent-tel'].forEach(function(id) {
          document.getElementById(id).oninput = setDirty;
        });
        // Sección admin solo visible para admins
        var adminWrap = document.getElementById('ent-admin-wrap');
        if (adminWrap) adminWrap.classList.toggle('hidden', !App.state.esAdmin);
        var pinNuevo = document.getElementById('ent-pin-zona-nuevo');
        if (pinNuevo) pinNuevo.style.display = App.state.esAdmin ? '' : 'none';
      },
      _reset: function() {
        App.state._formIsDirty = false;
        ['ent-nombre','ent-apellidos','ent-email','ent-tel'].forEach(function(id) {
          document.getElementById(id).value = '';
        });
        var pinNEl = document.getElementById('ent-pin-nuevo');   if (pinNEl) { pinNEl.value = ''; _pinAviso(pinNEl); }
        var esAdminEl = document.getElementById('ent-es-admin'); if (esAdminEl) esAdminEl.checked = false;
      },
      guardar: function(force) {
        var _n = document.getElementById('ent-nombre');
        if (!_n) { showToast('Error: recarga la página (formulario no encontrado)', 'error'); return; }
        var datos = {
          Nombre:    _n.value.trim(),
          Apellidos: document.getElementById('ent-apellidos').value.trim(),
          Email:     document.getElementById('ent-email').value.trim(),
          Telefono:  document.getElementById('ent-tel').value.trim(),
        };
        var pinNuevo = document.getElementById('ent-pin-nuevo');
        if (pinNuevo && pinNuevo.value.trim()) datos.PIN = pinNuevo.value.trim();
        var _esAdminEl = document.getElementById('ent-es-admin');
        if (App.state.esAdmin && _esAdminEl) datos.EsAdmin = _esAdminEl.checked;
        if (!datos.Nombre || !datos.Apellidos) { showToast('Nombre y apellidos son obligatorios', 'error'); return; }
        if (!datos.Email) { showToast('El email es obligatorio para nuevos entrenadores', 'error'); return; }
        if (datos.Email && !_validarEmail(datos.Email)) { showToast('El email no tiene un formato válido', 'error'); return; }
        if (datos.Telefono && !_validarTel(datos.Telefono)) { showToast('El teléfono no tiene un formato válido (mín. 9 dígitos)', 'error'); return; }
        if (!force) {
          var dupEmail = App.cache.entrenadores.find(function(e) { return String(e.Email || '').toLowerCase() === datos.Email.toLowerCase(); });
          if (dupEmail) { showToast('Ya existe un entrenador con ese email', 'error'); return; }
          // Detectar nombre duplicado
          var dup = App.cache.entrenadores.find(function(e) {
            return String(e.Nombre || '').toLowerCase() === datos.Nombre.toLowerCase() &&
                   String(e.Apellidos || '').toLowerCase() === datos.Apellidos.toLowerCase();
          });
          if (dup) {
            App.openModal('Entrenador duplicado',
              _htmlWarnModal('Ya existe un entrenador llamado <strong>' + _esc(datos.Nombre + ' ' + datos.Apellidos) + '</strong>.',
                '¿Deseas guardarlo igualmente?', 'Guardar igualmente', "App.closeModal();App.views['entrenador-form'].guardar(true)")
            );
            return;
          }
        }
          var crearDesdeEquipo = !!App.state._volverAEquipoFormDespues;
          var historyAntesCrear = App.state.viewHistory.slice();
          var operationToken = App.operation.begin('coach-create');
          if (!operationToken) return;
          var parentIndex = App.state.viewHistory.lastIndexOf('entrenadores-admin');
          if (!crearDesdeEquipo && parentIndex >= 0) App.state.viewHistory = App.state.viewHistory.slice(0, parentIndex);
          App.state._formIsDirty = false;
          App.navigate(crearDesdeEquipo ? 'equipo-form' : 'entrenadores-admin', {}, false);
          server('crearEntrenador', datos)
            .then(function(res) {
              if (!res || res.success === false || !res.entrenador) throw new Error(res && res.error || 'No se pudo crear el entrenador');
              if (res.entrenador) App.cache.upsert('entrenadores', res.entrenador);
              App.state._todosEntrenadores = App.cache.entrenadores;
              App.state._formIsDirty = false;
              App.state._volverAEquipoFormDespues = false;
              if (crearDesdeEquipo) {
                var nuevoEnt = res.entrenador;
                App.state.formEntrenadores.push({ID:nuevoEnt.ID,Nombre:nuevoEnt.Nombre,Apellidos:nuevoEnt.Apellidos});
                App._goBackReal();
                App.state._formIsDirty = true;
                App.views['equipo-form'].render();
              } else {
                App.views['entrenadores-admin'].render();
              }
              App.operation.succeed(operationToken);
            })
            .catch(function(err) {
              App.state._volverAEquipoFormDespues = crearDesdeEquipo;
              App.state.viewHistory = historyAntesCrear;
              App.state._entrenadorDraftRestore = true;
              App.state._formIsDirty = true;
              App.navigate('entrenador-form', {}, false);
              App.operation.fail(operationToken, (err && err.message) || 'Error al crear entrenador');
            });
      },

    },

    // -- Historial completo de equipo ----------------------
    'historial-equipo': {
      render: function() {
        var equipoId = App.state.equipoSesionesId;

        var hoy = _hoy();

        // Agrupar pasadas por mes YYYY-MM, orden descendente
        var meses = {};
        pasadas.forEach(function(s) {
          var mes = s.Fecha.substring(0, 7);
          if (!meses[mes]) meses[mes] = [];
          meses[mes].push(s);
        });
        var mesesOrdenados = Object.keys(meses).sort(function(a, b) { return a < b ? 1 : -1; });

        // Mismo panel y tarjeta de sesión que Registrar asistencia; el recuadro muestra el día.

          var lista = meses[mes];

          return '<section class="calendar-weekly historial-mes" aria-label="' + titulo + '">' +

            '<span class="calendar-weekly-total">' + lista.length + '</span></div>' +
            '<div class="calendar-events">' + lista.slice().reverse().map(function(s) { return App.calendar.tarjetaSesion(s, 'coach', null, hoy, true); }).join('') + '</div>' +
            '</section>';
        }).join('');

        document.getElementById('historial-lista').innerHTML = '<div class="calendar-wrap">' +
          (html || '<p class="calendar-weekly-empty">Sin sesiones registradas</p>') + '</div>';
      },
    },

      guardarFoto: function(foto, textos) {

      subirFoto: function(input) {
        if (App.account.isStaff()) return Promise.resolve();
        var file = input.files && input.files[0];
        if (!file) return Promise.resolve();
        if (!file.type || file.type.indexOf('image/') !== 0) { showToast('Selecciona un archivo de imagen', 'error'); return Promise.resolve(); }
        input.value = '';

          { pending: 'Subiendo foto\u2026', success: 'Foto actualizada' });

      // Recorta al centro, reduce a 128×128 y limita el JPEG a 16 000 caracteres.
      _prepararFoto: function(file) {
        return new Promise(function(resolve, reject) {
          var url = URL.createObjectURL(file), image = new Image();
          image.onload = function() {
            try {
              var canvas = document.createElement('canvas'); canvas.width = canvas.height = 128;
              var context = canvas.getContext('2d'), side = Math.min(image.naturalWidth,image.naturalHeight);
              context.fillStyle = '#fff'; context.fillRect(0,0,128,128);
              context.drawImage(image,(image.naturalWidth-side)/2,(image.naturalHeight-side)/2,side,side,0,0,128,128);
              var quality = .75, foto = canvas.toDataURL('image/jpeg',quality);
              while (foto.length > 16000 && quality > .15) { quality -= .1; foto = canvas.toDataURL('image/jpeg',quality); }
              if (foto.length > 16000) throw new Error('La imagen es demasiado compleja. Prueba con otra foto.');
              resolve(foto);
            } catch (error) { reject(new Error(error && error.message || 'No se pudo preparar la foto')); }
            finally { URL.revokeObjectURL(url); }
          };
          image.onerror = function() { URL.revokeObjectURL(url); reject(new Error('No se pudo abrir la imagen. Prueba con JPG o PNG.')); };
          image.src = url;
        });
      },
