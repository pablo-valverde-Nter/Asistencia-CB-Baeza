<script>
// ================================================================
// CB Baeza -- SPA principal
// ================================================================
const App = {

  state: {
    auth:      null,
    usuario:   null,
    esAdmin:   false,
    equipos:   [],
    currentView: 'equipos',
    viewHistory: [],
    equipoSesionesId: null,
    _equipoNombre:    null,
    _jugadoresOrden:  'dorsal',
    sesionId:         null,
    // Form equipo
    formEquipoId:      null,
    formEntrenadores:  [],
    formJugadores:     [],
    formDias:          {},
    formEntOriginales: [],
    formJugOriginales: [],
    _volverAEquipoFormDespues: false,
    // Cache
    _todosJugadores:    [],
    _todosEntrenadores: [],
    _buscadorItems:     [],
    _buscadorTipo:      null,
    _jugadorPendiente:  null,
    _tipoJugSelec:      'Principal',
    _formIsDirty:            false,
    _pendingDirtyNavigation: null,
    _equipoFormDirty:        false,
    _entrenadorDraftRestore: false,
    _sesionAutoSaveTimer:    null,
    _sesionAutoSaving:       false,
    _sesionManualSaving:     false,
    _sesionAutoSavePromise:  null,
    _sesionEditVersion:      0,
    _sesionDraftRestore:     null,
    _authReqSeq:             0,
    _pendingConfirmSave:     null,
    _credGuardadoConfirmado: false,
    // Vistas detalle
    detalleJugadorId:    null,
    detalleEntrenadorId: null,
    detalleEquipoId:     null,
    // Sistema de 4 roles
    rol:                  null,
    jugador:              null,
    motivosJustificacion: [],
    _loginTipo:           'entrenador',
    sesionJugadorId:      null,
    calendar:             {},
  },

  // ── Cache en memoria: cargado una vez al inicio, actualizado tras cada escritura ──
  cache: {
    jugadores:           [],
    entrenadores:        [],
    equipos:             [],
    jugadoresEquipos:    [],
    entrenadoresEquipos: [],
    horarios:            [],
    sesiones:            [],
    temporadas:          [],
    asistencias:         {},  // sesionId → objeto asistencia (se invalida al guardar)
    asistJugadores:      [],  // todos los registros de Asist_Jugadores
    asistEntrenadores:   [],  // todos los registros de Asist_Entrenadores
    programacionesJustificaciones: [],

    getJugadorById(id)     { return this.jugadores.find(function(j)  { return j.ID === id; }) || null; },
    getEntrenadorById(id)  { return this.entrenadores.find(function(e){ return e.ID === id; }) || null; },
    getEquipoById(id)      { return this.equipos.find(function(e)     { return e.ID === id; }) || null; },
    getEstadoAsistencia(registro) {
      if (!registro) return null;
      if (registro.Excluido === true || registro.Excluido === 'TRUE') return null;
      var estado = String(registro.Estado || '').trim().toUpperCase();
      if (estado === 'P' || estado === 'A' || estado === 'R') return estado;
      if (registro.TieneJustificacion !== true && registro.TieneJustificacion !== 'TRUE') return null;
      var tipo = String(registro.TipoJustificacion || '').trim().toLowerCase();
      if (tipo === 'a' || tipo.indexOf('ausen') === 0) return 'A';
      if (tipo === 'r' || tipo.indexOf('retras') === 0) return 'R';
      return null;
    },
    getEstadoRegistrado(registro) {
      if (!registro || registro.Excluido === true || registro.Excluido === 'TRUE') return null;
      var estado = String(registro.Estado || '').trim().toUpperCase();
      return estado === 'P' || estado === 'A' || estado === 'R' ? estado : null;
    },

    getJugadoresByEquipo(equipoId) {
      var self = this;
      return this.jugadoresEquipos
        .filter(function(r) { return r.ID_Equipo === equipoId && (r.Activo === true || r.Activo === 'TRUE'); })
        .map(function(r) { var j = self.getJugadorById(r.ID_Jugador); return j ? Object.assign({}, j, { Tipo: r.Tipo }) : null; })
        .filter(Boolean);
    },

    getEntrenadoresByEquipo(equipoId) {
      var self = this;
      return this.entrenadoresEquipos
        .filter(function(r) { return r.ID_Equipo === equipoId && (r.Activo === true || r.Activo === 'TRUE'); })
        .map(function(r) { return self.getEntrenadorById(r.ID_Entrenador); })
        .filter(Boolean);
    },

    getHorariosByEquipo(equipoId) {
      return this.horarios.filter(function(h) { return h.ID_Equipo === equipoId; });
    },

    getSesionesByEquipo(equipoId) {
      return this.sesiones
        .filter(function(s) { return s.ID_Equipo === equipoId; })
        .sort(function(a, b) { return a.Fecha < b.Fecha ? -1 : 1; });
    },

    upsert(key, record) {
      if (!Array.isArray(this[key])) return;
      var found = false;
      for (var i = 0; i < this[key].length; i++) {
        if (this[key][i].ID === record.ID) { this[key][i] = Object.assign({}, this[key][i], record); found = true; break; }
      }
      if (!found) this[key].push(record);
    },

    remove(key, id) {
      if (!Array.isArray(this[key])) return;
      this[key] = this[key].filter(function(r) { return r.ID !== id; });
    },

    // Reemplaza las relaciones de un equipo en cache con el estado actual del formulario
    _setRelacionesEquipo(equipoId, jugadores, entrenadores) {
      var relacionesEntrenadores = App.cache.entrenadoresEquipos;
      App.cache.jugadoresEquipos   = App.cache.jugadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
      App.cache.entrenadoresEquipos= App.cache.entrenadoresEquipos.filter(function(r) { return r.ID_Equipo !== equipoId; });
      jugadores.forEach(function(j) {
        App.cache.jugadoresEquipos.push({ ID: 'je_'+j.ID+'_'+equipoId, ID_Equipo: equipoId, ID_Jugador: j.ID, Tipo: j.Tipo, Activo: true });
      });
      entrenadores.forEach(function(e) {
        var relacion = relacionesEntrenadores.find(function(r) { return r.ID_Equipo === equipoId && r.ID_Entrenador === e.ID && r.Activo !== false && r.Activo !== 'FALSE'; });
        App.cache.entrenadoresEquipos.push(Object.assign({},relacion || {},{ ID: relacion ? relacion.ID : 'ee_'+e.ID+'_'+equipoId, ID_Equipo: equipoId, ID_Entrenador: e.ID, TipoRol: 'Entrenador', Activo: true }));
      });
    },
  },

  calendar: {
    render: function(scope, containerId, sesiones, mode, jugadorId) {
      var container = document.getElementById(containerId);
      if (!container) return;
      var hoy = _hoy();
      var hoyDate = new Date(hoy + 'T12:00:00');
      var inicioSemana = new Date(hoyDate);
      inicioSemana.setDate(inicioSemana.getDate() - ((inicioSemana.getDay() + 6) % 7));
      var finSemana = new Date(inicioSemana);
      finSemana.setDate(finSemana.getDate() + 6);
      function claveFecha(fecha) {
        return fecha.getFullYear() + '-' + String(fecha.getMonth() + 1).padStart(2, '0') + '-' + String(fecha.getDate()).padStart(2, '0');
      }
      var desdeSemana = claveFecha(inicioSemana);
      var hastaSemana = claveFecha(finSemana);
      var sesionesSemana = sesiones.filter(function(s) {
        return s.Fecha >= desdeSemana && s.Fecha <= hastaSemana;
      }).sort(function(a, b) {
        return a.Fecha === b.Fecha
          ? String(a.HoraInicio || '').localeCompare(String(b.HoraInicio || ''))
          : a.Fecha.localeCompare(b.Fecha);
      });
      var rangoSemana = inicioSemana.toLocaleDateString(App.preferences.locale(), { day: 'numeric', month: 'short' }) +
        ' - ' + finSemana.toLocaleDateString(App.preferences.locale(), { day: 'numeric', month: 'short' });
      var state = App.state.calendar[scope];
      // Se rehace cada día para no arrancar en una fecha obsoleta; durante el día conserva el día elegido.
      if (!state || state.hoy !== hoy) {
        var inicial = this.fechaInicial(sesiones, hoy, desdeSemana, hastaSemana);
        state = App.state.calendar[scope] = {
          hoy: hoy,
          year: Number(inicial.slice(0, 4)),
          month: Number(inicial.slice(5, 7)) - 1,
          selected: inicial,
        };
      }

      var primero = new Date(state.year, state.month, 1);
      var totalDias = new Date(state.year, state.month + 1, 0).getDate();
      var desplazamiento = (primero.getDay() + 6) % 7;
      var celdas = Math.ceil((desplazamiento + totalDias) / 7) * 7;
      var claveMes = state.year + '-' + String(state.month + 1).padStart(2, '0');
      var totalMes = sesiones.filter(function(s) { return s.Fecha.slice(0, 7) === claveMes; }).length;
      var porFecha = {};
      sesiones.forEach(function(s) {
        if (!porFecha[s.Fecha]) porFecha[s.Fecha] = [];
        porFecha[s.Fecha].push(s);
      });
      Object.keys(porFecha).forEach(function(fecha) {
        porFecha[fecha].sort(function(a, b) {
          return String(a.HoraInicio || '').localeCompare(String(b.HoraInicio || ''));
        });
      });

      var tituloMes = primero.toLocaleDateString(App.preferences.locale(), { month: 'long', year: 'numeric' });
      var diasSemana = App.preferences.idioma === 'en' ? ['M','T','W','T','F','S','S'] : ['L','M','X','J','V','S','D'];
      var sesionesSemanaHtml = sesionesSemana.map(function(s) {
        var fechaSesion = new Date(s.Fecha + 'T12:00:00');
        var diaSesion = fechaSesion.toLocaleDateString(App.preferences.locale(), { weekday: 'short', day: 'numeric' });
        var tituloSesion = 'Entrenamiento';
        var estadoSesion = '';
        var claseEstado = 'scheduled';
        var notificacionSesion = '';
        if (mode === 'player') {
          var registro = App.cache.asistJugadores.find(function(r) {
            return r.ID_Sesion === s.ID && r.ID_Jugador === jugadorId;
          });
          var estadoJugador = App.cache.getEstadoAsistencia(registro) || '';
          var etiquetasJugador = { P: 'Presente', A: 'Ausente', R: 'Retraso' };
          var justificada = registro && (registro.TieneJustificacion === true || registro.TieneJustificacion === 'TRUE');
          var equipoSesion = App.cache.getEquipoById(s.ID_Equipo);
          tituloSesion = equipoSesion ? _esc(equipoSesion.Nombre) : tituloSesion;
          estadoSesion = justificada ? 'Justificada' : (etiquetasJugador[estadoJugador] || (s.Fecha >= hoy ? 'Pr&oacute;ximo' : 'Sin registrar'));
          claseEstado = justificada ? 'justified' : (estadoJugador ? estadoJugador.toLowerCase() : 'unmarked');
        } else {
          var asistenciaGuardada = s.AsistenciaGuardada === true || s.AsistenciaGuardada === 'TRUE' || s._asistRegistrada;
          estadoSesion = s._loading ? 'Creando' : (asistenciaGuardada ? 'Registrada' : (s.Fecha < hoy ? 'Pendiente' : 'Pr&oacute;ximo'));
          claseEstado = s._loading ? 'loading' : (asistenciaGuardada ? 'registered' : (s.Fecha < hoy ? 'pending' : 'scheduled'));
          var justificadasSesion = App.notifications.sessionJustificationCount(s);
          notificacionSesion = justificadasSesion
            ? '<span class="session-justif-badge" aria-label="' + justificadasSesion + ' justificaciones pendientes de guardar"><span aria-hidden="true">&#x26A0;</span>' + justificadasSesion + '</span>'
            : '';
          var sinJustificarSesion = App.notifications.sessionUnjustifiedCount(s);
          notificacionSesion += sinJustificarSesion
            ? '<span class="session-unjustified-badge" aria-label="' + sinJustificarSesion + ' jugadores con faltas o retrasos sin justificar"><span aria-hidden="true">&#x26A0;</span>' + sinJustificarSesion + '</span>'
            : '';
        }
        if (s.Cancelada === true || s.Cancelada === 'TRUE') {
          estadoSesion = 'Cancelada';
          claseEstado = 'cancelled';
          notificacionSesion = '';
        }
        var abrir = mode === 'player'
          ? "App.views['mis-entrenamientos'].abrirDetalle('" + s.ID + "')"
          : "App.views.sesiones.abrirSesion('" + s.ID + "')";
        return '<button class="calendar-weekly-item ' + claseEstado + '" onclick="' + abrir + '"' + (s._loading ? ' disabled' : '') + '>' +
          '<span class="calendar-weekly-date">' + diaSesion + '</span>' +
          '<span class="calendar-weekly-copy"><strong>' + tituloSesion + '</strong><small>' + s.HoraInicio + ' - ' + s.HoraFin + '</small></span>' +
          notificacionSesion + '<span class="calendar-weekly-state">' + estadoSesion + '</span><span class="calendar-event-arrow">&#8250;</span></button>';
      }).join('');
      var html = '<div class="calendar-wrap">' +
        '<section class="calendar-weekly" aria-label="Sesiones de esta semana">' +
        '<div class="calendar-weekly-heading"><div><h2>Sesiones de esta semana</h2><span>' + rangoSemana + '</span></div>' +
        '<span class="calendar-weekly-total">' + sesionesSemana.length + '</span></div>' +
        (mode === 'coach'
          ? '<button class="calendar-generate-week" onclick="App.views.sesiones.generarSemana()"><span aria-hidden="true">+</span> Generar semana</button>'
          : '') +
        (sesionesSemana.length
          ? '<div class="calendar-weekly-list">' + sesionesSemanaHtml + '</div>'
          : '<p class="calendar-weekly-empty">No hay todav&iacute;a entrenamientos para esta semana.</p>') +
        '</section>' +
        '<section class="calendar-month-panel" aria-label="Calendario y entrenamientos del día">' +
        '<div class="calendar-toolbar">' +
        '<button class="calendar-nav" aria-label="Mes anterior" onclick="App.calendar.move(\'' + scope + '\',-1)"><span class="calendar-nav-icon" aria-hidden="true">&#8249;</span></button>' +
        '<div class="calendar-month"><h2>' + tituloMes + '</h2><span>' + totalMes + ' entrenamientos</span></div>' +
        '<button class="calendar-nav" aria-label="Mes siguiente" onclick="App.calendar.move(\'' + scope + '\',1)"><span class="calendar-nav-icon" aria-hidden="true">&#8250;</span></button>' +
        '</div>' +
        '<div class="calendar-weekdays">' + diasSemana.map(function(d) { return '<span>' + d + '</span>'; }).join('') + '</div>' +
        '<div class="calendar-grid">';

      for (var i = 0; i < celdas; i++) {
        var numero = i - desplazamiento + 1;
        if (numero < 1 || numero > totalDias) {
          html += '<div class="calendar-day outside" aria-hidden="true"></div>';
          continue;
        }
        var fecha = state.year + '-' + String(state.month + 1).padStart(2, '0') + '-' + String(numero).padStart(2, '0');
        var eventos = porFecha[fecha] || [];
        var clases = ['calendar-day'];
        if (fecha === hoy) clases.push('today');
        if (fecha === state.selected) clases.push('selected');
        if (eventos.length) clases.push('has-events');
        var marcas = eventos.slice(0, 3).map(function(s) {
          var clase = 'scheduled';
          if (mode === 'player') {
            var reg = App.cache.asistJugadores.find(function(r) {
              return r.ID_Sesion === s.ID && r.ID_Jugador === jugadorId;
            });
            var estadoJugador = App.cache.getEstadoAsistencia(reg);
            clase = estadoJugador ? estadoJugador.toLowerCase() : 'unmarked';
          } else if (s._loading) {
            clase = 'loading';
          } else if (s.AsistenciaGuardada === true || s.AsistenciaGuardada === 'TRUE' || s._asistRegistrada) {
            clase = 'registered';
          } else if (fecha < hoy) {
            clase = 'pending';
          }
          if (s.Cancelada === true || s.Cancelada === 'TRUE') clase = 'cancelled';
          return '<i class="calendar-dot ' + clase + '"></i>';
        }).join('');
        var tieneNoJustificada = mode === 'player' && eventos.some(function(s) {
          if (s.Cancelada === true || s.Cancelada === 'TRUE') return false;
          var registro = App.cache.asistJugadores.find(function(r) {
            return r.ID_Sesion === s.ID && r.ID_Jugador === jugadorId;
          });
          var estadoRegistro = App.cache.getEstadoAsistencia(registro);
          var incidencia = estadoRegistro === 'A' || estadoRegistro === 'R';
          var justificada = registro && (registro.TieneJustificacion === true || registro.TieneJustificacion === 'TRUE');
          return incidencia && !justificada;
        });
        var indicadores = (eventos.length > 1 ? '<span class="calendar-count">' + eventos.length + '</span>' : '') +
          (tieneNoJustificada ? '<span class="calendar-alert" title="Ausencia o retraso sin justificar">!</span>' : '');
        var etiquetaFecha = new Date(state.year, state.month, numero).toLocaleDateString(App.preferences.locale(), {
          weekday: 'long', day: 'numeric', month: 'long'
        });
        html += '<button class="' + clases.join(' ') + '" aria-label="' + etiquetaFecha + (eventos.length ? ', ' + eventos.length + ' entrenamientos' : '') + (tieneNoJustificada ? ', ausencia o retraso sin justificar' : '') + '" aria-pressed="' + (fecha === state.selected) + '" onclick="App.calendar.select(\'' + scope + '\',\'' + fecha + '\')">' +
          '<span class="calendar-day-number">' + numero + '</span>' +
          (indicadores ? '<span class="calendar-indicators" aria-hidden="true">' + indicadores + '</span>' : '') +
          (eventos.length ? '<span class="calendar-dots">' + marcas + '</span>' : '') +
          '</button>';
      }

      var selectedDate = new Date(state.selected + 'T12:00:00');
      var agendaLabel = selectedDate.toLocaleDateString(App.preferences.locale(), {
        weekday: 'long', day: 'numeric', month: 'long'
      });
      var seleccionados = porFecha[state.selected] || [];
      html += '</div><div class="calendar-agenda"><div class="calendar-agenda-reveal"><div class="calendar-agenda-inner">' +
        '<div class="calendar-agenda-heading"><div><span class="calendar-kicker">D&#205;A SELECCIONADO</span><h3>' + agendaLabel + '</h3>' +
        '<span class="calendar-agenda-count">' + seleccionados.length + (seleccionados.length === 1 ? ' entrenamiento' : ' entrenamientos') + '</span></div>' +
        (mode === 'coach'
          ? '<button class="calendar-add-session" onclick="App.views.sesiones.abrirExtra(\'' + state.selected + '\')"><span aria-hidden="true">+</span> Añadir entrenamiento</button>'
          : '') + '</div>';

      if (!seleccionados.length) {
        html += '<div class="calendar-empty">No hay entrenamientos este d&#237;a</div>';
      } else {
        html += '<div class="calendar-events">' + seleccionados.map(function(s) {
          return App.calendar.tarjetaSesion(s, mode, jugadorId, hoy);
        }).join('') + '</div>';
      }
      html += '</div></div></div></div></section></div>';
      container.innerHTML = html;
    },

    // Tarjeta de sesión compartida por Registrar asistencia (agenda del día) y el Historial de sesiones.
    // conFecha muestra el día en el recuadro izquierdo y el horario bajo el título.
    tarjetaSesion: function(s, mode, jugadorId, hoy, conFecha) {
      var label = '';
      var eventClass = 'scheduled';
      var subtitulo = [conFecha ? s.HoraInicio + ' - ' + s.HoraFin : '', s.EsExtra === true || s.EsExtra === 'TRUE' ? 'Extra' : ''].filter(Boolean).join(' · ');
      var tituloEvento = 'Entrenamiento';
      if (mode === 'player') {
        var reg = App.cache.asistJugadores.find(function(r) {
          return r.ID_Sesion === s.ID && r.ID_Jugador === jugadorId;
        });
        var justificada = reg && (reg.TieneJustificacion === true || reg.TieneJustificacion === 'TRUE');
        var estado = App.cache.getEstadoAsistencia(reg) || '';
        var etiquetas = { P: 'Presente', A: 'Ausente', R: 'Retraso' };
        label = justificada ? 'Justificada' : (etiquetas[estado] || (s.Fecha >= hoy ? 'Pr&oacute;ximo' : 'Sin registrar'));
        eventClass = justificada ? 'justified' : (estado ? estado.toLowerCase() : 'unmarked');
        if (estado === 'A' || estado === 'R') {
          label = justificada
            ? '<span class="justif-badge">Justificada</span>'
            : '<span class="calendar-event-unjustified"><span class="calendar-alert" aria-hidden="true">!</span>' + label + '</span>';
        }
        var equipo = App.cache.getEquipoById(s.ID_Equipo);
        if (equipo) tituloEvento = _esc(equipo.Nombre);
      } else {
        var guardada = s.AsistenciaGuardada === true || s.AsistenciaGuardada === 'TRUE' || s._asistRegistrada;
        label = s._loading ? 'Creando' : (guardada ? 'Registrada' : (s.Fecha < hoy ? 'Pendiente' : 'Pr&oacute;ximo'));
        eventClass = s._loading ? 'loading' : (guardada ? 'registered' : (s.Fecha < hoy ? 'pending' : 'scheduled'));
      }
      var cancelada = s.Cancelada === true || s.Cancelada === 'TRUE';
      if (cancelada) { label = 'Cancelada'; eventClass = 'cancelled'; }
      var stats = mode === 'coach' && !cancelada && s._statsJug
        ? '<small class="calendar-event-stats"><span class="p">P ' + s._statsJug.P + '</span><span class="a">A ' + s._statsJug.A + '</span><span class="r">R ' + s._statsJug.R + '</span></small>'
        : '';
      var click = mode === 'player'
        ? "App.views['mis-entrenamientos'].abrirDetalle('" + s.ID + "')"
        : "App.views.sesiones.abrirSesion('" + s.ID + "')";
      var disabled = s._loading ? ' disabled' : '';
      var justifCount = mode === 'coach' ? App.notifications.sessionJustificationCount(s) : 0;
      var justifBadge = justifCount
        ? '<span class="session-justif-badge" aria-label="' + justifCount + ' justificaciones pendientes de guardar"><span aria-hidden="true">&#x26A0;</span>' + justifCount + '</span>'
        : '';
      var unjustifiedCount = mode === 'coach' ? App.notifications.sessionUnjustifiedCount(s) : 0;
      var unjustifiedBadge = unjustifiedCount
        ? '<span class="session-unjustified-badge" aria-label="' + unjustifiedCount + ' jugadores con faltas o retrasos sin justificar"><span aria-hidden="true">&#x26A0;</span>' + unjustifiedCount + '</span>'
        : '';
      var fecha = new Date(s.Fecha + 'T12:00:00');
      var recuadro = conFecha
        ? '<span class="calendar-event-time calendar-event-date"><small>' + fecha.toLocaleDateString(App.preferences.locale(), { weekday: 'short' }) + '</small><strong>' + fecha.getDate() + '</strong></span>'
        : '<span class="calendar-event-time"><strong>' + s.HoraInicio + '</strong><small>' + s.HoraFin + '</small></span>';
      return '<button class="calendar-event ' + eventClass + '" onclick="' + click + '"' + disabled + '>' + recuadro +
        '<span class="calendar-event-copy"><strong>' + tituloEvento + '</strong>' +
        (subtitulo ? '<small class="calendar-event-hours">' + subtitulo + '</small>' : '') + stats + '</span>' +
        justifBadge + unjustifiedBadge + '<span class="calendar-event-status">' + label + '</span><span class="calendar-event-arrow">&#8250;</span></button>';
    },

    // Hoy si tiene entrenamientos; si no, el más cercano de esta semana (a igual distancia, el próximo); si no hay, hoy.
    fechaInicial: function(sesiones, hoy, desdeSemana, hastaSemana) {
      var dia = function(fecha) { return Date.UTC(Number(fecha.slice(0, 4)), Number(fecha.slice(5, 7)) - 1, Number(fecha.slice(8, 10))) / 86400000; };
      var elegida = hoy, distancia = Infinity;
      sesiones.forEach(function(s) {
        if (s.Fecha < desdeSemana || s.Fecha > hastaSemana) return;
        var d = Math.abs(dia(s.Fecha) - dia(hoy));
        if (d < distancia || (d === distancia && s.Fecha > elegida)) { elegida = s.Fecha; distancia = d; }
      });
      return elegida;
    },

    move: function(scope, amount) {
      var state = App.state.calendar[scope];
      if (!state) return;
      var next = new Date(state.year, state.month + amount, 1);
      state.year = next.getFullYear();
      state.month = next.getMonth();
      var day = Number(state.selected.slice(-2));
      var maxDay = new Date(state.year, state.month + 1, 0).getDate();
      state.selected = state.year + '-' + String(state.month + 1).padStart(2, '0') + '-' + String(Math.min(day, maxDay)).padStart(2, '0');
      this.refresh(scope);
    },

    select: function(scope, date) {
      var state = App.state.calendar[scope];
      if (!state) return;
      state.selected = date;
      this.refresh(scope);

    refresh: function(scope) {

  },

  notifications: {
    _identity: function() {

    _storageKey: function() {
      return 'cb-baeza-notifications-v1:' + this._identity();
    },

    _state: function() {
      var key = this._storageKey();
      try {
        var state = JSON.parse(localStorage.getItem(key) || '{}');
        return {
          read: Array.isArray(state.read) ? state.read : [],
          deleted: Array.isArray(state.deleted) ? state.deleted : [],
        };
      } catch (e) {
        return { read: [], deleted: [] };
      }
    },

    _save: function(state) {
      try { localStorage.setItem(this._storageKey(), JSON.stringify(state)); } catch (e) {}
    },

    _key: function(registro) {
      return String(registro.ID || (registro.ID_Sesion + ':' + registro.ID_Jugador));

    items: function(teamId) {
      return App.cache.asistJugadores.filter(function(registro) {

        var sesion = App.cache.sesiones.find(function(s) { return s.ID === registro.ID_Sesion; });
        return sesion && (!teamId || sesion.ID_Equipo === teamId);
      }).map(function(registro) {
        var sesion = App.cache.sesiones.find(function(s) { return s.ID === registro.ID_Sesion; });
        var jugador = App.cache.getJugadorById(registro.ID_Jugador);

        return {

    unreadCount: function(teamId) {

    },

    sessionJustificationCount: function(sesion) {

      return App.cache.asistJugadores.filter(function(r) {

    sessionUnjustifiedCount: function(sesion) {

    _refreshHome: function() {

      justificada: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="m9 14.5 2 2 4-4"/></svg>',

    _find: function(teamId, key) {

    _marcar: function(lista, keys, incluir) {
      var state = this._state();
      keys.forEach(function(key) {
        var i = state[lista].indexOf(key);
        if (incluir && i < 0) state[lista].push(key);
        if (!incluir && i >= 0) state[lista].splice(i, 1);
      });
      this._save(state);
    },

    _refrescar: function(teamId, focusKey) {
      this._refreshHome();
      this.renderInbox(teamId, focusKey);
    },

    toggleRead: function(teamId, key) {
      if (!this._find(teamId, key)) return;
      this._marcar('read', [key], this._state().read.indexOf(key) < 0);
      this._refrescar(teamId);
    },

    markAllRead: function(teamId) {
      this._marcar('read', this.items(teamId).map(function(item) { return item.key; }), true);
      this._refrescar(teamId);
    },

    deleteOne: function(teamId, key) {
      if (!this._find(teamId, key)) return;
      this._marcar('deleted', [key], true);
      if (this._abierta === key) this._abierta = null;
      this._refrescar(teamId);
    },

    deleteAll: function(teamId) {
      this._marcar('deleted', this.items(teamId).map(function(item) { return item.key; }), true);
      this._abierta = null;
      this._refrescar(teamId);
    },

    // Tocar una entrada la despliega con el mensaje de la familia y la marca como leída; la sesión se abre desde «Ver sesión».
    toggle: function(teamId, key) {
      if (!this._find(teamId, key)) return;
      this._abierta = this._abierta === key ? null : key;
      if (this._abierta) this._marcar('read', [key], true);
      this._refrescar(teamId, key);
    },

    verSesion: function(teamId, key) {
      var item = this._find(teamId, key);

      App.state._equipoNombre = item.equipo ? item.equipo.Nombre : 'Equipo';
      App.views.sesiones.abrirSesion(item.sesion.ID);
    },

    openInbox: function(teamId) {
      var equipo = App.cache.getEquipoById(teamId);
      this._abierta = null;
      App.openModal('Notificaciones' + (equipo ? ' · ' + equipo.Nombre : ''), '<div id="notification-inbox"></div>');
      this.renderInbox(teamId);
    },

    renderInbox: function(teamId, focusKey) {
      var container = document.getElementById('notification-inbox');
      if (!container) return;
      var self = this, icons = this._icons, state = this._state();
      var all = this.items(teamId).filter(function(item) { return state.deleted.indexOf(item.key) < 0; });
      var html = '<div class="notification-toolbar">' +
        '<button type="button" onclick="App.notifications.markAllRead(' + _statsArgumento(teamId) + ')">Marcar todas leídas</button>' +
        '<button type="button" onclick="App.notifications.deleteAll(' + _statsArgumento(teamId) + ')">Borrar todas</button></div>';
      if (!all.length) {
        html += '<div class="notification-empty">No hay notificaciones</div>';
      } else {
        html += '<div class="notification-list">' + all.map(function(item, i) {
          var leida = state.read.indexOf(item.key) >= 0, abierta = self._abierta === item.key;
          var justif = abierta ? self.justificacion(item.registro) : null;

          var fecha = _fmtFecha(item.sesion.Fecha), detalleId = 'notification-detail-' + i;
          var tipo = self._tipo(item.registro);
          var lectura = leida ? 'Marcar como no leída' : 'Marcar como leída';
          return '<article class="notification-item ' + (leida ? 'read' : 'unread') + (abierta ? ' is-open' : '') + '" data-notification-key="' + _statsTexto(item.key) + '">' +
            '<div class="notification-row">' +
              '<button type="button" class="notification-open" aria-expanded="' + abierta + '"' + (justif ? ' aria-controls="' + detalleId + '"' : '') + ' onclick="App.notifications.toggle(' + args + ')">' +
                App.avatarHtml(item.jugador.FotoURL, item.jugador.Nombre + ' ' + item.jugador.Apellidos, 40) +
                '<span class="notification-copy"><strong data-no-i18n>' + _statsTexto(item.jugador.Apellidos + ', ' + item.jugador.Nombre) + '</strong>' +
                '<span>' + tipo + ' · ' + _statsTexto(fecha.dn + ' ' + fecha.d + ' ' + fecha.m) + ' · ' + _statsTexto(item.sesion.HoraInicio) + '</span></span>' +
                '<span class="notification-unread-dot" aria-hidden="true"></span>' +
              '</button>' +
              '<button type="button" class="notification-action" aria-label="' + lectura + '" title="' + lectura + '" onclick="App.notifications.toggleRead(' + args + ')">' + (leida ? icons.noLeida : icons.leida) + '</button>' +
              '<button type="button" class="notification-action notification-delete" aria-label="Borrar notificación" title="Borrar" onclick="App.notifications.deleteOne(' + args + ')">' + icons.borrar + '</button>' +
            '</div>' +
            (justif ? '<div class="notification-detail" id="' + detalleId + '">' + self.detalleHtml(justif) +
              '<button type="button" class="btn btn-primary btn-sm notification-session" onclick="App.notifications.verSesion(' + args + ')">Ver sesión</button></div>' : '') +

  },

  // Alertas de ausencias seguidas: el servidor calcula la lista (Estadisticas.alertasAusencias); aquí solo se filtra por equipo y «contactado».
  // «Contactado» es local por entrenador y dispositivo: clave de la racha → nº de faltas al marcar; reaparece si suma otras `umbral` faltas.
  alertas: {
    _icono: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19L12 3.5Z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>',

    _storageKey: function() { return 'cb-baeza-alertas-v1:' + App.notifications._identity(); },

    _state: function() {
      try {
        var state = JSON.parse(localStorage.getItem(this._storageKey()) || '{}');
        return state && typeof state === 'object' && !Array.isArray(state) ? state : {};
      } catch (e) { return {}; }
    },

    _save: function(state) {
      try { localStorage.setItem(this._storageKey(), JSON.stringify(state)); } catch (e) {}
    },

    // Olvida las rachas que ya no están en alerta (vino, causó baja o cambió la temporada).
    recibir: function(datos, error) {
      App.state.alertasAusencias = datos || null;
      App.state.alertasAusenciasError = error || null;
      if (!datos) return;
      var vigentes = {}, state = this._state(), cambiado = false;
      datos.jugadores.forEach(function(j) { vigentes[j.clave] = true; });
      Object.keys(state).forEach(function(clave) { if (!vigentes[clave]) { delete state[clave]; cambiado = true; } });
      if (cambiado) this._save(state);
    },

    // Solo equipos propios (el servidor excluye sustituciones); si el cálculo falló, se ofrece igualmente para explicarlo.
    disponible: function(teamId) {
      var d = App.state.alertasAusencias;
      if (d) return d.equipos.indexOf(teamId) >= 0;
      return !!App.state.alertasAusenciasError && (App.state.esAdmin || (App.state.equipos || []).some(function(e) { return e.ID === teamId; }));
    },

    items: function(teamId) {
      var d = App.state.alertasAusencias;
      if (!d) return [];
      var state = this._state();
      return d.jugadores.filter(function(j) { return j.equipos.indexOf(teamId) >= 0; }).map(function(j) {
        var jugador = App.cache.getJugadorById(j.jugadorId), marcado = state[j.clave];
        return jugador ? Object.assign({}, j, { jugador: jugador, contactado: typeof marcado === 'number' && j.ausencias < marcado + d.umbral }) : null;
      }).filter(Boolean);
    },

    count: function(teamId) {
      return this.items(teamId).filter(function(item) { return !item.contactado; }).length;
    },

    boton: function(teamId, nombreHtml) {
      if (!this.disponible(teamId)) return '';
      var n = this.count(teamId);
      return '<button type="button" class="eq-notifications eq-alerts" aria-label="Alertas de ausencias de ' + nombreHtml + (n ? ': ' + n + (n === 1 ? ' jugador' : ' jugadores') : '') + '" title="Alertas de ausencias" onclick="App.alertas.open(' + _statsArgumento(teamId) + ')">' + this._icono + (n ? '<span class="eq-notifications-count eq-alerts-count">' + n + '</span>' : '') + '</button>';
    },

    _item: function(teamId, jugadorId) {
      return this.items(teamId).find(function(item) { return item.jugadorId === jugadorId; }) || null;
    },

    _refrescar: function(teamId) {
      App.notifications._refreshHome();
      this.render(teamId);
    },

    marcarContactado: function(teamId, jugadorId) {
      var item = this._item(teamId, jugadorId);
      if (!item) return;
      var state = this._state();
      state[item.clave] = item.ausencias;
      this._save(state);
      this._refrescar(teamId);
    },

    deshacer: function(teamId, jugadorId) {
      var item = this._item(teamId, jugadorId);
      if (!item) return;
      var state = this._state();
      delete state[item.clave];
      this._save(state);
      this._refrescar(teamId);
    },

    // Breve y cordial, en nombre del entrenador; no menciona el número de faltas.
    mensaje: function(item, teamId) {
      var equipo = App.cache.getEquipoById(teamId), entrenador = App.state.usuario;
      var origen = (equipo ? equipo.Nombre : 'el equipo') + ' (CB Baeza)';
      return (entrenador && entrenador.Nombre ? 'Hola, soy ' + entrenador.Nombre + ', del equipo técnico de ' + origen + '.' : 'Hola, os escribimos del equipo técnico de ' + origen + '.') +

    },

    contactar: function(teamId, jugadorId) {

    verFicha: function(jugadorId) {

    },

    open: function(teamId) {
      var equipo = App.cache.getEquipoById(teamId);
      App.openModal('Alertas' + (equipo ? ' · ' + equipo.Nombre : ''), '<div id="alertas-ausencias"></div>');
      this.render(teamId);
    },

    _fila: function(teamId, item) {
      var j = item.jugador, args = _statsArgumento(teamId) + ',' + _statsArgumento(item.jugadorId);
      var desde = item.desde.split('-').map(Number);
      var fecha = new Date(desde[0], desde[1] - 1, desde[2]).toLocaleDateString(App.preferences.locale(), { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '');
      return '<article class="alerta-item' + (item.contactado ? ' is-done' : '') + '">' +
        '<button type="button" class="alerta-person" onclick="App.alertas.verFicha(' + _statsArgumento(item.jugadorId) + ')">' + App.avatarHtml(j.FotoURL, j.Nombre + ' ' + j.Apellidos, 40) +
          '<span class="alerta-copy"><strong data-no-i18n>' + _statsTexto(j.Apellidos + ', ' + j.Nombre) + '</strong><span class="alerta-racha">' + item.ausencias + ' entrenos seguidos sin venir</span><span>Desde ' + _statsTexto(fecha) + '</span></span>' +
          '<span class="alerta-arrow" aria-hidden="true">›</span></button>' +
        '<div class="alerta-meta">' + (item.justificadas ? '<span class="alerta-chip">' + item.justificadas + (item.justificadas === 1 ? ' justificada' : ' justificadas') + '</span>' : '') +
          '<span class="alerta-last">' + (item.ultimaAsistencia ? 'Última asistencia: ' + _statsTexto(_statsFechaCorta(item.ultimaAsistencia)) : 'Sin asistencias esta temporada') + '</span></div>' +
        '<div class="alerta-actions"><button type="button" class="btn btn-primary btn-sm" onclick="App.alertas.contactar(' + args + ')">Contactar familia</button>' +
          (item.contactado ? '<button type="button" class="btn btn-secondary btn-sm" onclick="App.alertas.deshacer(' + args + ')">Deshacer</button>'
            : '<button type="button" class="btn btn-secondary btn-sm" onclick="App.alertas.marcarContactado(' + args + ')">✓ Marcar contactado</button>') + '</div>' +
      '</article>';
    },

    render: function(teamId) {
      var host = document.getElementById('alertas-ausencias');
      if (!host) return;
      var d = App.state.alertasAusencias, umbral = _alertasUmbral(), self = this;
      if (!d) { host.innerHTML = '<div class="notification-empty"><p>No se pudieron calcular las alertas.</p><p>Se reintentará en la próxima recarga de datos.</p></div>'; return; }
      if (!d.temporadaId) { host.innerHTML = '<div class="notification-empty">No hay temporada activa.</div>'; return; }
      var items = this.items(teamId);
      var pendientes = items.filter(function(item) { return !item.contactado; }), hechos = items.filter(function(item) { return item.contactado; });
      var html = '<p class="alertas-intro">Jugadores con ' + umbral + ' o más entrenos seguidos sin venir. Las faltas justificadas también cuentan.</p>';
      if (!items.length) html += '<div class="notification-empty">Ningún jugador acumula ' + umbral + ' entrenos seguidos sin venir.</div>';
      else {
        html += pendientes.length ? '<div class="alertas-list">' + pendientes.map(function(item) { return self._fila(teamId, item); }).join('') + '</div>'
          : '<div class="notification-empty">Ya has contactado con todas las familias en alerta.</div>';
        if (hechos.length) html += '<h3 class="alertas-subtitle">Contactados (' + hechos.length + ')</h3><div class="alertas-list">' + hechos.map(function(item) { return self._fila(teamId, item); }).join('') + '</div>';
      }
      host.innerHTML = html;
    },
  },

  init() {
    var reqSeq = ++App.state._authReqSeq;
    _clientLog('init_start', { hasAuthMem: !!App.state.auth });
    if (!App.state.auth) {
      var stored = _getStoredAuth();
      _clientLog('init_read_storage', { hasStored: !!stored });
      if (stored) {
        try {
          App.state.auth = JSON.parse(stored);
          // Compatibilidad hacia atrás: sesiones antiguas sin campo 'tipo'
          if (App.state.auth && App.state.auth.email && !App.state.auth.tipo) {
            App.state.auth.tipo = 'entrenador';
            _setStoredAuth(JSON.stringify(App.state.auth));
          }
          _clientLog('init_storage_parse_ok', { tipo: App.state.auth && App.state.auth.tipo ? App.state.auth.tipo : null });
        } catch (e) {
          App.state.auth = null;
          _clearStoredAuth();
          _clientLog('init_storage_parse_error', { error: e.message });
        }
      }
    }

    if (!App.state.auth) {
      _clientLog('init_no_auth_navigate_login', {});
      hideLoading();
      App.navigate('login');
      return;
    }

    showLoading('Cargando...');
    server('cargarDatos')
      .then(function(res) {
        if (reqSeq !== App.state._authReqSeq) {
          _clientLog('init_cargarDatos_stale_ignored', { reqSeq: reqSeq, currentReqSeq: App.state._authReqSeq });
          return;
        }
        hideLoading();
        if (!res.success) { 
          _clientLog('init_cargarDatos_fail', { stage: res.stage || null, traceId: res.traceId || null, error: res.error || null });
          showToast(_formatDiagError(res.error || 'Sesión no válida', res, 'init_cargarDatos'), 'error'); 
          // Solo cerrar sesión si el backend indica fallo de autenticación.
          // Para errores de datos/hojas, mantener auth y permitir reintento.
          if ((res.stage || '') === 'auth_context') {
            App.cerrarSesion('init_cargarDatos_fail_auth');
          }
          return; 
        }
        App._applyBootstrapData(res);
        App.realtime.start();
        _clientLog('init_cargarDatos_ok', { traceId: res.traceId || null, currentView: App.state.currentView });
        
        if (App.state.currentView === 'login') {
          var homeView = App.state.rol === 'jugador' ? 'perfil-jugador' : 'equipos';
          _clientLog('init_navigate_home_from_login', { homeView: homeView });
          App.navigate(homeView);
        } else {
          _clientLog('init_navigate_current', { view: App.state.currentView });
          App.navigate(App.state.currentView);
        }
        App.views.bienvenida.comprobar();
      })
      .catch(function(err) { 
        if (reqSeq !== App.state._authReqSeq) {
          _clientLog('init_cargarDatos_network_stale_ignored', { reqSeq: reqSeq, currentReqSeq: App.state._authReqSeq });
          return;
        }
        hideLoading(); 
        _clientLog('init_cargarDatos_network_error', { error: (err && err.message) || null });
        showToast(_formatDiagError((err && err.message) || 'Error de conexión', null, 'init_network'), 'error'); 
        // No cerrar sesión por un fallo de red transitorio.
      });
  },

  setLoginTipo(tipo) {
    App.state._loginTipo = tipo;
    document.getElementById('login-tabs').dataset.tipo = tipo;
    ['entrenador', 'jugador'].forEach(function(t) {
      var tab = document.getElementById('tab-' + t);
      tab.classList.toggle('active', t === tipo);
      tab.setAttribute('aria-pressed', String(t === tipo));
    });
    document.getElementById('login-field-email').classList.toggle('hidden', tipo === 'jugador');
    document.getElementById('login-field-usuario').classList.toggle('hidden', tipo === 'entrenador');
    App.limpiarErrorLogin();
  },

  // Muestra u oculta el PIN sin mover el foco (el botón evita el foco en mousedown) ni el cursor.
  alternarPinLogin() {
    var pin = document.getElementById('login-pin');
    var boton = document.getElementById('login-pin-toggle');
    var visible = pin.type === 'password';
    var inicio = pin.selectionStart, fin = pin.selectionEnd;
    pin.type = visible ? 'text' : 'password';
    if (document.activeElement === pin && inicio !== null) pin.setSelectionRange(inicio, fin);
    boton.setAttribute('aria-pressed', String(visible));
    boton.setAttribute('aria-label', visible ? 'Ocultar PIN' : 'Mostrar PIN');
  },

  limpiarErrorLogin() {
    var caja = document.getElementById('login-error');
    if (!caja || caja.hidden) return;
    caja.hidden = true;
    ['login-email', 'login-usuario', 'login-pin'].forEach(function(id) { document.getElementById(id).removeAttribute('aria-invalid'); });
  },

  // Error junto al formulario (no un toast que desaparece): queda a la vista con el teclado abierto.
  _mostrarErrorLogin(mensaje, detalle, campos) {
    document.getElementById('login-error-msg').textContent = mensaje;
    document.getElementById('login-error-detail').textContent = detalle || '';
    document.getElementById('login-error').hidden = false;
    (campos || []).forEach(function(el) { el.setAttribute('aria-invalid', 'true'); });
  },

  _loginCargando(activo) {
    var boton = document.getElementById('login-submit');
    var logo = boton.querySelector('.login-submit-logo');
    var fuente = document.querySelector('.login-logo-img');
    if (activo && !logo.getAttribute('src') && fuente) logo.src = fuente.src;
    boton.classList.toggle('is-loading', activo);
    boton.disabled = activo;
    boton.setAttribute('aria-busy', String(activo));
    document.getElementById('login-submit-text').textContent = activo ? 'Entrando\u2026' : 'Entrar';
    // readOnly en lugar de disabled: el campo enfocado no pierde el foco ni cierra el teclado.
    ['login-email', 'login-usuario', 'login-pin'].forEach(function(id) { document.getElementById(id).readOnly = activo; });
  },

  iniciarSesion() {
    if (document.getElementById('login-submit').disabled) return;
    var reqSeq = ++App.state._authReqSeq;
    var tipo = App.state._loginTipo || 'entrenador';
    var campoCredencial = document.getElementById(tipo === 'jugador' ? 'login-usuario' : 'login-email');
    var campoPin = document.getElementById('login-pin');
    var credencial = campoCredencial.value.trim();
    var pin = campoPin.value.trim();
    _clientLog('login_submit', { tipo: tipo, credencialLen: credencial ? credencial.length : 0, pinLen: pin ? String(pin).length : 0 });

    App.limpiarErrorLogin();
    if (!credencial || !pin) {
      var vacios = [!credencial && campoCredencial, !pin && campoPin].filter(Boolean);
      App._mostrarErrorLogin('Introduce ' + (tipo === 'jugador' ? 'tu usuario' : 'tu email') + ' y el PIN', '', vacios);
      vacios[0].focus();
      return;
    }

    App._loginCargando(true);
    server('iniciarSesion', tipo, credencial, pin)
      .then(function(res) {
        if (reqSeq !== App.state._authReqSeq) {
          _clientLog('login_response_stale_ignored', { reqSeq: reqSeq, currentReqSeq: App.state._authReqSeq });
          App._loginCargando(false);
          return;
        }
        App._loginCargando(false);
        if (res && res.success) {
          _clientLog('login_success', { traceId: res.traceId || null });
          var auth = tipo === 'jugador'
            ? { tipo: 'jugador', usuario: credencial, pin: pin }
            : { tipo: 'entrenador', email: credencial, pin: pin };
          App.state.auth = auth;
          _setStoredAuth(JSON.stringify(auth));
          App._applyBootstrapData(res);
          App.realtime.start();
          showToast('Sesión iniciada', 'success');
          campoCredencial.value = '';
          campoPin.value = '';
          if (campoPin.type !== 'password') App.alternarPinLogin();
          _clientLog('login_navigate_home', { rol: App.state.rol });
          App.navigate(App.state.rol === 'jugador' ? 'perfil-jugador' : 'equipos');
          App.views.bienvenida.comprobar();
        } else {
          _clientLog('login_fail', { stage: res && res.stage ? res.stage : null, traceId: res && res.traceId ? res.traceId : null, error: res && res.error ? res.error : null });
          // Credenciales rechazadas: mensaje limpio. Fallo técnico: se añade el diagnóstico para soporte.
          var credenciales = res && res.stage === 'auth_context';
          App._mostrarErrorLogin((res && res.error) || 'Credenciales incorrectas',
            credenciales ? '' : _detalleDiag(res, 'login_auth'),
            credenciales ? [campoCredencial, campoPin] : []);
          if (credenciales) { campoPin.focus(); campoPin.select(); }
        }
      })
      .catch(function(err) {
        if (reqSeq !== App.state._authReqSeq) {
          _clientLog('login_network_stale_ignored', { reqSeq: reqSeq, currentReqSeq: App.state._authReqSeq });
          App._loginCargando(false);
          return;
        }
        App._loginCargando(false);
        _clientLog('login_network_error', { error: (err && err.message) || null });
        App._mostrarErrorLogin((err && err.message) || 'Error al conectar', _detalleDiag(null, 'login_network'), []);
      });
  },

  confirmarCerrarSesion() {
    App.closeUserMenu();
    App.openModal('Cerrar Sesión',
      '<div class="modal-confirm-warning" style="padding:20px 16px 16px;text-align:center">' +
      '<div class="modal-confirm-icon">&#x26A0;</div>' +
      '<div class="modal-confirm-msg">¿Seguro que quieres cerrar sesión?<br><br>Tendrás que introducir tu PIN de nuevo para acceder.</div>' +
      '<div style="display:flex;gap:8px;margin-top:20px">' +

      '</div></div>'
    );

  toggleUserMenu(event) {
    if (event) event.stopPropagation();
    var wrap = document.getElementById('user-menu-wrap');
    var menu = document.getElementById('user-menu');
    var button = document.getElementById('user-badge');
    if (!wrap || !menu || !button) return;
    var abrir = !wrap.classList.contains('open');
    wrap.classList.toggle('open', abrir);
    menu.classList.toggle('hidden', !abrir);
    button.setAttribute('aria-expanded', String(abrir));
    if (abrir) menu.querySelector('[role="menuitem"]').focus();
    if (!App._userMenuListenersInstalled) {
      document.addEventListener('click', function(e) {
        if (!e.target.closest || !e.target.closest('#user-menu-wrap')) App.closeUserMenu();
      });
      document.addEventListener('keydown', function(e) {
        var m = document.getElementById('user-menu');
        if (!m || m.classList.contains('hidden')) return;
        if (e.key === 'Escape') { e.preventDefault(); App.closeUserMenu(true); }
        if (e.key === 'Tab') App.closeUserMenu();
        if (['ArrowDown','ArrowUp','Home','End'].includes(e.key)) {
          e.preventDefault();
          var items = Array.from(m.querySelectorAll('[role="menuitem"]'));
          var index = items.indexOf(document.activeElement);
          index = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (index + (e.key === 'ArrowUp' ? -1 : 1) + items.length) % items.length;
          items[index].focus();
        }
      });
      App._userMenuListenersInstalled = true;
    }
  },

  closeUserMenu(restoreFocus) {
    var wrap = document.getElementById('user-menu-wrap');
    var menu = document.getElementById('user-menu');
    var button = document.getElementById('user-badge');
    restoreFocus = restoreFocus || (menu && menu.contains(document.activeElement));
    if (wrap) wrap.classList.remove('open');
    if (menu) menu.classList.add('hidden');
    if (button) button.setAttribute('aria-expanded', 'false');
    if (restoreFocus && button) button.focus();
  },


  cerrarSesion(reason) {
    _clientLog('cerrarSesion', { reason: reason || 'manual_or_unknown', view: App.state.currentView || null });
    App.realtime.stop();
    App.stats.reset();
    _statsFuegoEggApagar();
    hideLoading(); // Garantiza que el overlay no quede visible si se llama durante la carga inicial
    App.state._authReqSeq++;
    App.state.auth = null;
    _clearStoredAuth();
    App.state.usuario = null;
    App.state.esAdmin = false;
    App.state.equipos = [];
    App.state.rol = null;
    App.state.jugador = null;
    App.state.motivosJustificacion = [];
    document.getElementById('user-badge-avatar').textContent = '?';
    document.getElementById('user-badge-name').textContent = '...';
    document.getElementById('user-badge-role').textContent = '';
    
    // Limpiar caché
    App.cache.jugadores           = [];
    App.cache.entrenadores        = [];
    App.cache.equipos             = [];
    App.cache.jugadoresEquipos    = [];
    App.cache.entrenadoresEquipos = [];
    App.cache.horarios            = [];
    App.cache.sesiones            = [];
    App.cache.temporadas          = [];
    App.cache.asistJugadores      = [];
    App.cache.asistEntrenadores   = [];
    App.cache.programacionesJustificaciones = [];
    App.cache.asistencias         = {};

    App.navigate('login');
  },

  _applyBootstrapData(res) {
    App.realtime.config = res.supabaseRealtime || null;
    App.cache.jugadores           = res.jugadores           || [];
    App.cache.entrenadores        = res.entrenadores        || [];
    App.cache.equipos             = res.equipos             || [];
    App.cache.jugadoresEquipos    = res.jugadoresEquipos    || [];
    App.cache.entrenadoresEquipos = res.entrenadoresEquipos || [];
    App.cache.horarios            = res.horarios            || [];
    App.cache.sesiones            = res.sesiones            || [];
    App.cache.temporadas          = res.temporadas          || [];
    App.cache.asistJugadores      = res.asistJugadores      || [];
    App.cache.asistEntrenadores   = res.asistEntrenadores   || [];
    App.cache.programacionesJustificaciones = res.programacionesJustificaciones || [];
    App.state._todosEntrenadores = App.cache.entrenadores;

    var ctx = res.contexto || {};
    App.state.rol          = ctx.rol || 'entrenador';
    App.state.esAdmin      = !!ctx.esAdmin;
    App.state.equipos      = ctx.equipos      || [];
    App.state.motivosJustificacion = res.motivosJustificacion || [];

    if (ctx.rol === 'jugador') {
      App.state.jugador  = ctx.jugador || null;
      App.state.usuario  = null;
      var jCtx = ctx.jugador;
      _updateUserBadge(jCtx ? (jCtx.Nombre + ' ' + jCtx.Apellidos) : 'Jugador', 'Jugador');
    } else {
      App.state.usuario = ctx.entrenador || null;
      App.state.jugador = null;
      var nombre = ctx.entrenador
        ? (ctx.entrenador.Nombre + ' ' + ctx.entrenador.Apellidos)
        : (ctx.esAdmin ? 'Admin' : '-');
      _updateUserBadge(nombre, ctx.esAdmin ? 'Administrador' : 'Entrenador');
    }
    App.alertas.recibir(res.alertasAusencias, res.alertasAusenciasError);
    App.stats.recibirBootstrap(res);
  },

  navigate(view, params, push) {
    App.closeUserMenu();
    var currentView = App.state.currentView;
    var nestedTeamForm = currentView === 'equipo-form' && view === 'entrenador-form';
    if (currentView !== view && App.state._formIsDirty && push !== false && !nestedTeamForm) {
      App.state._pendingDirtyNavigation = { view: view, params: params, push: push };
      App.openModal('Cambios sin guardar',
        '<div class="modal-confirm-warning" style="padding:20px 16px 16px;text-align:center">' +
        '<div class="modal-confirm-icon">&#x26A0;</div>' +
        '<div class="modal-confirm-msg">¿Salir sin guardar?<br><br>Los cambios realizados se perderán.</div>' +
        '<div style="display:flex;gap:8px;margin-top:20px">' +
        '<button class="btn btn-secondary" style="flex:1" onclick="App._cancelDirtyNavigation()">Seguir editando</button>' +
        '<button class="btn btn-destructive" style="flex:1" onclick="App._confirmDirtyNavigation()">Salir sin guardar</button>' +
        '</div></div>');
      return;
    }
    if (nestedTeamForm) App.state._equipoFormDirty = App.state._formIsDirty;
    if (App.state.currentView === 'sesion' && view !== 'sesion') App.views.sesion._stopAutoSave();
    if (App.state.currentView === 'recuperar-acceso' && view !== 'recuperar-acceso') App.views['recuperar-acceso'].limpiar();
    if (App.account && ['login','equipos','gestion','perfil-jugador','mis-entrenamientos'].includes(view)) App.account.target = null;
    if (push === undefined) push = true;
    if (view === 'login') {
      App.state.viewHistory = [];
    }
    if (push && App.state.currentView !== view && view !== 'login') {
      App.state.viewHistory.push(App.state.currentView);
    }
    App.state.currentView = view;

    document.querySelectorAll('.view').forEach(function(el) { el.classList.remove('active'); });
    var el = document.getElementById('view-' + view);
    if (el) el.classList.add('active');

    // Ocultar header y nav inferior si es la pantalla de Login; sin sesión (políticas abiertas desde el login) solo queda volver.
    var isLogin = (view === 'login'), sinSesion = !App.state.rol;
    document.getElementById('app-header').classList.toggle('hidden', isLogin);
    document.getElementById('bottom-nav').classList.toggle('hidden', isLogin || sinSesion);
    document.getElementById('user-menu-wrap').classList.toggle('hidden', sinSesion);

    document.querySelectorAll('.nav-tab').forEach(function(tab) {
      var navView = (view === 'mis-stats' || view === 'mi-equipo') ? 'perfil-jugador' : view === 'informes' ? 'gestion' : view;
      tab.classList.toggle('active', tab.dataset.view === navView);
    });

    // Mostrar/ocultar pestañas según rol del usuario
    var esJugador = App.state.rol === 'jugador';
    document.querySelectorAll('.nav-tab-ent').forEach(function(t) { t.classList.toggle('hidden', esJugador); });
    document.querySelectorAll('.nav-tab-jug').forEach(function(t) { t.classList.toggle('hidden', !esJugador); });

    var mainViews = ['equipos', 'gestion', 'perfil-jugador', 'mis-entrenamientos'];
    var showBack = !mainViews.includes(view) && App.state.viewHistory.length > 0;
    document.getElementById('btn-back').classList.toggle('visible', showBack);

    var titulos = {
      'equipos':           'CB Baeza',
      'gestion':           'Gestion',
      'sesiones':          App.state._equipoNombre || 'Equipo',
      'sesion':            'Asistencia',
      'sesion-guardada':   'Sesi\u00f3n',
      'equipos-admin':     'Equipos',
      'equipo-form':       App.state.formEquipoId ? 'Editar equipo' : 'Nuevo equipo',
      'jugadores-admin':   'Jugadores',
      'entrenadores-admin':'Entrenadores',
      'entrenador-form':   'Nuevo entrenador',
      'historial-equipo':  'Historial',
      'jugador-detalle':   'Perfil',
      'entrenador-detalle':'Perfil',
      'equipo-detalle':    'Equipo',
      'perfil-jugador':          'CB Baeza',
      'mis-entrenamientos':      'Mis Entrenamientos',
      'detalle-sesion-jugador':  'Sesión',
      'mis-stats':               'Mis Estadísticas',
      'mi-equipo':               'Mi Equipo',
      'informes':               'Informes',
      'perfil-usuario':          'Perfil',
      'ajustes':                 'Ajustes',
      'ajustes-idioma':          'Idioma',
      'ajustes-apariencia':      'Apariencia',
      'seguridad':               'Seguridad',
      'perfil-editar':           'Editar perfil',
      'seguridad-opcion':        'Seguridad',
      'recuperar-acceso':        'Recuperar acceso',
      'politica-privacidad':     'Política de privacidad',
      'politica-cookies':        'Política de cookies',
    };
    document.getElementById('header-title').textContent = titulos[view] || 'CB Baeza';

    var fabViews = {'equipos-admin':true,'jugadores-admin':true,'entrenadores-admin':true};
    var fab = document.getElementById('fab-btn');
    if (fabViews[view]) {
      if ((view === 'entrenadores-admin' || view === 'equipos-admin') && !App.state.esAdmin) fab.classList.add('hidden');
      else fab.classList.remove('hidden');
    } else {
      fab.classList.add('hidden');
    }

    var _userBadge = document.getElementById('user-badge');

    }

  _cancelDirtyNavigation() {
    App.state._pendingDirtyNavigation = null;
    App.closeModal();
  },

  _confirmDirtyNavigation() {
    var pending = App.state._pendingDirtyNavigation;
    App.state._pendingDirtyNavigation = null;
    App.state._formIsDirty = false;
    App.closeModal();
    if (pending) App.navigate(pending.view, pending.params, pending.push);

        '<div class="modal-confirm-icon">&#x26A0;</div>' +
        '<div class="modal-confirm-msg">¿Salir sin guardar?<br><br>Los cambios realizados se perderán.</div>' +
        '<div style="display:flex;gap:8px;margin-top:20px">' +
        '<button class="btn btn-secondary" style="flex:1" onclick="App.closeModal()">Seguir editando</button>' +
        '<button class="btn btn-destructive" style="flex:1" onclick="App.state._formIsDirty=false;App.closeModal();App._goBackReal()">Salir sin guardar</button>' +
        '</div></div>'
      );
      return;
    }
    App._goBackReal();
  },

  _goBackReal() {
    var prev = App.state.viewHistory.pop();
    if (prev) App.navigate(prev, {}, false);
  },

  puedeEditarDetalle(view) {
    if (App.state.rol === 'jugador') return false;
    if (view === 'jugador-detalle') return true;
    if (view === 'entrenador-detalle') {
      return App.state.esAdmin || (App.state.usuario && App.state.usuario.ID === App.state.detalleEntrenadorId);
    }
    if (view === 'equipo-detalle') {
      return App.state.esAdmin || App.state.equipos.some(function(e) { return e.ID === App.state.detalleEquipoId; });
    }
    return false;
  },

    var v = App.state.currentView;
    if      (v === 'jugador-detalle')    App.account.open('jugador', App.state.detalleJugadorId, 'perfil-usuario');
    else if (v === 'entrenador-detalle') App.account.open('entrenador', App.state.detalleEntrenadorId, 'perfil-usuario');
    else if (v === 'equipo-detalle')     App.views['equipo-form'].cargar(App.state.detalleEquipoId);
  },

  fabAction() {
    var acciones = {
      // Para equipo nuevo: resetear estado ANTES de navegar para que render()

      // Recuentos P/A/R de las sesiones guardadas, leídos de la caché; los usa la tarjeta de sesión.
      _precalcularStats: function(sesiones) {
        sesiones.forEach(function(s) {
          var guardada = s.AsistenciaGuardada === true || s.AsistenciaGuardada === 'TRUE';
          if (guardada && !s._statsJug) {
            var rs = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion === s.ID; });
            if (rs.length) {
              s._statsJug = {
                P: rs.filter(function(r) { return App.cache.getEstadoRegistrado(r) === 'P'; }).length,
                A: rs.filter(function(r) { return App.cache.getEstadoRegistrado(r) === 'A'; }).length,

        });

        }).catch(function() {});

      generarSemana: function() {
        var id = App.state.equipoSesionesId;
        var horarios = App.cache.getHorariosByEquipo(id);
        if (!horarios.length) { showToast('El equipo no tiene horario configurado', 'error'); return; }
        var operationToken = App.operation.begin('generate-week:' + id);
        if (!operationToken) return;

        // Calcular lunes de la semana actual (local, mismo criterio que _hoy())
        var hoyDate = new Date();
        var dow = hoyDate.getDay(); // 0=Dom, 1=Lun … 6=Sab
        var diffToLunes = (dow === 0) ? -6 : 1 - dow;
        var lunesDate = new Date(hoyDate.getFullYear(), hoyDate.getMonth(), hoyDate.getDate() + diffToLunes);

        // Añadir placeholders para cada entrada del horario
        var tempIds = [];
        horarios.forEach(function(h) {
          var sesDate = new Date(lunesDate.getFullYear(), lunesDate.getMonth(), lunesDate.getDate() + Number(h.DiaSemana) - 1);
          var fechaStr = sesDate.getFullYear() + '-' + String(sesDate.getMonth()+1).padStart(2,'0') + '-' + String(sesDate.getDate()).padStart(2,'0');
          var yaExiste = App.cache.sesiones.some(function(s) { return s.ID_Equipo === id && s.Fecha === fechaStr && s.HoraInicio === h.HoraInicio; });
          if (!yaExiste) {
            var tempId = '__tmp_sem_' + h.DiaSemana;
            tempIds.push(tempId);
            App.cache.sesiones.push({ ID: tempId, ID_Equipo: id, Fecha: fechaStr, HoraInicio: h.HoraInicio, HoraFin: h.HoraFin, EsExtra: false, _loading: true });
          }
        });
        App.views.sesiones.render();

        server('generarSesionesSemana', id)
          .then(function(res) {
            App.cache.sesiones = App.cache.sesiones.filter(function(s) { return tempIds.indexOf(s.ID) < 0; });
            if (!res || res.success === false) throw new Error(res && res.error || 'No se pudieron generar las sesiones');
            var creadas = res.sesiones && res.sesiones.creadas ? res.sesiones.creadas : [];
            creadas.forEach(function(s) { App.cache.upsert('sesiones', s); });
            App.views.sesiones.render();
            App.operation.succeed(operationToken);
          })
          .catch(function(error) {
            App.cache.sesiones = App.cache.sesiones.filter(function(s) { return tempIds.indexOf(s.ID) < 0; });
            App.views.sesiones.render();
            App.operation.fail(operationToken, (error && error.message) || 'Error al generar sesiones');
          });
      },

      abrirExtra: function(fecha) {
        App.openModal('Nueva sesion extra',
          '<div style="padding:16px">' +
          '<div class="form-group"><label>Fecha</label><input type="date" id="ext-fecha" value="' + (fecha || _hoy()) + '"></div>' +
          '<div class="form-row">' +
          '<div class="form-group"><label>Inicio</label><input type="time" id="ext-inicio" value="18:00"></div>' +
          '<div class="form-group"><label>Fin</label><input type="time" id="ext-fin" value="19:30"></div>' +
          '</div>' +
          '<div class="form-group"><label>Notas</label><input type="text" id="ext-notas" placeholder="Opcional..."></div>' +
          '<div style="display:flex;gap:8px;margin-top:8px">' +
          '<button class="btn btn-secondary" style="flex:1" onclick="App.closeModal()">Cancelar</button>' +
          '<button class="btn btn-primary" style="flex:1" onclick="App.views.sesiones._guardarExtra()">Crear</button>' +
          '</div></div>');
      },

      _guardarExtra: function() {
        var datos = {
          Fecha:      document.getElementById('ext-fecha').value,
          HoraInicio: document.getElementById('ext-inicio').value,
          HoraFin:    document.getElementById('ext-fin').value,
          Notas:      document.getElementById('ext-notas').value,
        };
        if (!datos.Fecha || !datos.HoraInicio || !datos.HoraFin) {
          showToast('Fecha y horas son obligatorias', 'error'); return;
        }
        var operationToken = App.operation.begin('session-create:' + App.state.equipoSesionesId);
        if (!operationToken) return;
        App.closeModal();

        // Añadir tarjeta placeholder al listado inmediatamente
        var tempId = '__tmp_' + Date.now();
        App.cache.sesiones.push({
          ID: tempId,
          ID_Equipo: App.state.equipoSesionesId,
          Fecha: datos.Fecha,
          HoraInicio: datos.HoraInicio,
          HoraFin: datos.HoraFin,
          Notas: datos.Notas || '',
          EsExtra: true,
          _loading: true,
        });
        App.views.sesiones.render();

        App.sync.start();
        server('crearSesionExtra', App.state.equipoSesionesId, datos).then(function(res) {
          if (!res || res.success === false || !res.sesion) throw new Error(res && res.error || 'No se pudo crear la sesión');
          App.cache.sesiones = App.cache.sesiones.filter(function(s) { return s.ID !== tempId; });
          App.cache.upsert('sesiones', res.sesion);
          App.sync.done();
          App.views.sesiones.render();
          App.operation.succeed(operationToken);
        }).catch(function(error) {
          App.sync.done();
          App.cache.sesiones = App.cache.sesiones.filter(function(s) { return s.ID !== tempId; });
          App.views.sesiones.render();
          App.views.sesiones.abrirExtra(datos.Fecha);
          document.getElementById('ext-fecha').value = datos.Fecha;
          document.getElementById('ext-inicio').value = datos.HoraInicio;
          document.getElementById('ext-fin').value = datos.HoraFin;
          document.getElementById('ext-notas').value = datos.Notas;
          App.operation.fail(operationToken, (error && error.message) || 'Error al crear la sesión');
        });
      },
    },

    // -- Asistencia de sesion -------------------------------
    sesion: {
      render: function() {
        var id = App.state.sesionId;
        if (!id) return;
        // Construir 100% desde cache — sin llamada al servidor
        var sesion = App.cache.sesiones.find(function(s) { return s.ID === id; });
        if (!sesion) { showToast('Sesión no encontrada', 'error'); return; }
        App.views.sesion._render(App.views.sesion._buildFromCache(sesion));
      },

      _estadoJustificacion: function(tipo) {
        var valor = String(tipo || '').trim().toLowerCase();
        if (valor === 'a' || valor.indexOf('ausen') === 0) return 'A';
        if (valor === 'r' || valor.indexOf('retras') === 0) return 'R';
        return null;
      },

      _estadoAsistencia: function(registro) {
        return App.cache.getEstadoAsistencia(registro);
      },

      _estadoTarjeta: function(card) {
        var estado = String(card.dataset.estado || '').trim().toUpperCase();
        return estado === 'P' || estado === 'A' || estado === 'R' ? estado : null;
      },

      // Construye el objeto asistencia completo desde App.cache sin tocar el servidor.
      _buildFromCache: function(sesion) {
        var sesionId = sesion.ID;

        // ── Jugadores ────────────────────────────────────────────────────────
        var jugEquipo    = App.cache.getJugadoresByEquipo(sesion.ID_Equipo);
        var registrosJug = App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion === sesionId; });
        var mapaJug = {};
        registrosJug.forEach(function(r) { mapaJug[r.ID_Jugador] = r; });
        var idsEquipo = new Set(jugEquipo.map(function(j) { return j.ID; }));
        var invitadosJug = registrosJug
          .filter(function(r) { return (r.EsInvitado === true || r.EsInvitado === 'TRUE') && r.Excluido !== true && r.Excluido !== 'TRUE' && !idsEquipo.has(r.ID_Jugador); })
          .map(function(r) { return App.cache.jugadores.find(function(j) { return j.ID === r.ID_Jugador; }) || null; })
          .filter(Boolean);
        var jugConEstado = jugEquipo.concat(invitadosJug).filter(function(j) {
          var reg = mapaJug[j.ID];
          return !reg || (reg.Excluido !== true && reg.Excluido !== 'TRUE');
        }).map(function(j) {
          var reg = mapaJug[j.ID];
          var tieneJustif = !!(reg && (reg.TieneJustificacion === true || reg.TieneJustificacion === 'TRUE'));
          var estado = App.cache.getEstadoRegistrado(reg);
          return {
            jugador: j,
            estado: App.views.sesion._estadoAsistencia(reg),
            preaviso: tieneJustif && !estado ? App.views.sesion._estadoJustificacion(reg.TipoJustificacion) : null,
            minutosRetraso: reg ? reg.MinutosRetraso : null,
            esInvitado: !!reg && (reg.EsInvitado === true || reg.EsInvitado === 'TRUE'),
            tieneJustif: tieneJustif,
            tipoJustif: reg ? (reg.TipoJustificacion || '') : '',
            // Tipo legible (Ausencia/Retraso): los registros heredados guardan 'pre'/'post' en TipoJustificacion.
            tipoAviso: tieneJustif ? App.notifications._tipo(reg) : '',
            motivoJustif: reg ? (_motivoJustificacion(reg.MotivoCategoria) || '') : '',
          };
        });

        // ── Entrenadores ─────────────────────────────────────────────────────
        var entEquipo    = App.cache.getEntrenadoresByEquipo(sesion.ID_Equipo);
        var registrosEnt = App.cache.asistEntrenadores.filter(function(r) { return r.ID_Sesion === sesionId; });
        var mapaEnt = {};
        registrosEnt.forEach(function(r) { mapaEnt[r.ID_Entrenador] = r; });
        var idsEntEquipo = new Set(entEquipo.map(function(e) { return e.ID; }));
        var invitadosEnt = registrosEnt
          .filter(function(r) { return (r.EsInvitado === true || r.EsInvitado === 'TRUE') && r.Excluido !== true && r.Excluido !== 'TRUE' && !idsEntEquipo.has(r.ID_Entrenador); })
          .map(function(r) { return App.cache.entrenadores.find(function(e) { return e.ID === r.ID_Entrenador; }) || null; })
          .filter(Boolean);
        var entConEstado = entEquipo.concat(invitadosEnt).filter(function(e) {
          var reg = mapaEnt[e.ID];
          return !reg || (reg.Excluido !== true && reg.Excluido !== 'TRUE');
        }).map(function(e) {
          var reg = mapaEnt[e.ID];
          return { entrenador: e, asistio: reg ? (reg.Asistio === true || reg.Asistio === 'TRUE') : null, esInvitado: !!reg && (reg.EsInvitado === true || reg.EsInvitado === 'TRUE') };
        });

        return { sesion: sesion, jugadores: jugConEstado, entrenadores: entConEstado };
      },

      _render: function(asistencia) {
        var sesion = asistencia.sesion;
        var jugadores = asistencia.jugadores || [];
        var entrenadores = asistencia.entrenadores || [];
        this._removed = {
          jugadores: new Set(App.cache.asistJugadores.filter(function(r) { return r.ID_Sesion === sesion.ID && (r.Excluido === true || r.Excluido === 'TRUE'); }).map(function(r) { return r.ID_Jugador; })),
          entrenadores: new Set(App.cache.asistEntrenadores.filter(function(r) { return r.ID_Sesion === sesion.ID && (r.Excluido === true || r.Excluido === 'TRUE'); }).map(function(r) { return r.ID_Entrenador; })),
        };

        var f = _fmtFecha(sesion.Fecha);
        var extra = (sesion.EsExtra === true || sesion.EsExtra === 'TRUE') ? ' &middot; <strong>Extra</strong>' : '';
        document.getElementById('sesion-hdr').innerHTML =
          '<h2>' + f.dn + ', ' + f.d + ' de ' + f.ml + '</h2>' +
          '<div class="vh-sub">' + sesion.HoraInicio + '&ndash;' + sesion.HoraFin + extra + '</div>' +
          (sesion.Notas ? '<div class="vh-horario">' + _esc(sesion.Notas) + '</div>' : '');

        document.getElementById('sesion-jugs').innerHTML = jugadores.length
          ? jugadores.map(function(item) {
              var j = item.jugador;
              var estado = item.estado || (item.tieneJustif ? App.views.sesion._estadoJustificacion(item.tipoJustif) : '') || '';
              var preaviso = item.preaviso || '';
              var inv = item.esInvitado;
              return '<div class="jug-card ' + estado + (preaviso ? ' has-preaviso' : '') + '" data-id="' + j.ID + '" data-estado="' + estado + '" data-preaviso="' + preaviso + '" data-min="' + (item.minutosRetraso || '') + '" data-inv="' + inv + '" data-justif="' + (item.tieneJustif ? 'true' : 'false') + '" data-tipo-justif="' + _esc(item.tipoAviso) + '" onclick="App.views.sesion.toggleEstado(this)">' +
                '<div class="jug-dorsal has-avatar">' + App.avatarHtml(j.FotoURL,j.Nombre + ' ' + j.Apellidos,32) + (j.Dorsal ? '<span class="jug-dorsal-num">' + _esc(String(j.Dorsal)) + '</span>' : '') + '</div>' +
                '<div style="flex:1;min-width:0"><div class="jug-nombre">' + _esc(j.Apellidos + ', ' + j.Nombre) + '</div>' +
                '<div class="jug-tipo">' + (inv ? 'Invitado' : _esc(j.Tipo || '')) + '</div>' +
                (preaviso ? '<div class="preaviso-tag">Avisó: ' + (preaviso === 'A' ? 'Ausencia' : 'Retraso') + (item.motivoJustif ? ' · ' + _esc(item.motivoJustif) : '') + '</div>' : '') +
                (item.tieneJustif ? App.notifications.chipHtml(j, 'App.views.sesion.verJustificacion(' + _statsArgumento(j.ID) + ')', preaviso ? '' : item.motivoJustif) : '') +
                '</div>' +
                App.views.sesion._htmlMinutos(item.minutosRetraso) +

            }).join('')
          : '<div class="empty-state" style="padding:20px"><p>Sin jugadores asignados</p></div>';

        document.getElementById('sesion-ents').innerHTML = entrenadores.length
          ? entrenadores.map(function(item) {

                App.avatarHtml(e.FotoURL,e.Nombre + ' ' + e.Apellidos,28) + '<div><div class="ent-nombre">' + _esc(e.Apellidos + ', ' + e.Nombre) + '</div>' +
                '<div class="ent-sub">' + (inv ? 'Invitado' : '') + '</div></div>' +
                '<label class="toggle-sw"><input type="checkbox" ' + (asistio ? 'checked' : '') + ' onchange="App.state._formIsDirty=true;App.state._sesionEditVersion++">' +
                '<div class="toggle-sl"></div></label></div>';
            }).join('')
          : '<div class="empty-state" style="padding:20px"><p>Sin entrenadores asignados</p></div>';
        var draft = App.state._sesionDraftRestore;
        if (draft && draft.sesionId === sesion.ID) {
          this._removed = {
            jugadores: new Set(draft.excluidosJugadores),
            entrenadores: new Set(draft.excluidosEntrenadores),
          };
          document.querySelectorAll('#sesion-jugs .jug-card').forEach(function(card) {
            if (App.views.sesion._removed.jugadores.has(card.dataset.id)) card.remove();
          });
          document.querySelectorAll('#sesion-ents .ent-row').forEach(function(row) {
            if (App.views.sesion._removed.entrenadores.has(row.dataset.id)) row.remove();
          });
          draft.jugadores.forEach(function(item) {
            if (App.views.sesion._removed.jugadores.has(item.jugadorId)) return;
            var presente = [].some.call(document.querySelectorAll('#sesion-jugs .jug-card'), function(card) {
              return card.dataset.id === item.jugadorId;
            });
            var jugador = App.cache.getJugadorById(item.jugadorId);
            if (!presente && jugador) App.views.sesion._seleccionar(jugador, 'jugador');
          });
          draft.entrenadores.forEach(function(item) {
            if (App.views.sesion._removed.entrenadores.has(item.entrenadorId)) return;
            var presente = [].some.call(document.querySelectorAll('#sesion-ents .ent-row'), function(row) {
              return row.dataset.id === item.entrenadorId;
            });
            var entrenador = App.cache.getEntrenadorById(item.entrenadorId);
            if (!presente && entrenador) App.views.sesion._seleccionar(entrenador, 'entrenador');
          });
          document.querySelectorAll('#sesion-jugs .jug-card').forEach(function(card) {
            var saved = draft.jugadores.find(function(item) { return item.jugadorId === card.dataset.id; });
            if (!saved) return;
            card.dataset.estado = saved.estado || '';
            card.dataset.inv = String(!!saved.esInvitado);
            card.dataset.min = saved.minutosRetraso || '';
            var minutos = card.querySelector('.retraso-min');
            if (minutos) minutos.value = card.dataset.min;
            card.className = 'jug-card ' + (saved.estado || '') + (!saved.limpiarJustif && card.dataset.preaviso ? ' has-preaviso' : '');
            var chip = card.querySelector('.estado-chip');
            if (chip) chip.textContent = _iconEstado(saved.estado || '');
            if (saved.limpiarJustif) {
              card.dataset.justif = 'false';
              card.dataset.justifCleared = 'true';
              var aviso = card.querySelector('.jug-justif-aviso');
              if (aviso) aviso.remove();
              delete card.dataset.preaviso;
              var tag = card.querySelector('.preaviso-tag');
              if (tag) tag.remove();
            }
          });
          document.querySelectorAll('#sesion-ents .ent-row').forEach(function(row) {
            var saved = draft.entrenadores.find(function(item) { return item.entrenadorId === row.dataset.id; });
            var checkbox = row.querySelector('input[type="checkbox"]');
            if (saved && checkbox) checkbox.checked = !!saved.asistio;
          });
          App.state._sesionDraftRestore = null;
          App.state._formIsDirty = true;
        } else {
          App.state._formIsDirty = false;
        }
        var cancelar = document.getElementById('btn-cancelar-sesion');
        if (cancelar) cancelar.style.display = sesion.AsistenciaGuardada === true || sesion.AsistenciaGuardada === 'TRUE' ? 'none' : '';
        App.views.sesion._bindSwipeRows();
        App.views.sesion._startAutoSave();
      },

            )
          );

      _doToggleEstado: function(card) {
        var ciclo = {'':'P','P':'A','A':'R','R':'P'};
        var sig = ciclo[card.dataset.estado || ''];
        card.dataset.estado = sig;

      _htmlMinutos: function(valor) {
        var opciones = [5, 10, 15, 20, 30, 45, 60];
        if (valor && opciones.indexOf(Number(valor)) < 0) opciones.push(Number(valor));

          opciones.map(function(n) { return '<option value="' + n + '"' + (Number(valor) === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>';
