"Asistencia":"Attendance",
"Qué parte de las sesiones registradas corresponde a jugadores que asistieron, también si llegaron tarde.":"The share of recorded player attendance where the player attended, including late arrivals.",
"Se suman presentes y retrasos y se divide entre presentes, ausentes y retrasos; después se multiplica por 100 y se redondea. Una ausencia justificada sigue contando como ausencia. Solo entran registros no excluidos en sesiones finalizadas, guardadas y no canceladas de la temporada y periodo elegidos. Sin registros se muestra —.":"Add present and late records, divide by present, absent and late records, multiply by 100 and round. An explained absence still counts as absent. Only non-excluded records in completed, saved, non-cancelled sessions in the chosen season and period count. With no records, — is shown.",
"Puntualidad":"Punctuality",
"De las veces que vino, llegó a su hora. Las ausencias no afectan a este porcentaje.":"Of the times the player attended, how often they arrived on time. Absences do not affect this percentage.",
"Se divide el número de llegadas a tiempo entre todas las veces que asistió (a tiempo o con retraso), se multiplica por 100 y se redondea. Si nadie asistió, se muestra —.":"Divide on-time arrivals by all attendances (on time or late), multiply by 100 and round. If nobody attended, — is shown.",
"Sesiones registradas":"Recorded sessions",
"Registros válidos de asistencia de jugadores en el periodo elegido.":"Valid player attendance records in the chosen period.",
"Se cuentan presentes, ausentes y retrasos no excluidos en sesiones computables. En un equipo o en el club, un entrenamiento puede aportar un registro por jugador; no es el número de entrenamientos distintos.":"Count non-excluded present, absent and late records in eligible sessions. For a team or club, each player can contribute a record to a training session; this is not the number of distinct training sessions.",
"Racha actual":"Current streak",
"Secuencia más reciente de asistencias sin faltar. Llegar tarde mantiene la racha.":"The most recent run of attendance without an absence. Arriving late maintains the streak.",
"Se ordenan los registros por fecha y hora, del más reciente al más antiguo, y se cuentan presencias o retrasos hasta la primera ausencia. Los registros excluidos o sin registrar no participan.":"Sort records by date and time, newest first, and count present or late records until the first absence. Excluded and unrecorded entries do not participate.",
"Mejor racha":"Best streak",
"La secuencia más larga de asistencias consecutivas dentro del periodo elegido.":"The longest run of consecutive attendance in the chosen period.",
"Mayor número de presencias o retrasos seguidos al recorrer los registros por fecha y hora. Cada ausencia corta la secuencia.":"The greatest number of consecutive present or late records in chronological order. Each absence ends the streak.",
"Tendencia":"Trend",
"Compara la temporada con las últimas 4 semanas. Estable significa que el porcentaje no ha cambiado; una flecha indica cuántos puntos subió o bajó.":"Compares the season with the last 4 weeks. Stable means the percentage has not changed; an arrow shows how many points it rose or fell.",
"Porcentaje de asistencia de los últimos 28 días menos el porcentaje de la temporada. Solo se muestra para la temporada activa completa y con al menos 4 registros recientes válidos. La referencia «vs. últimas 4 semanas» no compara dos bloques consecutivos de 28 días.":"Attendance percentage over the last 28 days minus the season percentage. Shown only for the full active season with at least 4 valid recent records. The last-4-weeks reference does not compare two consecutive 28-day periods.",
"Sesiones computables":"Eligible sessions",
"Entrenamientos que pueden entrar en los cálculos del periodo.":"Training sessions eligible for calculations in the period.",
"Sesiones de la temporada elegida cuya fecha está en el intervalo, ya han terminado, no están canceladas y tienen la asistencia guardada. Cada sesión se cuenta una vez.":"Sessions in the chosen season and date range that have ended, are not cancelled and have saved attendance. Each session counts once.",
"Sesiones canceladas":"Cancelled sessions",
"Entrenamientos marcados como cancelados en el periodo.":"Training sessions marked as cancelled in the period.",
"Se cuentan las sesiones canceladas de la temporada cuya fecha está entre el inicio y el fin del filtro. No entran en los porcentajes de asistencia.":"Count cancelled sessions in the season between the filter start and end dates. They do not enter attendance percentages.",
"Sesiones pendientes":"Pending sessions",
"Entrenamientos ya terminados en los que aún no se ha guardado la asistencia.":"Completed training sessions whose attendance has not yet been saved.",
"Se cuentan sesiones no canceladas del intervalo cuya fecha y hora de fin ya han pasado y no tienen AsistenciaGuardada. No se convierten en ausencias ni entran en los porcentajes.":"Count non-cancelled sessions in the date range whose end date and time have passed and whose attendance is not saved. They do not become absences or enter percentages.",
"Horas programadas":"Scheduled hours",
"Duración prevista de los entrenamientos computables, no tiempo real de llegada o salida.":"Scheduled duration of eligible training sessions, not actual arrival or departure time.",
"Suma de los minutos entre HoraInicio y HoraFin de cada sesión computable, dividida entre 60 y redondeada a una décima. Una duración ausente o negativa aporta cero.":"Sum minutes between each eligible session’s start and end, divide by 60 and round to one decimal. Missing or negative duration contributes zero.",
"Horas programadas asistidas":"Scheduled hours attended",
"Duración prevista de los entrenamientos a los que el jugador asistió.":"Scheduled duration of training sessions the player attended.",
"Suma de la duración programada de los registros P o R, dividida entre 60 y redondeada a una décima. No se descuentan minutos de retraso.":"Sum scheduled duration for present or late records, divide by 60 and round to one decimal. Late minutes are not deducted.",
"Asistentes medios":"Average attendance",
"Promedio de jugadores presentes o con retraso por entrenamiento computable.":"Average number of present or late players per eligible training session.",
"Total de P + R del equipo dividido entre sus sesiones computables, redondeado a una décima. Una sesión computable sin jugadores registrados sigue contando en el divisor.":"Divide total present and late records for the team by eligible sessions and round to one decimal. An eligible session with no recorded players still counts in the divisor.",
"Plantilla activa":"Active squad",
"Jugadores con relación de equipo vigente al final del periodo.":"Players whose team membership is valid at the end of the period.",
"Se cuenta cada jugador una vez por equipo si su intervalo de alta y baja incluye la fecha final del filtro. Incluye relaciones principales y secundarias.":"Count each player once per team if the membership interval includes the filter’s end date. Includes primary and secondary memberships.",
"Distribución de la plantilla":"Squad distribution",
"Reparto de jugadores de la plantilla del periodo según su asistencia.":"Players in the period’s squad grouped by attendance.",
"Con al menos 5 registros: alta ≥ 85 %, media entre 70 y 84 %, baja < 70 %. Con 1 a 4 registros se muestra Pocas sesiones. Quienes no tienen registros no se incluyen en estos grupos.":"With at least 5 records: high ≥ 85%, medium 70–84%, low < 70%. With 1–4 records, Too few sessions is shown. Players with no records are not included.",
"Motivos de ausencias y retrasos":"Reasons for absences and late arrivals",
"Motivos asociados a incidencias justificadas, separados entre ausencias y retrasos.":"Reasons associated with explained incidents, separated into absences and late arrivals.",
"Se agrupan únicamente registros A o R con TieneJustificacion por MotivoCategoria; si falta el motivo se usa Sin motivo. No se infieren motivos para incidencias sin justificar.":"Group only explained absent or late records by reason category; use No reason if missing. Reasons are not inferred for unexplained incidents.",
"Incidencias justificadas":"Explained incidents",
"Qué parte de las ausencias y retrasos tiene una justificación registrada.":"The share of absences and late arrivals with a recorded explanation.",
"Se suman ausencias y retrasos justificados, se divide entre todas las ausencias y retrasos y se multiplica por 100; se redondea al entero. Una justificación no transforma una ausencia en presencia. Sin incidencias se muestra —.":"Add explained absences and late arrivals, divide by all absences and late arrivals, multiply by 100 and round. An explanation does not turn an absence into attendance. With no incidents, — is shown.",
"Avisos y justificaciones":"Notices and explanations",
"Incidencias justificadas y forma en que se comunicaron.":"Explained incidents and how they were communicated.",
"Total: registros A o R justificados. Programadas: JustificadoPor es programacion. Previos: las demás justificaciones cuya fecha es anterior al inicio del entrenamiento. Una incidencia programada no vuelve a contarse como aviso previo.":"Total: explained absent or late records. Scheduled: recorded through a scheduled notice. Advance: other explanations sent before training began. A scheduled incident is not counted again as an advance notice.",
"Antelación de avisos":"Advance notice",
"Tiempo habitual con el que se avisó antes del entrenamiento.":"Typical time between a notice and the start of training.",
"Mediana de las horas entre FechaJustificacion y el inicio de la sesión, solo para A o R justificados previamente y no procedentes de programación. Se ordenan los valores y se toma el central, o la media de los dos centrales; se redondea a una décima. Sin avisos válidos se muestra —.":"Median hours between explanation and session start, only for previously explained absent or late records not from scheduled notices. Sort values and take the middle, or the average of the middle two, rounded to one decimal. With no valid notices, — is shown.",
"Asistencia por día":"Attendance by weekday",
"Cómo varía la asistencia según el día de la semana.":"How attendance varies by day of the week.",
"Se agrupan los registros válidos por el día de la fecha de la sesión, de lunes a domingo. En cada grupo se calcula (P + R) / (P + A + R) × 100.":"Group valid records by the session’s weekday, Monday to Sunday. In each group calculate (present + late) / (present + absent + late) × 100.",
"Asistencia mes a mes":"Attendance month by month",
"Cada barra cuenta cuántas veces estuvo presente, llegó tarde o faltó durante ese mes.":"Each bar counts how often the person was present, late or absent that month.",
"Los registros válidos se agrupan por el mes de la sesión y se cuentan por separado presentes, retrasos y ausentes. En entrenadores, la barra cuenta las veces que estuvo presente de sus sesiones registradas. Solo se incluyen meses con registros.":"Group valid records by session month and count present, late and absent separately. For coaches, the bar counts attendances among their recorded sessions. Only months with records are included.",
"Evolución semanal":"Weekly trend",
"Asistencia de jugadores agrupada en semanas que empiezan el lunes.":"Player attendance grouped into weeks starting on Monday.",
"Se agrupan los registros por el lunes de la semana de la sesión y se calcula (P + R) / (P + A + R) × 100 en cada grupo. Solo se incluyen semanas con registros.":"Group records by the Monday of the session’s week and calculate (present + late) / (present + absent + late) × 100 in each group. Only weeks with records are included.",
"Cobertura técnica":"Coaching coverage",
"Porcentaje de entrenamientos con al menos un entrenador asignado presente.":"Percentage of training sessions with at least one assigned coach present.",
"Sesiones computables con algún entrenador presente cuya relación con el equipo estaba vigente ese día / sesiones computables × 100. Cada sesión cuenta una sola vez.":"Eligible sessions with a present coach whose team membership was valid that day / eligible sessions × 100. Each session counts once.",
"Sesiones con sustituto":"Sessions with cover",
"Entrenamientos en los que participó al menos un técnico invitado.":"Training sessions with at least one guest coach.",
"Sesiones computables con algún registro de entrenador con Asistio verdadero y EsInvitado verdadero / sesiones computables × 100. Puede coincidir con una sesión cubierta por un técnico asignado.":"Eligible sessions with a present guest coach / eligible sessions × 100. This can overlap with a session covered by an assigned coach.",
"Presencias de refuerzos":"Reinforcement attendance",
"Parte de las asistencias de jugadores que corresponde a secundarios o invitados.":"The share of player attendances belonging to secondary or guest players.",
"Registros P o R de jugadores con relación Secundario vigente ese día o, sin relación, marcados como invitados / todos los P + R del equipo × 100.":"Present or late records for players with a valid secondary membership that day, or guests without membership / all present and late team records × 100.",
"Latencia de registro":"Recording delay",
"Tiempo habitual transcurrido desde el fin de una sesión hasta su primer registro de asistencia.":"Typical time from a session’s end until attendance was first recorded.",
"Mediana de máximo(0, FechaPrimerRegistro − fecha y hora de fin), expresada en horas y redondeada a una décima. Solo sesiones computables con FechaPrimerRegistro; sin hora de fin se usa 23:59. No mide la última edición.":"Median of max(0, first recording timestamp − session end), in hours rounded to one decimal. Only eligible sessions with a first-recording timestamp count; a missing end time uses 23:59. This does not measure the latest edit.",
"Retraso medio":"Average lateness",
"Minutos de retraso medios entre los retrasos con duración informada.":"Average minutes late among late arrivals with a reported duration.",
"Suma de MinutosRetraso / número de registros R con minutos enteros positivos, redondeado a una décima. Los retrasos sin minutos no se interpretan como cero.":"Total minutes late / number of late records with positive whole minutes, rounded to one decimal. Missing minutes are not treated as zero.",
"Carga semanal":"Weekly load",
"Número medio de entrenamientos asistidos por semana del periodo.":"Average number of training sessions attended per week of the period.",
"Total de registros P + R dividido entre todas las semanas de lunes a domingo que toca el intervalo, incluidas semanas sin asistencia; redondeado a una décima.":"Total present and late records divided by all Monday–Sunday weeks touched by the interval, including weeks without attendance, rounded to one decimal.",
"Sesiones extra":"Extra sessions",
"Participación en entrenamientos marcados como extra.":"Participation in training sessions marked as extra.",
"Para un jugador se cuentan sus registros válidos en sesiones EsExtra y cuántos son P o R. Para un equipo se cuentan sus sesiones computables EsExtra una sola vez.":"For a player, count valid records in extra sessions and how many are present or late. For a team, count each eligible extra session once.",
"Presencia del entrenador":"Coach presence",
"Proporción de registros de asistencia del entrenador en los que estuvo presente.":"The share of coach attendance records where the coach was present.",
"Registros con Asistio verdadero / registros con Asistio booleano verdadero o falso, no excluidos, en sesiones computables × 100. Las sesiones sin registro del entrenador no se añaden al divisor.":"Present records / non-excluded records explicitly marked present or absent in eligible sessions × 100. Sessions without a coach record are not added to the divisor.",
"Sesiones del entrenador":"Coach sessions",
"Sesiones computables con un registro válido de asistencia del entrenador.":"Eligible sessions with a valid attendance record for the coach.",
"Se cuentan sus registros no excluidos con Asistio verdadero o falso. No se cuentan todas las sesiones de sus equipos ni se suponen ausencias cuando falta un registro.":"Count non-excluded records explicitly marked present or absent. Not all sessions for the coach’s teams count, and missing records are not assumed to be absences.",
"Horas dirigidas":"Coaching hours",
"Duración programada de las sesiones a las que asistió el entrenador.":"Scheduled duration of sessions the coach attended.",
"Suma de minutos programados de sus registros con Asistio verdadero / 60, redondeado a una décima. No mide horas de llegada ni descuenta retrasos.":"Sum scheduled minutes for present records / 60, rounded to one decimal. This does not measure arrival times or deduct lateness.",
"Sustituciones dadas":"Cover provided",
"Sesiones en las que el entrenador asistió como invitado.":"Sessions the coach attended as a guest.",
"Se cuentan registros válidos con Asistio verdadero y EsInvitado verdadero en sesiones computables del periodo.":"Count valid present guest records in eligible sessions in the period.",
"Coberturas recibidas":"Cover received",
"Sesiones de sus equipos en las que faltó y hubo otro entrenador presente.":"Sessions for the coach’s teams where they were absent and another coach was present.",
"Por cada sesión computable con relación vigente del entrenador, se cuenta si no tiene presencia propia y sí hay otro técnico con Asistio verdadero. No es necesario que el otro técnico esté marcado como invitado.":"For each eligible session with a valid coach membership, count it if the coach has no presence record but another coach is present. The other coach need not be marked as a guest.",
"Contactabilidad":"Contact coverage",
"Vías disponibles para localizar a los jugadores activos de la temporada. No garantiza que sean válidas ni que el mensaje se entregue.":"Available ways to contact active players in the season. This does not guarantee validity or delivery.",
"Se deduplican jugadores con alguna relación Activo verdadera en equipos de la temporada. El gráfico separa, por prioridad: email familiar, teléfono sin email familiar, solo email personal y ningún contacto. No depende del periodo de asistencia. Localizables = jugadores con alguna de esas vías / jugadores activos × 100.":"Deduplicate players with an active membership in teams for the season. The chart separates, by priority: family email, phone without family email, personal email only and no contact. This is independent of the attendance period. Reachable = players with any contact channel / active players × 100.",
"Avisos activos":"Notifications enabled",
"Jugadores cuya familia tiene al menos un email con avisos habilitados.":"Players whose family has at least one email with notifications enabled.",
"Jugadores activos con EmailPadre1 o EmailPadre2 no vacío y su NotificarAusenciasPadre correspondiente distinto de false / jugadores activos del club × 100. Tener teléfono o email personal no activa los avisos familiares.":"Active players with a non-empty family email and its notification setting not false / active club players × 100. A phone number or personal email does not enable family notifications.",
"Con teléfono":"With phone number",
"Jugadores con algún teléfono propio o familiar registrado. Puede coincidir con tener email familiar.":"Players with a personal or family phone number on file. This can overlap with family email.",
"Jugadores activos con Telefono, TelefonoPadre1 o TelefonoPadre2 no vacío / jugadores activos del club × 100. En el gráfico Solo teléfono exige no tener email familiar.":"Active players with a non-empty personal or family phone number / active club players × 100. In the chart, Phone only excludes players with family email.",
"Sin contacto":"No contact details",
"Jugadores sin ninguna vía de contacto registrada; sus fichas necesitan completarse.":"Players with no contact channel on file; their profiles need completing.",
"Se cuenta un jugador activo si no tiene EmailPadre1, EmailPadre2, Email, Telefono, TelefonoPadre1 ni TelefonoPadre2 no vacíos. La lista muestra cada jugador una vez y permite abrir su ficha.":"Count an active player if all personal and family email addresses and phone numbers are empty. The list shows each player once and links to their profile.",
"Contacto por equipo":"Contact by team",
"Distribución de las vías de contacto de la plantilla activa de cada equipo de la temporada.":"Contact channels for the active squad of each team in the season.",
"Mismas categorías excluyentes que el gráfico global. Cada segmento se divide entre los jugadores con relación Activo verdadera del equipo. Un jugador de varios equipos aparece en cada uno, pero solo una vez en el total del club.":"The same mutually exclusive categories as the club chart. Divide each segment by active team members. A player in several teams appears in each, but only once in the club total.",
"Asistencia por categoría":"Attendance by category",
"Asistencia conjunta de los equipos de una categoría.":"Combined attendance for teams in a category.",
"Se reúnen todos los registros válidos de esos equipos y se calcula (P + R) / (P + A + R) × 100. No es una media simple de los porcentajes de cada equipo.":"Combine all valid records for those teams and calculate (present + late) / (present + absent + late) × 100. This is not a simple average of team percentages.",
"Cancelaciones por motivo":"Cancellations by reason",

"Se agrupan las sesiones canceladas del periodo por MotivoCancelacion y se cuentan; si no hay motivo se usa Sin motivo.":"Group cancelled sessions in the period by cancellation reason and count them; use No reason if missing.",
"Últimas sesiones":"Recent sessions",
"Histórico reciente de registros válidos del jugador dentro del filtro.":"Recent valid player records within the filter.",
"Se ordenan por fecha y hora de inicio, del más reciente al más antiguo. El detalle conserva hasta 60 registros y cada vista puede mostrar menos. Canceladas, pendientes y excluidas no aparecen como ausencias.":"Sort by date and start time, newest first. The detail retains up to 60 records; each view may display fewer. Cancelled, pending and excluded sessions do not appear as absences.",
"Ranking de asistencia":"Attendance ranking",
"Orden de asistencia entre los jugadores de la plantilla principal del jugador.":"Attendance order among members of the player’s primary team.",
"Participan miembros vigentes al final del periodo con al menos 5 registros. Se ordenan por asistencia descendente, después por número de registros descendente y por apellidos. La posición es ordinal; con menos de 5 registros se muestran aparte.":"Include members valid at the period’s end with at least 5 records. Sort by attendance descending, record count descending, then surname. Positions are ordinal; players with fewer than 5 records are shown separately.",
"Logros":"Achievements",
"Reconocimientos de asistencia, puntualidad y continuidad.":"Recognition for attendance, punctuality and continuity.",
"Con al menos 5 registros: asistencia perfecta si es 100 %, puntualidad perfecta si es 100 %, racha de 10 si la actual es ≥ 10 y mejor racha si iguala la mayor racha actual de los candidatos del equipo y esta es ≥ 3. Pueden coincidir varios logros.":"With at least 5 records: perfect attendance at 100%, perfect punctuality at 100%, a streak of 10 at ≥ 10, and best streak when equal to the highest current eligible team streak of at least 3. Several achievements can apply.",
"Alertas de asistencia":"Attendance alerts",
"Señales para revisar un caso; no sanciones automáticas.":"Signals to review a case, not automatic penalties.",
"Tres últimas ausencias seguidas; tendencia de −20 pp o inferior; o al menos 3 ausencias sin justificar en los últimos 28 días. La tendencia necesita al menos 4 registros recientes y solo se calcula para la temporada activa completa.":"The last 3 records are absences; a trend of −20 percentage points or lower; or at least 3 unexplained absences in the last 28 days. Trend requires at least 4 valid recent records and applies only to the full active season.",
"Faltas sin justificar":"Unjustified absences",

"Tu privacidad importa":"Your privacy matters",
"Cómo cuidamos tus datos en CB Baeza.":"How we look after your data at CB Baeza.",
"Cookies y almacenamiento":"Cookies and storage",
"Responsable del tratamiento":"Data controller",
"El Club de Baloncesto Baeza es el responsable de los datos utilizados en esta aplicación. Puedes contactar con el club a través de sus entrenadores o de su directiva para cualquier consulta sobre privacidad.":"Club de Baloncesto Baeza is responsible for the data used in this application. Contact the club's coaches or board with any privacy questions.",
"Qué datos tratamos":"What data we process",
"Datos de identificación, credenciales de acceso, información de contacto, contactos familiares, asignación a equipos, asistencia a entrenamientos, justificaciones de ausencias o retrasos y, si decides añadirla, tu fotografía de perfil.":"Identification details, sign-in credentials, contact information, family contacts, team assignments, training attendance, absence or lateness explanations and, if you add one, your profile photo.",
"Si una ausencia o un retraso se debe a la salud, la justificación solo indica «Salud», sin diagnósticos ni detalles: con ese motivo la aplicación no admite texto libre y los correos solo dicen «Salud». En los demás motivos, incluye únicamente lo necesario para comunicar la incidencia.":"If an absence or late arrival is health-related, the explanation only says «Health», with no diagnosis or details: with that reason the app accepts no free text and emails only say «Health». For other reasons, include only what is needed to communicate the incident.",
"Última actualización: 30/10/2026":"Last updated: 30/10/2026",
"Ranking de asistencia del equipo":"Team attendance ranking",
"Los jugadores de un mismo equipo ven en «Mi equipo» un ranking de asistencia con el nombre y la foto de perfil de sus compañeros, junto a su porcentaje de asistencia, su racha y sus logros. El ranking no muestra ausencias concretas, motivos ni justificaciones.":"Players on the same team see an attendance ranking in «My team» showing their teammates' names and profile photos, together with their attendance rate, streak and achievements. The ranking does not show specific absences, reasons or explanations.",
"Correos automáticos":"Automatic emails",
"Los avisos de asistencia, las justificaciones y los códigos de recuperación se envían automáticamente desde la cuenta de Gmail de la persona que gestiona la aplicación para el club. Google presta ese servicio de correo como proveedor y su uso puede implicar una transferencia de datos a Estados Unidos, cubierta por el Marco de Privacidad de Datos UE-EE. UU. (EU-US Data Privacy Framework).":"Attendance notices, explanations and recovery codes are sent automatically from the Gmail account of the person who manages the app for the club. Google provides that email service as a provider, and its use may involve a transfer of data to the United States, covered by the EU-US Data Privacy Framework.",
"Para qué los utilizamos":"How we use your data",
"Gestionamos la actividad deportiva y la asistencia del club, facilitamos el trabajo de los entrenadores y enviamos avisos relacionados con la asistencia a las familias que los tengan activados. No utilizamos los datos para publicidad.":"We manage the club's sporting activities and attendance, support coaches and send attendance notifications to families who enable them. We do not use your data for advertising.",
"Base jurídica y menores":"Legal basis and minors",
"El tratamiento se apoya en el consentimiento para las funciones que lo requieren y en el interés legítimo del club en organizar su actividad deportiva, respetando los derechos de las personas. Los datos de menores se facilitan y gestionan mediante sus madres, padres o tutores legales. Puedes retirar tu consentimiento cuando corresponda, sin afectar a los tratamientos anteriores a su retirada.":"Processing relies on consent where required and on the club's legitimate interest in organising its sporting activities while respecting individual rights. Minors' data is provided and managed by parents or legal guardians. Where applicable, you may withdraw consent without affecting processing carried out before withdrawal.",
"Destinatarios e infraestructura":"Recipients and infrastructure",
"No cedemos tus datos a terceros para sus propios fines. El personal autorizado del club accede solo a la información necesaria para sus funciones. La aplicación funciona sobre Google Apps Script y los datos se guardan en Supabase, que actúa como proveedor de infraestructura y encargado del tratamiento. Estos servicios pueden implicar tratamiento fuera del Espacio Económico Europeo, sujeto a las garantías de protección de datos aplicables.":"We do not share your data with third parties for their own purposes. Authorised club staff access only information needed for their roles. The app runs on Google Apps Script and data is stored in Supabase, which provides infrastructure and acts as a data processor. These services may involve processing outside the European Economic Area, subject to applicable data protection safeguards.",
"Conservación":"Retention",
"Conservamos los datos durante la relación deportiva y el tiempo necesario para gestionar las temporadas, atender solicitudes y cumplir las obligaciones legales aplicables. Después se eliminan o anonimizan cuando dejan de ser necesarios. El club revisa la necesidad de conservar el historial y los contactos familiares.":"We retain data throughout your sporting relationship with the club and as long as needed to manage seasons, respond to requests and meet applicable legal obligations. Data is then deleted or anonymised when no longer needed. The club reviews the need to retain historical records and family contacts.",
"Tus derechos":"Your rights",
"Puedes solicitar acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad de tus datos, en los casos previstos por la normativa, contactando con la directiva o los entrenadores del club. Para proteger tu información puede ser necesario acreditar tu identidad o representación legal. También puedes presentar una reclamación ante la Agencia Española de Protección de Datos (AEPD), en":"You may request access, rectification, erasure, objection, restriction or portability of your data where provided by law by contacting the board or coaches. To protect your information, proof of identity or legal representation may be required. You may also lodge a complaint with Spain's data protection authority (AEPD) at",
"Aplicamos controles de acceso por perfil y medidas técnicas y organizativas para proteger la información. No compartas tu PIN ni tu código de seguridad y cierra la sesión en dispositivos compartidos. Comunica al club cualquier acceso no autorizado que detectes.":"We apply role-based access controls and technical and organisational safeguards. Do not share your PIN or security code, and sign out on shared devices. Notify the club of any unauthorised access you detect.",
"Política de cookies y almacenamiento":"Cookies and storage policy",
"Sin publicidad ni analítica":"No advertising or analytics",
"Esta aplicación no utiliza cookies de publicidad ni de analítica. Guarda información técnica en el almacenamiento local de tu navegador (localStorage) para que puedas utilizarla.":"This application does not use advertising or analytics cookies. It saves technical information in your browser's local storage (localStorage) so you can use it.",
"Qué se guarda en tu dispositivo":"What is saved on your device",
": mantiene tu sesión y tus credenciales de acceso hasta que cierres sesión o borres el almacenamiento.":": keeps your session and sign-in credentials until you sign out or clear storage.",
": recuerda el idioma y el tema visual elegidos.":": remembers your chosen language and theme.",
": recuerda qué notificaciones del buzón has leído o borrado.":": remembers which inbox notifications you have read or deleted.",
": recuerda qué alertas de ausencias seguidas has marcado como «Contactado» (entrenadores y administración).":": remembers which consecutive-absence alerts you have marked as «Contacted» (coaches and administration).",
"El final <id> de estas dos claves identifica tu cuenta, para que cada persona que use el dispositivo conserve su propio estado.":"The <id> ending of these two keys identifies your account, so each person using the device keeps their own state.",
"No indiques diagnósticos ni detalles de salud.":"Do not include diagnoses or health details.",
"Borradores locales: permiten recuperar cambios pendientes en formularios de la aplicación.":"Local drafts: allow you to recover unsaved changes in app forms.",
"El almacenamiento local no se envía automáticamente como una cookie. La aplicación utiliza la sesión guardada para autenticar las peticiones al servidor. Quien tenga acceso a tu dispositivo puede acceder a la sesión: evita guardar el acceso en equipos compartidos.":"Local storage is not automatically sent like a cookie. The app uses your saved session to authenticate server requests. Anyone with access to your device may access your session: avoid saving sign-in details on shared devices.",
"Cookies técnicas de Google":"Google technical cookies",
"Google puede establecer cookies técnicas necesarias para servir la aplicación mediante Apps Script y para la seguridad o funcionamiento de su plataforma, según tu navegador y tu sesión de Google.":"Google may set technical cookies needed to serve the app through Apps Script and for the security or operation of its platform, depending on your browser and Google session.",
"Cómo borrar estos datos":"How to delete this data",
"Puedes cerrar sesión desde el menú de usuario. Para borrar preferencias, borradores y cookies, abre la configuración de privacidad de tu navegador, busca los datos de sitios de Google Apps Script y elimina sus cookies y almacenamiento. También puedes borrar todos los datos de navegación. Perderás la sesión, las preferencias y los borradores guardados. Bloquear el almacenamiento o las cookies técnicas puede impedir algunas funciones.":"Sign out from the user menu. To remove preferences, drafts and cookies, open your browser's privacy settings, find Google Apps Script site data and delete its cookies and storage. You can also clear all browsing data. Your saved session, preferences and drafts will be lost. Blocking storage or technical cookies may prevent some features from working.",
