<style>
/* ══════════════════════════════════════════════
   CB Baeza — Asistencia · Estilos
   Paleta: #4A148C morado · #FFFFFF blanco
   ══════════════════════════════════════════════ */
:root {
  --morado:       #4A148C;
  --morado-m:     #7B1FA2;
  --morado-s:     #F3E5F5;
  --morado-xs:    #FAF0FF;
  --blanco:       #FFFFFF;
  --fondo:        #F7F7F8;
  --texto:        #1A1A1A;
  --texto-sec:    #6B6B6B;
  --borde:        #E5E5E5;
  --verde:        #2E7D32;
  --verde-s:      #E8F5E9;
  --rojo:         #C62828;
  --rojo-s:       #FFEBEE;
  --naranja:      #E65100;
  --naranja-s:    #FFF3E0;
  --r:      10px;
  --r-lg:   18px;
  --nav-h:  68px;
  --hdr-h:  56px;
  --sombra: 0 2px 8px rgba(74,20,140,.09);
  --sombra-lg: 0 4px 20px rgba(74,20,140,.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--fondo); color: var(--texto);
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ── Layout ── */
#app {
  display: flex; flex-direction: column; height: 100%;
  max-width: 480px; margin: 0 auto; background: var(--blanco);
  position: relative; overflow: hidden;
}
#view-container {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: var(--nav-h);
}
.view { display: none; }
.view.active { display: block; }

/* ── Header ── */
#app-header {
  position: relative;
  height: var(--hdr-h); background: var(--morado); color: var(--blanco);
  display: flex; align-items: center; padding: 0 16px; gap: 10px;
  flex-shrink: 0; z-index: 100;
}
#user-menu {
  position: absolute; top: var(--hdr-h); right: 0;
  background: var(--blanco); border-radius: 0 0 var(--r) var(--r);
  box-shadow: 0 6px 20px rgba(0,0,0,.2); border: 1px solid var(--borde);
  z-index: 200; min-width: 190px; overflow: hidden;
}
.user-menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; width: 100%; background: none; border: none;
  text-align: left; font-size: .86rem; font-weight: 600; cursor: pointer;
  color: var(--texto); border-bottom: 1px solid var(--borde);
  -webkit-tap-highlight-color: transparent; transition: background .12s;
}
.user-menu-item:last-child { border-bottom: none; }
.user-menu-item:active { background: var(--fondo); }
.user-menu-item-danger { color: var(--rojo); }
#btn-back {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%; color: var(--blanco);
  font-size: 1.4rem; line-height: 1; transition: background .15s; flex-shrink: 0;
}
#btn-back.visible { display: flex; }
#btn-back:active { background: rgba(255,255,255,.18); }
#header-title { flex: 1; font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#user-badge {
  display: flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.22);
  padding: 4px 10px 4px 4px; border-radius: 22px;
  cursor: pointer; flex-shrink: 0; min-width: 0;
  transition: background .15s;
}
#user-badge:active { background: rgba(255,255,255,.32); }
#user-menu-wrap { position: relative; flex-shrink: 0; }
.user-badge-chevron {
  width: 7px; height: 7px; border-right: 1.5px solid rgba(255,255,255,.85);
  border-bottom: 1.5px solid rgba(255,255,255,.85);
  transform: translateY(-2px) rotate(45deg); transition: transform .15s;
}
#user-menu-wrap.open .user-badge-chevron { transform: translateY(2px) rotate(225deg); }
.user-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 120;
  width: 190px; padding: 5px; border: 1px solid var(--borde); border-radius: 9px;
  background: var(--blanco); color: var(--texto); box-shadow: 0 5px 18px rgba(0,0,0,.2);
}
.user-menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px;
  padding: 8px 10px; border-radius: 6px; color: inherit; font-size: .82rem;
  font-weight: 600; text-align: left;
}
.user-menu-item > span { width: 18px; color: var(--texto-sec); font-size: 1rem; text-align: center; }
.user-menu-item:hover, .user-menu-item:focus-visible { background: var(--fondo); outline: none; }
.user-menu-logout { color: var(--rojo); }
.user-menu-logout > span { color: var(--rojo); }
.user-menu-divider { height: 1px; margin: 4px 5px; background: var(--borde); }
#user-badge-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.28); color: var(--morado);
  display: flex; align-items: center; justify-content: center;
  font-size: .66rem; font-weight: 900; flex-shrink: 0; letter-spacing: -.5px;
}
#user-badge-info { display: flex; flex-direction: column; min-width: 0; }
#user-badge-name {
  font-size: .72rem; font-weight: 700; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 110px;
}
#user-badge-role {
  font-size: .57rem; color: rgba(255,255,255,.68); white-space: nowrap;
}
#hdr-logo {
  width: 36px; height: 36px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.3);
}
#btn-back.visible ~ #hdr-logo { display: none; }
#sync-badge {
  display: none;
}
#sync-badge.syncing { display: inline-block; }
.operation-status {
  position: absolute; z-index: 150; left: 50%; bottom: calc(var(--nav-h) + 8px);
  display: flex; align-items: center; gap: 7px; min-width: 0; width: max-content;
  max-width: calc(100% - 24px); min-height: 38px; padding: 0 12px;
  border: 1px solid rgba(255,255,255,.22); border-radius: 20px;
  background: #292929; color: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.22);
  transform: translateX(-50%);
}
.operation-logo { display: block; flex: 0 0 21px; width: 21px; height: 21px; border-radius: 50%; object-fit: cover; }
.operation-status.pending .operation-logo { animation: operation-logo-spin .9s linear infinite; }
.operation-message { display: none; overflow: hidden; font-size: .67rem; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
.operation-status.pending .operation-message-pending,
.operation-status.success .operation-message-success,
.operation-status.error .operation-message-error { display: inline-flex; align-items: center; gap: 4px; }
.operation-status.success {
  background: linear-gradient(110deg, #176b48, #25864f);
  border-color: rgba(255,255,255,.42);
  box-shadow: 0 5px 18px rgba(18,91,55,.36);
}
.operation-status.success .operation-logo { display: none; }
.operation-status.error { background: #a82020; border-color: rgba(255,255,255,.3); }
.autosave-error { color: #b42318 !important; font-weight: 700; }
.operation-success-mark {
  position: relative; display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px;
  border: 0; border-radius: 50%; background: #fff; color: #176b48;
  box-shadow: 0 0 0 0 rgba(255,255,255,.4);
}
.operation-success-mark svg { display: block; width: 15px; height: 15px; overflow: visible; }
.operation-success-copy { display: inline-block; }
.operation-success-mark path {
  fill: none; stroke: #176b48; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 18; stroke-dashoffset: 0;
}
.operation-success-mark::after {
  content: ''; position: absolute; inset: -3px; border: 1px solid rgba(255,255,255,.72); border-radius: 50%; opacity: 0;
}
.operation-status.success-animate {
  animation: operation-success-arrive .72s cubic-bezier(.18,.82,.25,1.18) both;
}
.operation-status.success-animate .operation-success-mark {
  animation: operation-mark-pop .58s cubic-bezier(.18,.82,.25,1.35) .13s both;
}
.operation-status.success-animate .operation-success-mark path {
  stroke-dashoffset: 18; animation: operation-check-draw .34s ease-out .29s forwards;
}
.operation-status.success-animate .operation-success-mark::after {
  animation: operation-mark-ring .5s ease-out .16s both;
}
.operation-status.success-animate .operation-success-copy {
  animation: operation-copy-enter .42s cubic-bezier(.2,.75,.3,1) .2s both;
}
@keyframes operation-logo-spin { to { transform: rotate(360deg); } }
@keyframes operation-success-arrive {
  0% { opacity: 0; transform: translate(-50%, 22px) scale(.78); }
  62% { opacity: 1; transform: translate(-50%, -4px) scale(1.045); }
  82% { transform: translate(-50%, 1px) scale(.99); }
  100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
@keyframes operation-mark-pop {
  0% { transform: scale(.35) rotate(-20deg); }
  65% { transform: scale(1.28) rotate(7deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes operation-check-draw { to { stroke-dashoffset: 0; } }
@keyframes operation-mark-ring {
  0% { opacity: .8; transform: scale(.7); }
  100% { opacity: 0; transform: scale(1.8); }
}
@keyframes operation-copy-enter {
  from { opacity: 0; transform: translateX(9px); }
  to { opacity: 1; transform: translateX(0); }
}
@media (max-width: 380px) {
  .operation-status { max-width: calc(100% - 20px); gap: 5px; padding: 0 10px; }
  .operation-message { font-size: .64rem; }
}
@media (prefers-reduced-motion: reduce) {
  .operation-status.pending .operation-logo { animation-duration: 3s; }
  .operation-status.success-animate, .operation-status.success-animate .operation-success-mark,
  .operation-status.success-animate .operation-success-mark::after,
  .operation-status.success-animate .operation-success-copy { animation: none; }
  .operation-success-mark path { animation: none; stroke-dashoffset: 0; }
}

/* ── Nav inferior ── */
#bottom-nav {
  height: var(--nav-h); background: linear-gradient(to right, #4A148C, #7B1FA2);
  display: flex; flex-shrink: 0; z-index: 100;
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; color: rgba(255,255,255,.55);
  font-size: .68rem; font-weight: 600; transition: color .2s; padding: 6px 0;
}
.nav-tab .nav-icon { font-size: 1.35rem; }
.nav-tab.active { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.5); }
.nav-indicator {
  width: 24px; height: 3px; background: #fff; border-radius: 2px; margin-top: 3px;
  opacity: 0; transition: opacity .2s;
}
.nav-tab.active .nav-indicator { opacity: 1; }

/* ── FAB ── */
#fab-btn {
  position: absolute; bottom: calc(var(--nav-h) + 16px); right: 16px;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--morado); color: var(--blanco);
  font-size: 1.6rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--sombra-lg); z-index: 99; transition: transform .12s;
}
#fab-btn:active { transform: scale(.92); }
#fab-btn.hidden { display: none; }

/* ── Botones ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 22px; border-radius: 24px; font-size: .88rem; font-weight: 600;
  transition: opacity .15s, transform .1s; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary   { background: var(--morado); color: var(--blanco); }
.btn-secondary { background: var(--morado-s); color: var(--morado); }
.btn-danger    { background: var(--rojo-s); color: var(--rojo); }
.btn-full      { width: 100%; }
.btn-sm        { padding: 7px 14px; font-size: .8rem; }
.btn-icon {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--morado-s); color: var(--morado);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 700;
}

/* ── Equipo cards (tab Equipos) ── */
.equipo-card {
  display: flex; align-items: center; gap: 14px;
  margin: 8px 16px; padding: 16px;
  background: var(--blanco); border-radius: var(--r); box-shadow: var(--sombra-lg);
  border-left: 5px solid var(--morado); cursor: pointer; transition: transform .12s;
}
.equipo-card:active { transform: scale(.98); background: linear-gradient(135deg, #FAF0FF 0%, #fff 100%); }
.equipo-card .eq-icon {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--morado-s); display: flex; align-items: center;
  justify-content: center; font-size: 1.2rem; flex-shrink: 0;
}
.equipo-card .eq-nombre { font-size: .95rem; font-weight: 700; }
.equipo-card .eq-meta   { font-size: .74rem; color: var(--texto-sec); margin-top: 2px; }
.equipo-card .eq-arrow  { margin-left: auto; color: var(--morado-m); font-size: 1rem; }

/* ── Inicio: perfil entrenador/admin ── */
.equipos-perfil-bloque {
  text-align: center; padding: 28px 16px 22px;
  background: linear-gradient(135deg, #4A148C 0%, #7B1FA2 100%);
  color: #fff;
}
.eq-perfil-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; font-weight: 800; margin: 0 auto 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.eq-perfil-nombre {
  font-size: 1.1rem; font-weight: 800; margin-bottom: 4px;
}
.eq-perfil-email {
  font-size: .76rem; opacity: .8; margin-bottom: 6px;
}
.eq-perfil-rol {
  display: inline-block; font-size: .68rem; font-weight: 700;
  background: rgba(255,255,255,0.2); border-radius: 20px;
  padding: 3px 12px; letter-spacing: .5px; text-transform: uppercase;
}

/* ── Inicio: tarjeta equipo grande ── */
.equipo-card-big {
  margin: 10px 16px;
  background: var(--blanco); border-radius: var(--r); box-shadow: var(--sombra-lg);
  border-left: 5px solid var(--morado); overflow: hidden;
}
.eq-big-hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px 10px;
}
.equipo-card-big .eq-nombre { font-size: 1.05rem; font-weight: 800; color: var(--texto); }
.equipo-card-big .eq-meta   { font-size: .72rem; color: var(--texto-sec); margin-top: 3px; text-transform: uppercase; letter-spacing: .4px; }
.eq-big-stats {
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--borde);
}
.eq-big-stats-row { display: flex; align-items: center; gap: 10px; }
.eq-big-stats-main { flex: 1; min-width: 0; }
.eq-last-label {
  font-size: .7rem; color: var(--texto-sec); margin-bottom: 6px; font-weight: 600;
}
.eq-notifications {
  position: relative; display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px;
  border: 1px solid var(--borde); border-radius: 9px; background: #fff; color: var(--texto-sec);
  font-size: 1.35rem;
}
.eq-notifications:active { background: var(--fondo); }
.eq-notifications-count {
  position: absolute; top: -6px; right: -6px; display: grid; place-items: center;
  min-width: 19px; height: 19px; padding: 0 5px; border: 2px solid #fff; border-radius: 10px;
  background: #F4B400; color: #382900; font-size: .62rem; font-weight: 900; line-height: 1;
}
.eq-no-stats {
  font-size: .75rem; color: var(--texto-sec); font-style: italic;
}
.eq-big-btns {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 10px 14px 14px;
}
.btn-eq-asist, .btn-eq-stats {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 9px 6px; border-radius: 8px; font-size: .74rem; font-weight: 700;
  cursor: pointer; border: none; transition: transform .1s, opacity .1s;
  -webkit-tap-highlight-color: transparent; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.btn-eq-asist:active, .btn-eq-stats:active { transform: scale(.96); opacity: .85; }
.btn-eq-asist { background: var(--morado); color: #fff; }
.btn-eq-stats {
  background: var(--morado-s); color: var(--morado);
  border: 1.5px solid var(--morado-m);
}

/* ── Cabecera coloreada (equipo/sesion) ── */
.vista-header {
  background: var(--morado); color: var(--blanco);
  padding: 16px; margin-bottom: 0;
}
.vista-header h2    { font-size: 1rem; font-weight: 700; }
.vista-header .vh-sub     { font-size: .8rem; opacity: .8; margin-top: 3px; }
.vista-header .vh-horario { font-size: .75rem; opacity: .7; margin-top: 5px; }

/* ── Sesion card ── */
.sesion-card {
  position: relative; display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; transition: background .1s;
}
.sesion-card.sin-registrar { border-left: 3px solid var(--rojo); }
.sesion-card:active { background: var(--morado-xs); }
.sesion-card:last-child { border-bottom: none; }
.sc-fecha {
  width: 44px; text-align: center; flex-shrink: 0;
  background: var(--morado-s); border-radius: 8px; padding: 5px 0;
}
.sc-fecha .dia { font-size: 1.15rem; font-weight: 800; color: var(--morado); line-height: 1; }
.sc-fecha .mes { font-size: .63rem; text-transform: uppercase; color: var(--morado-m); letter-spacing: .4px; }
.sc-info .dia-n { font-size: .88rem; font-weight: 600; }
.sc-info .hora  { font-size: .76rem; color: var(--texto-sec); }
.badge-extra {
  margin-left: auto; font-size: .64rem; background: var(--morado-s);
  color: var(--morado); padding: 2px 8px; border-radius: 10px; font-weight: 700;
}

/* ── Section header ── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 6px;
}
.section-label {
  font-size: .75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .7px; color: var(--texto-sec);
}

/* -- Calendario mensual de entrenamientos -- */
.calendar-wrap { padding: 8px 16px 18px; }
.calendar-weekly {
  margin-bottom: 12px; padding: 11px; border: 1px solid var(--borde);
  border-radius: 10px; background: var(--blanco); box-shadow: 0 2px 8px rgba(0,0,0,.045);
}
.calendar-weekly-heading { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; }
.calendar-weekly-heading h2 { font-size: .88rem; font-weight: 750; }
.calendar-weekly-heading > div > span { display: block; margin-top: 2px; color: var(--texto-sec); font-size: .68rem; }
.calendar-weekly-total { display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--morado-s); color: var(--morado); font-size: .72rem; font-weight: 800; }
.calendar-generate-week {
  display: flex; align-items: center; gap: 5px; margin: 0 0 9px; padding: 4px 0;
  border: 0; background: transparent; color: var(--morado); font-size: .72rem; font-weight: 750;
}
.calendar-generate-week span { font-size: 1rem; line-height: 1; }
.calendar-weekly-list { display: grid; gap: 7px; }
.calendar-weekly-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 62px;
  padding: 8px 10px; border: 1px solid var(--borde); border-left: 3px solid var(--morado-m);
  border-radius: 8px; background: #fff; text-align: left;
  transition: background .15s, transform .15s, box-shadow .15s;
}
.calendar-weekly-item:active:not(:disabled) { background: var(--fondo); transform: translateY(1px); }
.calendar-weekly-item:disabled { opacity: .58; cursor: default; }
.calendar-weekly-item.p, .calendar-weekly-item.registered { border-left-color: var(--verde); }
.calendar-weekly-item.a, .calendar-weekly-item.pending { border-left-color: var(--rojo); }
.calendar-weekly-item.r { border-left-color: #D59000; }
.calendar-weekly-item.unmarked { border-left-color: #A5A5A5; }
.calendar-weekly-item.justified { border-left-color: #147D77; }
.calendar-weekly-date {
  display: grid; place-items: center; flex: 0 0 48px; min-height: 42px;
  padding: 4px; border-radius: 6px; background: var(--fondo);
  color: var(--texto-sec); font-size: .68rem; font-weight: 700; text-align: center; text-transform: capitalize;
}
.calendar-weekly-copy { display: grid; flex: 1; min-width: 0; gap: 2px; }
.calendar-weekly-copy strong { overflow: hidden; color: var(--texto); font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }
.calendar-weekly-copy small { color: var(--texto-sec); font-size: .66rem; }
.calendar-weekly-state { padding: 4px 7px; border-radius: 10px; background: var(--fondo); color: var(--texto-sec); font-size: .62rem; font-weight: 700; white-space: nowrap; }
.calendar-weekly-item.p .calendar-weekly-state, .calendar-weekly-item.registered .calendar-weekly-state { background: var(--verde-s); color: var(--verde); }
.calendar-weekly-item.a .calendar-weekly-state, .calendar-weekly-item.pending .calendar-weekly-state { background: var(--rojo-s); color: var(--rojo); }
.calendar-weekly-item.r .calendar-weekly-state { background: var(--naranja-s); color: var(--naranja); }
.calendar-weekly-item.justified .calendar-weekly-state { background: #E3F2FD; color: #1565C0; }
.calendar-weekly-empty { padding: 12px; border-radius: 8px; background: var(--fondo); color: var(--texto-sec); font-size: .76rem; }
.calendar-month-panel {
  overflow: hidden; border: 1px solid var(--borde); border-radius: 10px;
  background: var(--blanco); box-shadow: 0 2px 8px rgba(0,0,0,.035);
}
.calendar-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 11px 8px;
}
.calendar-nav {
  display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; padding: 0;
  border: 1px solid var(--borde); border-radius: 50%; background: var(--blanco);
  color: var(--morado); font-size: 1.55rem; line-height: 1;
  transition: background .15s, transform .15s;
}
.calendar-nav-icon { display: block; line-height: 1; transform: translateY(-2px); }
.calendar-nav:active { background: var(--morado-s); transform: scale(.94); }
.calendar-month { text-align: center; }
.calendar-month h2 { font-size: 1rem; font-weight: 750; color: var(--texto); }
.calendar-month span { display: block; margin-top: 2px; color: var(--texto-sec); font-size: .72rem; }
.calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.calendar-weekdays { padding: 0 1px 3px; }
.calendar-weekdays span {
  display: grid; place-items: center; height: 23px;
  color: var(--texto-sec); font-size: .68rem; font-weight: 700;
}
.calendar-grid {
  overflow: hidden; border-top: 1px solid var(--borde);
  background: var(--borde); gap: 1px;
}
.calendar-day {
  position: relative; display: flex; flex-direction: column; align-items: center;
  gap: 2px; min-width: 0; height: 44px; padding: 4px 2px 3px;
  background: var(--blanco); color: var(--texto); font-size: .78rem;
  transition: background .15s, color .15s;
}
.calendar-day.outside { background: #F4F4F5; }
.calendar-day.today .calendar-day-number {
  display: grid; place-items: center; width: 23px; height: 23px;
  border-radius: 50%; background: var(--morado-s); color: var(--morado); font-weight: 800;
}
.calendar-day.selected { background: var(--morado); color: var(--blanco); }
.calendar-day.selected .calendar-day-number { color: var(--blanco); }
.calendar-day.selected.today .calendar-day-number { background: rgba(255,255,255,.2); }
.calendar-day-number { min-height: 19px; line-height: 19px; }
.calendar-dots { display: flex; align-items: center; justify-content: center; gap: 3px; height: 5px; }
.calendar-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--morado-m); }
.calendar-dot.p, .calendar-dot.registered { background: var(--verde); }
.calendar-dot.a, .calendar-dot.pending { background: var(--rojo); }
.calendar-dot.r { background: #D59000; }
.calendar-dot.unmarked { background: #A5A5A5; }
.calendar-dot.loading { background: var(--texto-sec); }
.calendar-indicators { position: absolute; top: 3px; right: 4px; display: flex; align-items: center; gap: 3px; }
.calendar-alert { display: grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; background: var(--rojo); color: var(--blanco); font-size: .58rem; font-weight: 900; line-height: 1; }
.calendar-count { color: var(--texto-sec); font-size: .55rem; line-height: 1; }
.calendar-day.selected .calendar-count { color: rgba(255,255,255,.8); }
.calendar-agenda { border-top: 1px solid var(--borde); }
.calendar-agenda-reveal { animation: calendar-agenda-open .26s ease-out both; transform-origin: top; }
.calendar-agenda-inner { padding: 10px 11px 12px; }
.calendar-agenda-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 9px; }
.calendar-kicker { color: var(--texto-sec); font-size: .58rem; font-weight: 800; }
.calendar-agenda-heading h3 { margin-top: 1px; font-size: .91rem; font-weight: 750; }
.calendar-agenda-count { display: block; margin-top: 2px; color: var(--texto-sec); font-size: .66rem; }
.calendar-add-session {
  display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; gap: 5px;
  min-height: 34px; padding: 0 10px; border: 1px solid var(--borde); border-radius: 7px;
  background: var(--blanco); color: var(--morado); font-size: .7rem; font-weight: 750;
}
.calendar-add-session span { font-size: 1rem; line-height: 1; }
@keyframes calendar-agenda-open {
  from { clip-path: inset(0 0 100%); opacity: .35; transform: translateY(-5px); }
  to { clip-path: inset(0); opacity: 1; transform: translateY(0); }
}
.calendar-events { display: grid; gap: 9px; }
.calendar-event {
  display: flex; align-items: center; gap: 11px; width: 100%; min-height: 68px;
  padding: 10px 11px; border: 1px solid var(--borde); border-left: 3px solid var(--morado-m);
  border-radius: 9px; background: var(--blanco); text-align: left;
  box-shadow: 0 2px 7px rgba(0,0,0,.04); transition: background .15s, transform .15s, box-shadow .15s;
}
.calendar-event:active:not(:disabled) { background: var(--fondo); transform: translateY(1px); box-shadow: none; }
.calendar-event:disabled { opacity: .58; cursor: default; }
.calendar-event.p, .calendar-event.registered { border-left-color: var(--verde); }
.calendar-event.a, .calendar-event.pending { border-left-color: var(--rojo); }
.calendar-event.r { border-left-color: #D59000; }
.calendar-event.unmarked { border-left-color: #A5A5A5; }
.calendar-event.justified { border-left-color: #147D77; }
.calendar-event-time {
  display: grid; flex: 0 0 48px; min-height: 44px; align-content: center; justify-items: center;
  gap: 2px; border-radius: 6px; background: var(--fondo); color: var(--texto);
}
.calendar-event-time strong { font-size: .76rem; font-weight: 800; line-height: 1; }
.calendar-event-time small { color: var(--texto-sec); font-size: .62rem; line-height: 1; }
.calendar-event-copy { display: grid; flex: 1; min-width: 0; gap: 4px; }
.calendar-event-copy strong { overflow: hidden; color: var(--texto); font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
.calendar-event-stats { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 2px; font-weight: 700; }
.calendar-event-stats .p { color: var(--verde); }
.calendar-event-stats .a { color: var(--rojo); }
.calendar-event-stats .r { color: #A36B00; }
.calendar-event-status { padding: 4px 7px; border-radius: 10px; background: var(--fondo); color: var(--texto-sec); font-size: .63rem; font-weight: 700; white-space: nowrap; }
.calendar-event.p .calendar-event-status, .calendar-event.registered .calendar-event-status { background: var(--verde-s); color: var(--verde); }
.calendar-event.a .calendar-event-status, .calendar-event.pending .calendar-event-status { background: var(--rojo-s); color: var(--rojo); }
.calendar-event.r .calendar-event-status { background: var(--naranja-s); color: var(--naranja); }
.calendar-event.justified .calendar-event-status { padding: 0; background: transparent; }
.calendar-event-status .justif-badge { margin-left: 0; }
.calendar-event-unjustified { display: inline-flex; align-items: center; gap: 4px; color: var(--rojo); font-weight: 700; }
.calendar-event-arrow { color: var(--texto-sec); font-size: 1.15rem; line-height: 1; }
.session-justif-badge {
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; gap: 3px;
  min-width: 26px; height: 24px; padding: 0 6px; border-radius: 12px;
  background: #FFF0B3; color: #755400; font-size: .68rem; font-weight: 850; line-height: 1;
}
.session-justif-badge span { font-size: .8rem; }
.calendar-empty { padding: 17px 12px; border-radius: 8px; background: #F1F1F2; color: var(--texto-sec); font-size: .78rem; text-align: center; }

/* -- Bandeja de notificaciones -- */
.notification-toolbar { display: flex; justify-content: space-between; gap: 8px; padding: 4px 12px 10px; }
.notification-toolbar button { min-height: 34px; padding: 0 8px; color: var(--morado); font-size: .72rem; font-weight: 750; }
.notification-toolbar button:last-child { color: var(--rojo); }
.notification-list { display: grid; gap: 1px; }
.notification-item {
  display: flex; align-items: center; gap: 6px; min-height: 68px; padding: 8px 10px;
  border-bottom: 1px solid var(--borde); background: #fff; touch-action: pan-y;
}
.notification-item.unread { border-left: 3px solid #F4B400; background: #FFFCF1; }
.notification-open {
  display: flex; align-items: center; flex: 1; min-width: 0; gap: 10px; text-align: left;
}
.notification-icon { display: grid; place-items: center; flex: 0 0 36px; width: 36px; height: 36px; border-radius: 50%; background: #FFF0B3; font-size: 1rem; }
.notification-copy { display: grid; flex: 1; min-width: 0; gap: 3px; }
.notification-copy strong, .notification-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.notification-copy strong { color: var(--texto); font-size: .8rem; }
.notification-copy span { color: var(--texto-sec); font-size: .68rem; }
.notification-unread-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: #F4B400; }
.notification-item.read .notification-unread-dot { background: transparent; }
.notification-action { display: grid; place-items: center; flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; color: var(--morado); font-size: .92rem; }
.notification-action:active { background: var(--fondo); }
.notification-delete { color: var(--rojo); }
.notification-empty { padding: 30px 16px; color: var(--texto-sec); font-size: .82rem; text-align: center; }

/* -- Faltas pendientes en inicio de jugador -- */
.player-unjustified {
  margin: 0 16px 14px; overflow: hidden; border: 1px solid #E8BDBD;
  border-radius: 10px; background: #FFFDFC; box-shadow: 0 2px 7px rgba(120, 20, 20, .06);
}
.player-unjustified-heading {
  display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 12px;
  color: var(--texto); list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.player-unjustified-heading::-webkit-details-marker { display: none; }
.player-unjustified-heading:focus-visible { outline: 2px solid var(--rojo); outline-offset: -3px; }
.player-unjustified-icon {
  display: grid; place-items: center; flex: 0 0 36px; width: 36px; height: 36px;
  border: 1px solid #E8BDBD; border-radius: 9px; background: #FCE9E8;
  color: var(--rojo); font-size: 1.2rem; font-weight: 900; line-height: 1;
}
.player-unjustified-copy { display: grid; flex: 1; min-width: 0; gap: 3px; }
.player-unjustified-copy strong { font-size: .82rem; font-weight: 800; }
.player-unjustified-copy small { color: var(--texto-sec); font-size: .68rem; }
.player-unjustified-count {
  display: grid; place-items: center; flex: 0 0 30px; width: 30px; height: 30px;
  border-radius: 50%; background: var(--rojo); color: #fff; font-size: .78rem; font-weight: 850;
}
.player-unjustified-chevron {
  display: grid; place-items: center; flex: 0 0 20px; width: 20px; height: 20px;
  color: var(--texto-sec); font-size: 1.35rem; line-height: 1; transition: transform .18s ease;
}
.player-unjustified[open] .player-unjustified-chevron { transform: rotate(90deg); }
.player-unjustified-list { display: grid; padding: 0 10px 8px; }
.player-unjustified-item {
  display: flex; align-items: center; gap: 9px; width: 100%; min-height: 58px; padding: 8px 2px;
  border-top: 1px solid #F2E4E2; text-align: left;
}
.player-unjustified-item:active { background: #FFF4F2; }
.player-unjustified-date {
  display: grid; place-items: center; align-content: center; flex: 0 0 38px; width: 38px; height: 40px;
  border-radius: 7px; background: #FCE9E8; color: var(--rojo); line-height: 1;
}
.player-unjustified-date strong { font-size: .88rem; }
.player-unjustified-date small { margin-top: 3px; font-size: .58rem; text-transform: uppercase; }
.player-unjustified-session { display: grid; flex: 1; min-width: 0; gap: 4px; }
.player-unjustified-session strong, .player-unjustified-session small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-unjustified-session strong { color: var(--texto); font-size: .72rem; }
.player-unjustified-session small { color: var(--texto-sec); font-size: .66rem; }
.player-unjustified-state {
  flex: 0 0 auto; padding: 4px 7px; border-radius: 10px; font-size: .61rem; font-weight: 750; white-space: nowrap;
}
.player-unjustified-state.absence { background: #FCE9E8; color: var(--rojo); }
.player-unjustified-state.late { background: var(--naranja-s); color: var(--naranja); }
.player-unjustified-item .calendar-event-arrow { flex: 0 0 auto; }
.player-unjustified-clear {
  display: flex; align-items: center; gap: 8px; margin: 0 16px 14px; padding: 11px 13px;
  border: 1px solid #CFE3D1; border-radius: 9px; background: #F4FAF4; color: var(--verde);
  font-size: .74rem; font-weight: 700;
}
.player-unjustified-clear span { font-size: .92rem; }

@media (max-width: 360px) {
  .calendar-wrap { padding-right: 12px; padding-left: 12px; }
  .calendar-weekly { padding: 10px; }
  .calendar-weekly-item { gap: 7px; padding-right: 7px; padding-left: 7px; }
  .calendar-weekly-date { flex-basis: 42px; }
  .calendar-weekly-state { max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
  .calendar-day { height: 40px; }
  .calendar-agenda-inner { padding-right: 8px; padding-left: 8px; }
  .calendar-add-session { gap: 3px; padding: 0 7px; font-size: .64rem; }
  .calendar-event { gap: 7px; padding-right: 7px; padding-left: 8px; }
  .calendar-event-time { flex-basis: 42px; }
  .calendar-event-status { max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
}

@media (prefers-reduced-motion: reduce) {
  .calendar-agenda-reveal { animation: none; }
}

/* ── Asistencia: jugador card ── */
.jug-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; user-select: none; transition: all 0.2s ease;
}
.jug-card:last-child { border-bottom: none; }
.jug-dorsal {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--borde); color: var(--texto-sec);
  display: flex; align-items: center; justify-content: center;
  font-size: .78rem; font-weight: 700; flex-shrink: 0;
  transition: background .15s, color .15s;
}
.jug-nombre { font-size: .88rem; font-weight: 600; }
.jug-tipo   { font-size: .7rem; color: var(--texto-sec); }
.jug-justif-aviso { font-size: .68rem; color: #E65100; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.estado-chip {
  margin-left: auto; width: 36px; height: 36px; border-radius: 50%;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700;
  background: var(--borde); color: var(--texto-sec);
  transition: background .15s, color .15s;
}
.jug-card.P { background: var(--verde-s); }
.jug-card.P .jug-dorsal  { background: var(--verde); color: #fff; }
.jug-card.P .estado-chip  { background: var(--verde); color: #fff; }
.jug-card.A { background: var(--rojo-s); }
.jug-card.A .jug-dorsal  { background: var(--rojo); color: #fff; }
.jug-card.A .estado-chip  { background: var(--rojo); color: #fff; }
.jug-card.R { background: var(--naranja-s); }
.jug-card.R .jug-dorsal  { background: var(--naranja); color: #fff; }
.jug-card.R .estado-chip  { background: var(--naranja); color: #fff; }

/* ── 4b: Sesión guardada — tarjetas de solo lectura ── */
.jug-ro-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--borde);
}
.jug-ro-card:last-child { border-bottom: none; }
.jug-ro-card.P { background: var(--verde-s); }
.jug-ro-card.P .jug-dorsal  { background: var(--verde); color: #fff; }
.jug-ro-card.P .estado-chip  { background: var(--verde); color: #fff; }
.jug-ro-card.A { background: var(--rojo-s); }
.jug-ro-card.A .jug-dorsal  { background: var(--rojo); color: #fff; }
.jug-ro-card.A .estado-chip  { background: var(--rojo); color: #fff; }
.jug-ro-card.R { background: var(--naranja-s); }
.jug-ro-card.R .jug-dorsal  { background: var(--naranja); color: #fff; }
.jug-ro-card.R .estado-chip  { background: var(--naranja); color: #fff; }
.sin-justif-chip {
  display: inline-flex; align-items: center; gap: 3px;
  background: #FFF3E0; color: #E65100;
  font-size: .62rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; flex-shrink: 0;
}

/* ── 4a: Credenciales — aviso admin ── */
.cred-aviso-box {
  display: flex; gap: 10px; align-items: flex-start;
  background: #FFF8E1; border: 1px solid #FFD54F; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 14px;
}
.cred-aviso-box .cred-aviso-icon { font-size: 1.2rem; flex-shrink: 0; }
.cred-aviso-box strong { font-size: .82rem; color: #5D4037; display: block; margin-bottom: 6px; }
.cred-aviso-box p { font-size: .74rem; color: #6D4C41; margin: 3px 0; }
.cred-aviso-box p strong { display: inline; margin-bottom: 0; }

/* ── Toggle entrenador ── */
.ent-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--borde);
}
.ent-row:last-child { border-bottom: none; }
.ent-nombre { flex: 1; font-size: .88rem; font-weight: 500; }
.ent-sub    { font-size: .72rem; color: var(--texto-sec); }
.toggle-sw  { position: relative; width: 44px; height: 24px; flex-shrink: 0; margin-left: auto; }
.toggle-sw input { display: none; }
.toggle-sl {
  position: absolute; inset: 0; background: #BDBDBD; border-radius: 12px;
  cursor: pointer; transition: background .18s;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
}
.toggle-sl::after {
  content: ''; position: absolute; width: 18px; height: 18px;
  left: 3px; top: 3px; background: #fff; border-radius: 50%;
  transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.toggle-sw input:checked + .toggle-sl { background: var(--morado); }
.toggle-sw input:checked + .toggle-sl::after { transform: translateX(20px); }

/* ── Gestion cards ── */
.gestion-card {
  display: flex; align-items: center; gap: 16px;
  margin: 8px 16px; padding: 18px 16px;
  background: var(--blanco); border-radius: var(--r); box-shadow: var(--sombra-lg);
  border-left: 3px solid var(--morado-s); cursor: pointer; transition: transform .12s;
}
.gestion-card:active { transform: scale(.98); }
.gestion-icon {
  width: 52px; height: 52px; background: linear-gradient(135deg, #4A148C, #7B1FA2); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.45rem; color: #fff; flex-shrink: 0;
}
.gestion-label { font-size: .93rem; font-weight: 700; }
.gestion-desc  { font-size: .74rem; color: var(--texto-sec); margin-top: 2px; }
.gestion-arrow { margin-left: auto; color: var(--borde); font-size: 1rem; }

/* ── Formularios ── */
.form-section { padding: 20px 16px 8px; }
.form-section-title {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--morado); margin-bottom: 14px;
}
.form-group { margin-bottom: 14px; }
.form-group label {
  display: block; font-size: .76rem; color: var(--texto-sec);
  margin-bottom: 5px; font-weight: 600;
}
.form-group input,
.form-group select {
  width: 100%; padding: 10px 12px;
  background: var(--fondo); border: 1.5px solid var(--borde);
  border-radius: 8px; font-size: .9rem; color: var(--texto);
  outline: none; transition: border-color .18s;
}
.form-group input:focus,
.form-group select:focus { border-color: var(--morado); background: var(--blanco); }
.form-group input:disabled { opacity: .6; cursor: not-allowed; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* ── Horario chips ── */
.dia-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.dia-chip {
  padding: 6px 11px; border-radius: 20px; font-size: .78rem; font-weight: 700;
  border: 1.5px solid var(--borde); background: var(--blanco); color: var(--texto-sec);
  cursor: pointer; transition: all .14s;
}
.dia-chip.sel { background: var(--morado); border-color: var(--morado); color: var(--blanco); }
.horario-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--borde);
}
.horario-row:last-child { border-bottom: none; }
.horario-dia { width: 36px; font-size: .8rem; font-weight: 700; color: var(--morado); flex-shrink: 0; }
.horario-row input[type="time"] {
  flex: 1; padding: 7px 9px; border: 1.5px solid var(--borde);
  border-radius: 7px; font-size: .84rem; background: var(--fondo); outline: none;
}
.horario-row input[type="time"]:focus { border-color: var(--morado); }

/* ── Lista asignados (form equipo) ── */
.asig-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--borde);
}
.asig-item:last-child { border-bottom: none; }
.asig-info { flex: 1; }
.asig-nombre { font-size: .87rem; font-weight: 600; }
.asig-sub    { font-size: .72rem; color: var(--texto-sec); }
.btn-rm {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--rojo-s); color: var(--rojo);
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem; flex-shrink: 0; cursor: pointer;
}

/* ── Lista admin ── */
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; transition: background .1s;
}
.list-item:active { background: var(--morado-xs); }
.list-item:last-child { border-bottom: none; }
.li-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: radial-gradient(circle, #7B1FA2, #4A148C); display: flex; align-items: center;
  justify-content: center; font-size: .83rem; font-weight: 800;
  color: #fff; flex-shrink: 0;
}
.li-name  { font-size: .93rem; font-weight: 700; }
.li-sub   { font-size: .7rem; color: var(--morado); background: var(--morado-s); border-radius: 10px; padding: 2px 8px; display: inline-block; margin-top: 3px; }
.li-arrow { margin-left: auto; color: var(--borde); font-size: 1rem; }

/* ── Buscador modal ── */
.search-wrap { padding: 12px 16px 8px; position: sticky; top: 0; background: var(--blanco); z-index: 1; }
.search-wrap input {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--borde);
  border-radius: 24px; font-size: .9rem; outline: none;
}
.search-wrap input:focus { border-color: var(--morado); }
.sr-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--borde); cursor: pointer;
}
.sr-item:active { background: var(--morado-xs); }
.sr-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--morado-s); display: flex; align-items: center;
  justify-content: center; font-size: .82rem; font-weight: 700;
  color: var(--morado); flex-shrink: 0;
}
.sr-name { font-size: .88rem; font-weight: 600; }
.sr-sub  { font-size: .73rem; color: var(--texto-sec); }
.sr-create {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; color: var(--morado); font-weight: 700;
  font-size: .88rem; cursor: pointer; border-top: 2px solid var(--borde); margin-top: 4px;
}

/* ── Selector tipo jugador ── */
.tipo-selector { display: flex; gap: 8px; margin-top: 8px; }
.tipo-opt {
  flex: 1; padding: 9px; border-radius: 8px; text-align: center;
  font-size: .82rem; font-weight: 600; cursor: pointer;
  border: 1.5px solid var(--borde); color: var(--texto-sec); transition: all .14s;
}
.tipo-opt.sel { background: var(--morado); border-color: var(--morado); color: var(--blanco); }

/* ── Modal bottom sheet ── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 200;
  display: flex; align-items: flex-end; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
#modal-overlay.open { opacity: 1; pointer-events: all; }
#modal-sheet {
  width: 100%; max-width: 480px; margin: 0 auto;
  background: var(--blanco); border-radius: 20px 20px 0 0;
  max-height: 80vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
}
#modal-overlay.open #modal-sheet { transform: translateY(0); }
.modal-handle {
  width: 36px; height: 4px; background: var(--borde);
  border-radius: 2px; margin: 10px auto 0; flex-shrink: 0;
}
.modal-hdr {
  padding: 12px 16px 10px; border-bottom: 1px solid var(--borde);
  display: flex; align-items: center; flex-shrink: 0;
}
.modal-hdr h3 { flex: 1; font-size: .97rem; font-weight: 700; }
.modal-x {
  width: 30px; height: 30px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; color: var(--texto-sec); cursor: pointer;
}
.modal-body { overflow-y: auto; flex: 1; }

/* ── Loading / Toast ── */
#loading-overlay {
  position: fixed; inset: 0; background: rgba(10, 0, 30, 0.82); z-index: 300;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
@supports (backdrop-filter: blur(4px)) {
  #loading-overlay { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
}
#loading-overlay.hidden { display: none; }
.loading-ball-wrap {
  animation: bb-bounce 0.85s ease-in-out infinite alternate;
}
.loading-ball {
  display: inline-block;
  animation: bb-spin 2.8s linear infinite;
  filter: drop-shadow(0 12px 26px rgba(0,0,0,0.5));
}
.loading-logo-img {
  width: 88px; height: 88px; border-radius: 50%; display: block;
}
@keyframes bb-bounce {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-22px); }
}
@keyframes bb-spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes pulse {
  0%   { opacity: 0.55; }
  100% { opacity: 1; }
}
#loading-msg { font-size: .95rem; font-weight: 600; color: rgba(255,255,255,.88); text-align: center; letter-spacing: .03em; }

#toast-container {
  position: fixed; bottom: calc(var(--nav-h) + 12px); left: 50%;
  transform: translateX(-50%); z-index: 400; width: 90%; max-width: 400px;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;
}
.toast {
  background: #1A1A1A; color: #fff; padding: 9px 18px; border-radius: 24px;
  font-size: .83rem; box-shadow: 0 4px 12px rgba(0,0,0,.2); animation: ti .18s ease;
}
.toast.success { background: var(--verde); }
.toast.error   { background: var(--rojo); }
.toast.out     { animation: to .25s ease forwards; }
@keyframes ti { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@keyframes to { to   { opacity:0; transform:translateY(6px); } }

/* ── Confirm modals ── */
.modal-confirm-icon {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px; font-size: 28px;
}
.modal-confirm-danger .modal-confirm-icon  { background: var(--rojo-s); color: var(--rojo); }
.modal-confirm-warning .modal-confirm-icon { background: #FEF3C7; color: #F59E0B; }
.modal-confirm-msg { font-size: .9rem; text-align: center; padding: 0 8px; color: var(--texto-sec); }
.modal-confirm-msg strong { color: var(--texto); }
.btn-destructive { background: var(--rojo); color: #fff; flex: 1; }

/* ── Stats de sesiones ── */
.sc-status-badge {
  font-size: .65rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; white-space: nowrap;
}
.sc-status-badge.registrada { background: var(--verde-s); color: var(--verde); }
.sc-status-badge.pendiente {
  width: 18px; height: 18px; border-radius: 50%; background: var(--rojo); color: #fff;
  font-size: .75rem; font-weight: 900; display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.sc-stats { font-size: .68rem; color: var(--texto-sec); margin-top: 3px; }

/* ── Historial por mes ── */
.historial-mes-hdr {
  padding: 10px 16px 4px; font-size: .72rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px; color: var(--morado);
  background: var(--morado-xs); border-bottom: 1px solid var(--morado-s);
}

/* ── Utilidades ── */
.hidden  { display: none !important; }
.divider { border: none; border-top: 1px solid var(--borde); margin: 0; }
.p-16    { padding: 16px; }
.mt-8    { margin-top: 8px; }
.mt-16   { margin-top: 16px; }
.empty-state { text-align: center; padding: 48px 24px; color: var(--texto-sec); }
.empty-state .ei { font-size: 2.8rem; margin-bottom: 12px; }
.empty-state p   { font-size: .88rem; }

/* ── Vistas detalle ── */
.detalle-perfil {
  background: linear-gradient(135deg, #4A148C, #7B1FA2);
  color: #fff; padding: 24px 20px 28px;
  display: flex; align-items: center; gap: 18px;
}
.detalle-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(255,255,255,.2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.85rem; font-weight: 800;
  border: 3px solid rgba(255,255,255,.35);
}
.detalle-nombre { font-size: 1.05rem; font-weight: 800; }
.detalle-sub    { font-size: .79rem; opacity: .82; margin-top: 4px; }
.detalle-meta   { font-size: .72rem; opacity: .65; margin-top: 3px; }
.detalle-perfil-copy { flex: 1; min-width: 0; }
.detalle-settings {
  display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px;
  margin-left: auto; border: 1px solid rgba(255,255,255,.42); border-radius: 50%;
  background: rgba(255,255,255,.16); color: #fff; font-size: 1.2rem; line-height: 1;
  transition: background .15s, transform .15s;
}
.detalle-settings:active { background: rgba(255,255,255,.3); transform: scale(.94); }
.detalle-settings:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* Grids de widgets */
.stat-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px 0; }
.stat-grid-1 { padding: 10px 16px 0; }
.stat-widget {
  background: #fff; border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.09); padding: 14px 16px;
}
.stat-widget-title {
  font-size: .66rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--texto-sec); margin-bottom: 8px;
}
.stat-valor { font-size: 2.1rem; font-weight: 900; line-height: 1; }
.stat-label { font-size: .72rem; color: var(--texto-sec); margin-top: 4px; }
.stat-valor.verde   { color: #2E7D32; }
.stat-valor.rojo    { color: #C62828; }
.stat-valor.azul    { color: #1565C0; }
.stat-valor.naranja { color: #E65100; }

/* Barras */
.bar-wrap { margin-top: 4px; }
.bar-row  { margin-bottom: 10px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-label-row { display: flex; justify-content: space-between; font-size: .74rem; margin-bottom: 5px; }
.bar-label-row .bar-name { font-weight: 600; }
.bar-label-row .bar-val  { color: var(--texto-sec); }
.bar-track { height: 8px; background: var(--fondo); border-radius: 4px; overflow: hidden; }
.bar-fill  { height: 100%; border-radius: 4px; transition: width .4s ease; }

/* Tags / ranking */
.detalle-equipo-tag {
  display: inline-flex; align-items: center;
  background: var(--morado-s); color: var(--morado);
  border-radius: 20px; padding: 5px 12px;
  font-size: .75rem; font-weight: 700; margin: 3px 3px 3px 0;
}
.ranking-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--borde);
}
.ranking-row:last-child { border-bottom: none; }
.ranking-num  { width: 20px; font-size: .73rem; font-weight: 800; color: var(--texto-sec); text-align: center; }
.ranking-name { flex: 1; font-size: .85rem; font-weight: 600; }
.ranking-val  { font-size: .82rem; font-weight: 700; }

/* Botón editar en header */
#btn-edit {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,.2); color: var(--blanco);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; cursor: pointer; transition: background .15s;
}
#btn-edit:active { background: rgba(255,255,255,.35); }
#btn-edit.hidden { display: none !important; }

/* ── Vista de Login ── */
#view-login {
  background: linear-gradient(135deg, #4A148C 0%, #1a0236 100%);
  min-height: 100%;
  /* CAMBIO: Quitamos 'display: flex' de aquí para que la app pueda ocultarlo */
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  position: absolute;
  inset: 0;
  z-index: 150;
  overflow-y: auto;
}

/* LÍNEA NUEVA: Solo se muestra en modo flex si tiene la clase active */
#view-login.active {
  display: flex;
}

.login-container {
  width: 100%;
  max-width: 340px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--r-lg);
  padding: 36px 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  text-align: center;
  margin: auto;
}

.login-logo {
  margin-bottom: 12px;
  animation: bb-bounce 0.85s ease-in-out infinite alternate;
  display: inline-block;
}
.login-logo-img {
  width: 88px; height: 88px; border-radius: 50%;
  transition: transform 0.4s cubic-bezier(.34,1.56,.64,1);
  cursor: default;
}
.login-logo-img:hover {
  transform: scale(1.18) rotate(-15deg);
}

.login-title {
  color: #fff;
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  margin-bottom: 4px;
}

.login-subtitle {
  color: rgba(255,255,255,0.65);
  font-size: 0.85rem;
  margin-bottom: 24px;
}

.btn-login {
  background: #fff;
  color: var(--morado) !important;
  font-weight: 800;
  width: 100%;
  margin-top: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  border-radius: 24px;
}

.btn-login:active {
  background: var(--morado-s);
  transform: scale(0.98);
}


/* ══════════════════════════════════════════════
   NUEVOS ESTILOS — Sistema de 4 roles (v2)
   ══════════════════════════════════════════════ */

/* ── 3c-1: Login toggle tabs ── */
.login-tabs {
  display: flex; gap: 4px; margin: 16px 0 4px;
  background: rgba(255,255,255,.1); border-radius: 24px; padding: 4px;
}
.login-tab {
  flex: 1; padding: 9px 6px; border-radius: 20px;
  font-size: .78rem; font-weight: 700; color: rgba(255,255,255,.6);
  transition: all .18s; white-space: nowrap;
}
.login-tab.active {
  background: #fff; color: var(--morado);
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}

/* ── 3c-2: Badge admin en lista de entrenadores ── */
.badge-admin {
  display: inline-flex; align-items: center; gap: 3px;
  background: #1a237e; color: #fff;
  font-size: .6rem; font-weight: 800; padding: 2px 7px;
  border-radius: 10px; text-transform: uppercase; letter-spacing: .4px;
  flex-shrink: 0;
}

/* ── 3c-3: Chip Visor en tarjetas de equipo ── */
.chip-visor {
  display: inline-flex; align-items: center; gap: 4px;
  background: #E3F2FD; color: #1565C0;
  font-size: .63rem; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; margin-left: auto; flex-shrink: 0;
}

/* ── 4d: Chip Mi equipo en lista gestión ── */
.chip-mi-equipo {
  display: inline-flex; align-items: center; gap: 4px;
  background: #E8F5E9; color: #2E7D32;
  font-size: .63rem; font-weight: 700; padding: 2px 8px;
  border-radius: 10px; margin-left: auto; flex-shrink: 0;
}

/* ── 3c-4: Mini-stats en tarjetas de equipo ── */
.eq-stats {
  display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap;
}
.eq-stat-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 7px; border-radius: 10px;
  font-size: .63rem; font-weight: 700;
}
.eq-stat-chip.p { background: var(--verde-s); color: var(--verde); }
.eq-stat-chip.a { background: var(--rojo-s);  color: var(--rojo); }
.eq-stat-chip.r { background: var(--naranja-s); color: var(--naranja); }
.eq-stat-chip .dot {
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}

/* ── 3c-5: Sesiones del jugador coloreadas por estado propio ── */
.sesion-jug-card {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; transition: background .1s; position: relative;
}
.sesion-jug-card:last-child { border-bottom: none; }
.sesion-jug-card:active { background: var(--morado-xs); }
.sesion-jug-card.estado-P { border-left: 4px solid var(--verde); }
.sesion-jug-card.estado-A { border-left: 4px solid var(--rojo); background: var(--rojo-s); }
.sesion-jug-card.estado-R { border-left: 4px solid var(--naranja); background: var(--naranja-s); }
.sesion-jug-card.estado-sin { border-left: 4px solid var(--borde); }
.sjc-estado {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .8rem; font-weight: 800;
}
.sjc-estado.P { background: var(--verde); color: #fff; }
.sjc-estado.A { background: var(--rojo);  color: #fff; }
.sjc-estado.R { background: var(--naranja); color: #fff; }
.sjc-estado.sin { background: var(--borde); color: var(--texto-sec); font-size: .65rem; }

/* ── 3c-6: Indicador justificación enviada ── */
.justif-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: #E3F2FD; color: #1565C0;
  font-size: .62rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; margin-left: auto; flex-shrink: 0;
}
.justif-badge::before { content: '✓'; font-size: .7rem; }
.btn-justificar {
  margin-left: auto; padding: 6px 13px; border-radius: 20px;
  background: var(--naranja-s); color: var(--naranja);
  font-size: .76rem; font-weight: 700; border: 1.5px solid var(--naranja);
  flex-shrink: 0; transition: opacity .15s;
}
.btn-justificar:active { opacity: .7; }

/* ── 3c-7: Modal de justificación ── */
.modal-justif-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 210;
  display: flex; align-items: flex-end; justify-content: center;
  transition: opacity .2s;
}
.modal-justif-overlay.hidden { opacity: 0; pointer-events: none; }
.modal-justif-overlay:not(.hidden) { opacity: 1; pointer-events: all; }
.modal-justif-sheet {
  width: 100%; max-width: 480px;
  background: var(--blanco); border-radius: 20px 20px 0 0;
  max-height: 92vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.modal-justif-overlay:not(.hidden) .modal-justif-sheet { transform: translateY(0); }
.modal-justif-sheet .modal-body { padding: 12px 16px 32px; overflow-y: auto; }
.radio-group { display: flex; gap: 10px; margin-top: 6px; }
.radio-opt {
  flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 10px;
  font-size: .85rem; font-weight: 600; transition: all .15s;
}
.radio-opt:has(input:checked) { border-color: var(--morado); background: var(--morado-s); color: var(--morado); }
.radio-opt input { accent-color: var(--morado); }
.justif-preview-wrap {
  background: var(--fondo); border-radius: 10px; padding: 12px;
  margin: 4px 0 14px; border-left: 3px solid var(--morado);
}
.justif-preview-label { font-size: .7rem; font-weight: 700; color: var(--texto-sec); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
.justif-preview { font-size: .82rem; color: var(--texto); line-height: 1.5; min-height: 36px; white-space: pre-wrap; }
.form-group textarea {
  width: 100%; padding: 10px 12px;
  background: var(--fondo); border: 1.5px solid var(--borde);
  border-radius: 8px; font-size: .9rem; color: var(--texto);
  outline: none; resize: none; transition: border-color .18s; font-family: inherit;
}
.form-group textarea:focus { border-color: var(--morado); background: var(--blanco); }

/* ── 3c-8: Vista perfil jugador y ajustes cuenta ── */
.perfil-jugador-container { padding: 24px 16px 20px; }
.perfil-avatar {
  width: 88px; height: 88px; border-radius: 50%;
  background: linear-gradient(135deg, #4A148C, #7B1FA2);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; margin: 0 auto 12px; box-shadow: var(--sombra-lg);
}
.perfil-nombre {
  text-align: center; font-size: 1.15rem; font-weight: 800;
  color: var(--texto); margin-bottom: 4px;
}
.perfil-equipo {
  text-align: center; font-size: .78rem; color: var(--morado);
  background: var(--morado-s); border-radius: 20px;
  padding: 3px 12px; display: inline-block; margin: 0 auto 20px;
  left: 50%; position: relative; transform: translateX(-50%);
}
/* ── 4e-2: 3 botones horizontales navegación perfil ── */
.perfil-home-actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.perfil-nav-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px;
  padding: 10px 14px; border-radius: var(--r);
  background: var(--blanco); box-shadow: var(--sombra-lg);
  border: 1.5px solid var(--borde); transition: transform .12s, box-shadow .12s;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.perfil-nav-btn:active { transform: scale(.96); box-shadow: var(--sombra); }
.perfil-nav-icon  { font-size: 1.3rem; line-height: 1; }
.perfil-nav-label { font-size: .8rem; font-weight: 700; color: var(--texto); text-align: left; line-height: 1.25; }
.perfil-home-arrow { margin-left: auto; color: var(--texto-sec); font-size: 1.2rem; line-height: 1; }

/* ── 4e-4: Ranking asistencia (mi-equipo) ── */
.ranking-medal { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
.ranking-pos   { width: 22px; text-align: center; font-size: .76rem; font-weight: 800; color: var(--texto-sec); flex-shrink: 0; }
.ranking-yo    { background: var(--morado-s); border-radius: 8px; padding: 9px 8px; margin: 2px -8px; }
