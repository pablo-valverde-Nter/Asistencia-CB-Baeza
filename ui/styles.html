.sjc-estado.P { background: var(--verde); color: var(--on-accent); }
.sjc-estado.A { background: var(--rojo);  color: var(--on-accent); }
.sjc-estado.R { background: var(--naranja); color: var(--on-accent); }
.sjc-estado.sin { background: var(--borde); color: var(--texto-sec); font-size: .65rem; }

/* ── 3c-6: Indicador justificación enviada ── */
.justif-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--verde-s); color: var(--morado);
  font-size: .62rem; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; margin-left: auto; flex-shrink: 0;
}
.justif-badge::before { content: '✓'; font-size: .7rem; }
.btn-justificar {
  margin-left: auto; padding: 6px 13px; border-radius: 20px;
  background: var(--naranja-s); color: var(--naranja);
  font-size: .76rem; font-weight: 700; border: 1.5px solid var(--naranja);
  flex-shrink: 0; transition: opacity .15s;
}
.btn-justificar:active { opacity: .7; }

/* ── 3c-7: Modal de justificación ── */
.modal-justif-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 210;
  display: flex; align-items: flex-end; justify-content: center;
  transition: opacity .2s;
}
.modal-justif-overlay.hidden { opacity: 0; pointer-events: none; }
.modal-justif-overlay:not(.hidden) { opacity: 1; pointer-events: all; }
.modal-justif-sheet {
  width: 100%; max-width: 480px;
  background: var(--blanco); border-radius: 20px 20px 0 0;
  max-height: 92vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .22s cubic-bezier(.4,0,.2,1);
}
.modal-justif-overlay:not(.hidden) .modal-justif-sheet { transform: translateY(0); }
.modal-justif-sheet .modal-body { padding: 12px 16px 32px; overflow-y: auto; }
.radio-group { display: flex; gap: 10px; margin-top: 6px; }
.radio-opt {
  flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 10px;
  font-size: .85rem; font-weight: 600; transition: all .15s;
}
.radio-opt:has(input:checked) { border-color: var(--morado); background: var(--morado-s); color: var(--morado); }
.radio-opt input { accent-color: var(--morado); }
.justif-preview-wrap {
  background: var(--fondo); border-radius: 10px; padding: 12px;
  margin: 4px 0 14px; border-left: 3px solid var(--morado);
}
.justif-preview-label { font-size: .7rem; font-weight: 700; color: var(--texto-sec); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
.justif-preview { font-size: .82rem; color: var(--texto); line-height: 1.5; min-height: 36px; white-space: pre-wrap; }
.form-group textarea {
  width: 100%; padding: 10px 12px;
  background: var(--fondo); border: 1.5px solid var(--borde);
  border-radius: 8px; font-size: .9rem; color: var(--texto);
  outline: none; resize: none; transition: border-color .18s; font-family: inherit;
}
.form-group textarea:focus { border-color: var(--morado); background: var(--blanco); }

/* ── 3c-8: Vista perfil jugador y ajustes cuenta ── */
.perfil-jugador-container { padding: 24px 16px 20px; }
.perfil-avatar {
  width: 88px; height: 88px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-bg), var(--brand-bg));
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; margin: 0 auto 12px; box-shadow: var(--sombra-lg);
}
.perfil-nombre {
  text-align: center; font-size: 1.15rem; font-weight: 800;
  color: var(--texto); margin-bottom: 4px;
}
.perfil-equipo {
  text-align: center; font-size: .78rem; color: var(--morado);
  background: var(--morado-s); border-radius: 20px;
  padding: 3px 12px; display: inline-block; margin: 0 auto 20px;
  left: 50%; position: relative; transform: translateX(-50%);
}
/* ── 4e-2: 3 botones horizontales navegación perfil ── */
.perfil-home-actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.perfil-nav-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px;
  padding: 10px 14px; border-radius: var(--r);
  background: var(--blanco); box-shadow: var(--sombra-lg);
  border: 1.5px solid var(--borde); transition: transform .12s, box-shadow .12s;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.perfil-nav-btn:active { transform: scale(.96); box-shadow: var(--sombra); }
.perfil-nav-icon  { font-size: 1.3rem; line-height: 1; }
.perfil-nav-label { font-size: .8rem; font-weight: 700; color: var(--texto); text-align: left; line-height: 1.25; }
.perfil-home-arrow { margin-left: auto; color: var(--texto-sec); font-size: 1.2rem; line-height: 1; }

/* ── 4e-4: Ranking asistencia (mi-equipo) ── */
.ranking-medal { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
.ranking-pos   { width: 22px; text-align: center; font-size: .76rem; font-weight: 800; color: var(--texto-sec); flex-shrink: 0; }
.ranking-yo { box-shadow: 0 0 0 2px var(--brand-bg),0 5px 16px var(--shadow-color); }
.ranking-row.ranking-yo { border-radius: 12px; padding: 10px 8px; margin: 3px 0; background: var(--fondo); }
.ranking-bar-wrap { height: 6px; background: var(--fondo); border-radius: 4px; overflow: hidden; margin: 7px 0; }
.ranking-bar-fill { height: 100%; background: linear-gradient(90deg,var(--morado-m),var(--stats-positive)); border-radius: 4px; transition: width .4s ease; }
.ranking-val, .ranking-val.verde, .ranking-val.rojo, .ranking-val.naranja { color: var(--morado); }

/* Bloque estado sesión (vista detalle jugador) */
.sesion-estado-bloque {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 16px; border-bottom: 1px solid var(--borde);
}
.sesion-estado-icono {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; font-weight: 900; flex-shrink: 0;
}
.sesion-estado-icono.P { background: var(--verde-s); color: var(--verde); }
.sesion-estado-icono.A { background: var(--rojo-s);  color: var(--rojo); }
.sesion-estado-icono.R { background: var(--naranja-s); color: var(--naranja); }
.sesion-estado-icono.sin { background: var(--fondo); color: var(--texto-sec); font-size: 1.2rem; }
.sesion-estado-texto { font-size: .95rem; font-weight: 700; }
.sesion-estado-sub   { font-size: .78rem; color: var(--texto-sec); margin-top: 3px; }

/* ── 5a: Mini-stats entrenadores en lista ── */
.ent-mini-stats {
  display: flex; flex-direction: row; align-items: center;
  gap: 6px; margin-right: 2px;
}
.ems-frac { display: flex; align-items: baseline; gap: 1px; }
.ems-big { font-size: 1.15rem; font-weight: 900; color: var(--morado); }
.ems-de  { font-size: .62rem; font-weight: 700; color: var(--texto-sec); }
.ems-pct { font-size: 1.15rem; font-weight: 900; color: var(--morado); }
.ems-val { font-size: .88rem; font-weight: 800; color: var(--morado); line-height: 1; }
.ems-lab { font-size: .6rem; color: var(--texto-sec); text-align: center; margin-top: 2px; }

/* ── 5b: Tarjeta equipo ampliada ── */
.eq-card {
  display: flex; flex-direction: column;
  padding: 14px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; transition: background .1s;
}
.eq-card:active { background: var(--morado-xs); }
.eq-card:last-child { border-bottom: none; }
.eq-card-hdr { display: flex; align-items: center; gap: 12px; }
.eq-card-body { margin-top: 8px; padding-left: 52px; }
.eq-card-stats { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.eq-card-stat { font-size: .72rem; color: var(--texto-sec); }
.eq-card-stat strong { color: var(--texto); font-weight: 800; }
.eq-pct-bar-wrap { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.eq-pct-bar { flex: 1; height: 5px; background: var(--fondo); border-radius: 3px; overflow: hidden; }
.eq-pct-fill { height: 100%; border-radius: 3px; background: var(--brand-bg); transition: width .4s; }
.eq-pct-label { font-size: .68rem; font-weight: 800; color: var(--morado); min-width: 32px; }

/* ── 5c: Agrupación jugadores por equipo ── */
.grp-header {
  padding: 9px 16px 6px; background: var(--fondo);
  border-bottom: 1px solid var(--borde);
  border-top: 1px solid var(--borde);
}
.grp-header:first-child { border-top: none; }
.grp-header-nombre { font-size: .8rem; font-weight: 800; color: var(--morado); }
.grp-header-sub { font-size: .67rem; color: var(--texto-sec); margin-top: 1px; }

/* mini-stats jugador en lista */
.jug-list-stats {
  display: flex; flex-direction: row; align-items: center;
  gap: 6px; margin-right: 2px;
}
.jls-frac { display: flex; align-items: baseline; gap: 1px; }
.jls-big { font-size: 1.15rem; font-weight: 900; }
.jls-big.verde { color: var(--morado); }
.jls-big.naranja { color: var(--naranja); }
.jls-big.rojo    { color: var(--rojo); }
.jls-big.sec     { color: var(--texto-sec); }
.jls-de  { font-size: .62rem; font-weight: 700; color: var(--texto-sec); }
.jug-list-alertas { margin-top: 5px; }
.jug-list-alertas .alerta-chip { max-width: 100%; font-size: .62rem; white-space: normal; }
.jls-pct { font-size: 1.15rem; font-weight: 900; }
.jls-pct.verde { color: var(--morado); }
.jls-pct.naranja { color: var(--naranja); }
.jls-pct.rojo    { color: var(--rojo); }
.jls-pct.sec     { color: var(--texto-sec); }
.jls-val { font-size: .85rem; font-weight: 800; line-height: 1; }
.jls-val.verde { color: var(--morado); }
.jls-val.naranja { color: var(--naranja); }
.jls-val.rojo    { color: var(--rojo); }
.jls-val.sec     { color: var(--texto-sec); }
.jls-lab { font-size: .6rem; color: var(--texto-sec); text-align: center; margin-top: 2px; }

/* ── 5d: Vista sesiones — subtítulo ── */
.sesiones-desc { font-size: .76rem; color: var(--on-accent-muted); margin-top: 4px; }

/* ── 5e: Sesión guardada diferenciada ── */
.sesion-ro-header-wrap {
  background: linear-gradient(135deg, var(--brand-bg), var(--brand-bg));
  color: var(--on-accent); padding: 20px 16px 16px; position: relative;
}
.sesion-ro-header-wrap h2   { color: var(--on-accent); font-size: 1.1rem; margin: 0 0 4px; font-weight: 800; }
.sesion-ro-header-wrap .vh-sub    { color: var(--on-accent-muted); font-size: .82rem; }
.sesion-ro-header-wrap .vh-horario { color: var(--on-accent-muted); font-size: .76rem; margin-top: 6px; white-space: pre-line; }
.sesion-ro-edit-btn {
  position: absolute; top: 14px; right: 14px;
  background: var(--on-accent-wash); color: var(--on-accent);
  border: 1.5px solid var(--on-accent-border);
  padding: 6px 14px; border-radius: 20px;
  font-size: .78rem; font-weight: 700; cursor: pointer;
}
.sesion-ro-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--on-accent-wash); color: var(--on-accent);
  font-size: .65rem; font-weight: 800; padding: 3px 10px;
  border-radius: 10px; text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 8px;
}
.sesion-ro-resumen {
  display: flex; border-bottom: 1px solid var(--borde);
}
.sesion-ro-stat {
  flex: 1; padding: 12px 8px; text-align: center;
  border-right: 1px solid var(--borde);
}
.sesion-ro-stat:last-child { border-right: none; }
.sesion-ro-stat-val { font-size: 1.5rem; font-weight: 900; line-height: 1; }
.sesion-ro-stat-lab { font-size: .6rem; color: var(--texto-sec); margin-top: 4px; text-transform: uppercase; letter-spacing: .3px; }
.sesion-ro-stat.p .sesion-ro-stat-val { color: var(--verde); }
.sesion-ro-stat.a .sesion-ro-stat-val { color: var(--rojo); }
.sesion-ro-stat.r .sesion-ro-stat-val { color: var(--naranja); }
.sesion-ro-incid-hdr {
  padding: 10px 16px 4px;
  font-size: .7rem; font-weight: 800; color: var(--rojo);
  text-transform: uppercase; letter-spacing: .5px;
}
.sesion-ro-justif-hdr { color: var(--verde); }
.justif-ro-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--borde);
  cursor: pointer; transition: background .15s;
}
.justif-ro-item:hover { background: var(--verde-s); }
.justif-ro-item:last-child { border-bottom: none; }
.btn-justif-pdf {
  flex-shrink: 0; background: none; border: 1px solid var(--borde);
  border-radius: 6px; padding: 4px 8px; font-size: .65rem;
  color: var(--texto-sec); cursor: pointer; white-space: nowrap;
  margin-left: 4px;
}
.btn-justif-pdf:hover { background: var(--verde-s); color: var(--verde); border-color: var(--verde); }


/* ── 6c: Filas compactas jugadores en sesión guardada ── */
.jug-ro-mini {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; border-bottom: 1px solid var(--borde);
}
.jug-ro-mini:last-child { border-bottom: none; }
.jug-ro-mini.P { background: var(--verde-s); }
.jug-ro-mini.P .jrm-avatar { background: var(--verde); color: var(--on-accent); }
.jug-ro-mini.A { background: var(--rojo-s); }
.jug-ro-mini.A .jrm-avatar { background: var(--rojo); color: var(--on-accent); }
.jug-ro-mini.R { background: var(--naranja-s); }
.jug-ro-mini.R .jrm-avatar { background: var(--naranja); color: var(--on-accent); }
.jrm-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--borde); color: var(--texto-sec);
  display: flex; align-items: center; justify-content: center;
  font-size: .62rem; font-weight: 700; flex-shrink: 0;
}
.jrm-info {
  flex: 1; min-width: 0; display: flex;
  align-items: center; gap: 5px; flex-wrap: wrap;
}
.jrm-nombre { font-size: .8rem; font-weight: 600; }
.jrm-tag {
  font-size: .62rem; color: var(--texto-sec);
  background: var(--borde); padding: 1px 5px; border-radius: 6px;
}
.jrm-tag.justif { background: var(--fondo); color: var(--verde); }

/* ── 6c: Chip de estado con texto completo ── */
.ro-chip {
  flex-shrink: 0; border-radius: 20px;
  padding: 2px 9px; font-size: .68rem; font-weight: 700;
  background: var(--borde); color: var(--texto-sec);
}
.ro-chip.P { background: var(--verde-s); color: var(--verde); }
.ro-chip.A { background: var(--rojo-s); color: var(--rojo); }
.ro-chip.R { background: var(--naranja-s); color: var(--naranja); }
.ro-chip.none { background: var(--borde); color: var(--texto-sec); }

/* ── 6c: Filas compactas entrenadores en sesión guardada ── */
.ent-ro-mini {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-bottom: 1px solid var(--borde);
}
.ent-ro-mini:last-child { border-bottom: none; }
.ent-ro-mini .ent-nombre { font-size: .82rem; }
.ent-ro-mini .ent-sub { font-size: .68rem; color: var(--texto-sec); }

/* Rachas: brasa, chispa, llama y modo inferno. */
.stats-streak-tier-0 { --streak-fire:var(--texto-sec); --streak-core:var(--borde); --streak-halo:var(--fondo); --streak-ink:var(--texto-sec); }
.stats-streak-tier-1 { --streak-fire:var(--ambar); --streak-core:var(--stats-gold); --streak-halo:var(--ambar-s); --streak-ink:var(--ambar); }
.stats-streak-tier-2 { --streak-fire:var(--ambar); --streak-core:var(--stats-gold); --streak-halo:var(--ambar-s); --streak-ink:var(--ambar); }
.stats-streak-tier-3 { --streak-fire:var(--ambar); --streak-core:var(--morado-s); --streak-halo:var(--rojo-s); --streak-ink:var(--rojo); }
.stats-streak-tier-4 { --streak-fire:var(--rojo); --streak-core:var(--morado-s); --streak-halo:var(--rojo-s); --streak-ink:var(--rojo); }
.stats-streak-tier-5 { --streak-fire:var(--rojo); --streak-core:var(--ambar); --streak-halo:var(--rojo-s); --streak-ink:var(--rojo); }
.stats-streak { position:relative; display:grid; grid-template-columns:42px minmax(0,1fr); align-items:center; gap:12px; margin:12px 16px; padding:10px 14px; border:1px solid color-mix(in srgb,var(--streak-fire) 22%,var(--blanco)); border-radius:16px; background:linear-gradient(110deg,var(--streak-halo),var(--blanco)); overflow:hidden; }
.stats-streak-art { align-self:center; }
.stats-streak-flame { display:block; width:100%; overflow:visible; }
.stats-streak-glow { fill:var(--streak-fire); opacity:.15; }
.stats-streak-outer { fill:var(--streak-fire); transform-origin:50px 110px; animation:stats-streak-flicker 2.4s ease-in-out infinite alternate; }
.stats-streak-inner { fill:var(--streak-core); transform-origin:50px 104px; animation:stats-streak-flicker 1.8s ease-in-out infinite alternate-reverse; }
.stats-streak-tier-0 .stats-streak-outer,.stats-streak-tier-0 .stats-streak-inner { animation:none; transform:translateY(38px) scaleY(.55); }
.stats-streak-tier-1 .stats-streak-outer { transform:scale(.75); }
.stats-streak-tier-2 .stats-streak-outer { animation-duration:2.1s; }
.stats-streak-tier-3 .stats-streak-art { filter:drop-shadow(0 0 8px var(--shadow-color)); }
.stats-streak-tier-4 .stats-streak-art { filter:drop-shadow(0 0 12px var(--shadow-color)); }
.stats-streak-tier-5 .stats-streak-art { filter:drop-shadow(0 0 16px var(--shadow-color)); }
.stats-streak-sparks { fill:var(--streak-fire); animation:stats-streak-sparks 1.6s ease-out infinite; }
.stats-streak-sparks circle:nth-child(even) { fill:var(--streak-core); }
.stats-streak-count { display:flex; align-items:center; gap:7px; color:var(--streak-ink); font-size:1.75rem; font-weight:850; line-height:1.15; font-variant-numeric:tabular-nums; }
.stats-streak-count span { color:var(--texto); font-size:.78rem; font-weight:700; letter-spacing:0; }
.stats-streak-best { display:flex; align-items:center; gap:4px; font-size:.67rem; color:var(--texto-sec); margin-top:1px; }
.stats-streak-mini { display:inline-flex; align-items:center; gap:3px; border-radius:99px; padding:2px 7px 2px 3px; margin:3px 3px 3px 0; font-size:.68rem; line-height:1.2; color:var(--streak-ink); background:var(--streak-halo); vertical-align:middle; white-space:nowrap; }
.stats-streak-mini .stats-streak-flame { width:19px; height:23px; }
.stats-streak-mini .stats-streak-outer,.stats-streak-mini .stats-streak-inner,.stats-streak-mini .stats-streak-sparks { animation:none; }
@keyframes stats-streak-flicker { from { rotate:-2deg; scale:.97 1; } to { rotate:2deg; scale:1.02 .96; } }
@keyframes stats-streak-sparks { from { opacity:0; transform:translateY(10px); } 25% { opacity:1; } to { opacity:0; transform:translateY(-13px); } }
@media (max-width:360px) { .stats-streak { gap:8px; padding:10px; grid-template-columns:34px minmax(0,1fr); } .stats-streak-count { gap:5px; font-size:1.5rem; } .stats-streak-count span { font-size:.7rem; } }
@media (prefers-reduced-motion:reduce) { .stats-streak-flame * { animation:none !important; } }

/* Interactive statistics charts */
.stats-chart { position:relative; min-width:0; }
.stats-chart-caption { color:var(--texto-sec); font-size:.78rem; margin:0 0 16px; line-height:1.5; }
.stats-chart [data-stats-tip] { cursor:pointer; -webkit-tap-highlight-color:transparent; transition:filter .15s,box-shadow .15s; }
.stats-chart [data-stats-tip]:hover { filter:brightness(1.08); }
.stats-chart [data-stats-tip]:focus-visible,.stats-chart .stats-selected { outline:3px solid var(--brand-bg); outline-offset:3px; border-radius:7px; }
.stats-chart svg [data-stats-tip]:focus-visible,.stats-chart svg .stats-selected { outline:none; stroke:var(--morado); stroke-width:3px; filter:drop-shadow(0 0 3px var(--morado-s)); }
.stats-chart svg .stats-donut-segment:focus-visible,.stats-chart svg .stats-donut-segment.stats-selected { stroke-width:24px; }
.stats-chart svg g:focus-visible,.stats-chart svg g.stats-selected { stroke:none; }
.stats-chart-tooltip { position:fixed; z-index:20000; display:grid; gap:2px; width:max-content; max-width:min(240px,calc(100vw - 16px)); padding:7px 11px; border:1px solid var(--borde); border-radius:10px; color:var(--texto); background:var(--blanco); box-shadow:0 6px 18px var(--shadow-color); font-size:.72rem; line-height:1.3; pointer-events:none; animation:stats-tip-in .14s ease-out; }
.stats-chart-tooltip::after { content:''; position:absolute; left:var(--stats-tip-arrow,50%); bottom:-6px; width:10px; height:10px; margin-left:-5px; background:var(--blanco); border:solid var(--borde); border-width:0 1px 1px 0; transform:rotate(45deg); }
.stats-chart-tooltip.is-below::after { top:-6px; bottom:auto; border-width:1px 0 0 1px; }
.stats-chart-tooltip[hidden] { display:none; }
.stats-tip-main { display:flex; align-items:baseline; gap:6px; min-width:0; }
.stats-tip-label { min-width:0; overflow:hidden; color:var(--texto-sec); font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
.stats-tip-value { flex:none; color:var(--texto); font-size:.86rem; font-weight:800; font-variant-numeric:tabular-nums; }
.stats-tip-sub { color:var(--texto-sec); font-size:.66rem; }
@keyframes stats-tip-in { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .stats-chart-tooltip { animation:none; } }
.stats-chart-grid { stroke:var(--fondo); stroke-dasharray:3 4; }
.stats-axis { font-size:9px; fill:var(--texto-sec); }
.stats-weekly { width:100%; min-height:160px; overflow:visible; }
.stats-line-point { stroke:var(--blanco); stroke-width:2px; }
.stats-chart .heat-cell { font:inherit; font-size:.65rem; border:0; padding:0; min-width:28px; min-height:28px; }
.stats-chart-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:9px 18px; margin:4px 0 20px; color:var(--texto-sec); font-size:.74rem; }
.stats-chart-legend>span { display:inline-flex; align-items:center; gap:6px; }
.stats-chart-legend i,.stats-donut-legend i { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.stats-columns-scroll { overflow-x:auto; padding:24px 5px 5px; }
.stats-columns { display:grid; grid-template-columns:30px repeat(var(--stats-columns),minmax(58px,1fr)); gap:12px; min-width:calc(30px + var(--stats-columns) * 70px); background:repeating-linear-gradient(to top,transparent 0,transparent 79px,var(--fondo) 79px,var(--fondo) 80px); background-size:100% 160px; background-repeat:no-repeat; }
.stats-yaxis { height:160px; display:flex; flex-direction:column; justify-content:space-between; color:var(--texto-sec); font-size:.65rem; text-align:right; padding-right:4px; }
.stats-column { min-width:0; padding:0 4px; }
.stats-column-plot { height:160px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; }
.stats-column-value { position:absolute; top:-17px; color:var(--morado); font-size:.72rem; font-weight:800; }
.stats-column-stack { display:flex; flex-direction:column-reverse; width:100%; max-width:42px; border-radius:8px 8px 3px 3px; overflow:hidden; min-height:1px; box-shadow:0 3px 8px var(--shadow-color); }
.stats-column-stack>span { display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--texto); font-size:.64rem; font-weight:800; overflow:hidden; }
.stats-column-label { display:block; text-align:center; font-size:.65rem; line-height:1.4; color:var(--texto-sec); padding-top:10px; min-height:38px; overflow-wrap:anywhere; }
.stats-hrow { margin-bottom:18px; padding:3px; }
.stats-hlabel { display:flex; justify-content:space-between; gap:16px; margin-bottom:8px; font-size:.8rem; }
.stats-hlabel>span { overflow-wrap:anywhere; }
.stats-hlabel strong { color:var(--morado); white-space:nowrap; }
.stats-htrack { display:flex; min-height:26px; border-radius:8px; background:var(--fondo); }
.stats-hsegment { display:flex; align-items:center; justify-content:center; min-height:26px; color:var(--chart-ink); font-size:.68rem; font-weight:800; border-radius:3px; }
.stats-hpercent { background:linear-gradient(90deg,var(--stats-coral),var(--stats-positive)); }
.stats-percent-row small { display:block; margin-top:5px; color:var(--texto-sec); font-size:.68rem; }
.stats-donut { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px 20px; }
.stats-donut>svg { width:180px; max-width:100%; height:180px; overflow:visible; flex-shrink:0; }
.stats-donut-number { font-size:26px; font-weight:850; fill:var(--morado); letter-spacing:-1px; }
.stats-donut-caption { font-size:10px; fill:var(--texto-sec); }
